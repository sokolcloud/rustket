[package]
name = "rustket"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Native Rocket.Chat desktop client"

[dependencies]
arboard = "3.7.0"
chrono = "0.4"
directories = "6"
futures = "0.3"
hex = "0.4"
iced = { version = "0.14.0", features = ["tokio", "image", "advanced", "lazy", "qr_code"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ksni = "0.3.7"
open = "5.4.5"
rfd = "0.18.0"
rocketchat = { version = "0.1.0", path = "../rocketchat" }
rust-i18n = "4"
rustket-core = { version = "0.1.0", path = "../rustket-core" }
rustket-ui = { version = "0.1.0", path = "../rustket-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
url = "2"
webbrowser = "1.2.6"
x11rb = { version = "0.13", default-features = false, features = ["screensaver"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints]
workspace = true

# Icon and version info of rustket.exe (build.rs). Platform tables of build
# dependencies match the host, so other hosts never build it.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
iced_runtime = "0.14"
iced_tiny_skia = "0.14"
png = "0.18"
tempfile = "3"
tiny-skia = "0.11"

# Optional path for cargo-deb users (not exercised; the maintained path is
# packaging/deb/build.sh, which needs only dpkg-deb):
#   python3 -I packaging/notices.py >packaging/out/THIRD-PARTY-NOTICES
#   cargo deb -p rustket --profile dist --no-strip
# (cargo-deb maps `target/release/` to the selected profile; --no-strip keeps the
# symbols the dist profile leaves for crash backtraces). tests/packaging.rs
# checks that depends/recommends, icons and the copyright header skip stay in
# sync with packaging/.
[package.metadata.deb]
name = "rustket"
maintainer = "Sergey Sokolov <sokol@xi-ix.org>"
copyright = "2026 Sergey Sokolov"
# cargo-deb writes its own header paragraph; skip ours (up to the first blank line).
license-file = ["../../packaging/deb/copyright", "8"]
extended-description = """\
Rustket is a lightweight Rocket.Chat client written in Rust that renders \
rooms, threads, end-to-end encrypted chats, apps, omnichannel and \
administration natively instead of embedding a web browser."""
section = "net"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6"
recommends = "libwayland-client0, libwayland-egl1, libegl1, libvulkan1, libdbus-1-3, xdg-desktop-portal-gtk | xdg-desktop-portal-kde | xdg-desktop-portal-gnome | zenity, pipewire-bin | pulseaudio-utils | gnome-session-canberra, sound-theme-freedesktop, xdg-utils"
suggests = "gnome-keyring | kwalletmanager | keepassxc"
assets = [
    ["target/release/rustket", "usr/bin/", "755"],
    ["../../packaging/linux/rustket.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/rustket.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/rustket.1", "usr/share/man/man1/rustket.1", "644"],
    ["../../packaging/out/THIRD-PARTY-NOTICES", "usr/share/doc/rustket/THIRD-PARTY-NOTICES", "644"],
    ["../../packaging/deb/lintian-overrides", "usr/share/lintian/overrides/rustket", "644"],
    ["assets/icons/rustket-16.png", "usr/share/icons/hicolor/16x16/apps/rustket.png", "644"],
    ["assets/icons/rustket-22.png", "usr/share/icons/hicolor/22x22/apps/rustket.png", "644"],
    ["assets/icons/rustket-24.png", "usr/share/icons/hicolor/24x24/apps/rustket.png", "644"],
    ["assets/icons/rustket-32.png", "usr/share/icons/hicolor/32x32/apps/rustket.png", "644"],
    ["assets/icons/rustket-48.png", "usr/share/icons/hicolor/48x48/apps/rustket.png", "644"],
    ["assets/icons/rustket-64.png", "usr/share/icons/hicolor/64x64/apps/rustket.png", "644"],
    ["assets/icons/rustket-128.png", "usr/share/icons/hicolor/128x128/apps/rustket.png", "644"],
    ["assets/icons/rustket-256.png", "usr/share/icons/hicolor/256x256/apps/rustket.png", "644"],
    ["assets/icons/rustket-512.png", "usr/share/icons/hicolor/512x512/apps/rustket.png", "644"],
]
