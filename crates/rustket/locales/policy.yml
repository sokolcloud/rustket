policy.secret_store_memory:
  en: "The system keyring is unavailable. Your organization does not allow storing login tokens and E2E keys in a file: they are kept in memory for this session only, and after a restart you sign in again and enter your E2E password."
  ru: "Системное хранилище паролей недоступно. Ваша организация не разрешает хранить токены входа и ключи E2E в файле: они хранятся в памяти только до закрытия приложения, после перезапуска нужно снова войти и ввести пароль E2E."
  es: "El llavero del sistema no está disponible. Tu organización no permite guardar los tokens de inicio de sesión ni las claves E2E en un archivo: se guardan en memoria solo durante esta sesión y, después de reiniciar, vuelves a iniciar sesión e introduces tu contraseña E2E."
  th: "ที่เก็บรหัสผ่านของระบบไม่พร้อมใช้งาน องค์กรของคุณไม่อนุญาตให้เก็บโทเค็นการเข้าสู่ระบบและคีย์ E2E ในไฟล์ จึงเก็บไว้ในหน่วยความจำเฉพาะเซสชันนี้เท่านั้น หลังจากเปิดโปรแกรมใหม่ คุณต้องลงชื่อเข้าใช้อีกครั้งและป้อนรหัสผ่าน E2E"
  zh: "系统密钥环不可用。你的组织不允许将登录令牌和 E2EE 密钥保存在文件中：它们仅在本次会话期间保存在内存中，重启后需要重新登录并输入你的 E2EE 密码。"
