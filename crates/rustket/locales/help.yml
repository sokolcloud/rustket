help.code.m2.trigger:
  en: "A plain message in a 1:1 or group direct message. A direct message is loud: it takes the mention colour in its row, in the All unreads list (sorted with the mentions), on the workspace icon, in the window title and in the tray; the All unreads counter itself stays the unread colour. Activity lists no direct messages: it is a feed of mentions and threads."
  ru: "Обычное сообщение в личной переписке или групповом личном чате. Личные сообщения заметны: они получают цвет упоминания в строке комнаты, в списке «Всех непрочитанных» (вместе с упоминаниями), на значке рабочего пространства, в заголовке окна и в трее; сам счётчик «Всех непрочитанных» остаётся цвета непрочитанного. «Активность» не показывает личные сообщения: это лента упоминаний и тредов."
  es: "Un mensaje normal en un mensaje directo 1:1 o de grupo. Un mensaje directo es llamativo: toma el color de mención en su fila, en la lista de Todos los no leídos (junto a las menciones), en el icono del espacio, en el título de la ventana y en la bandeja; el contador de Todos los no leídos sigue con el color de no leídos. Actividad no muestra mensajes directos: es un feed de menciones e hilos."
  th: "ข้อความทั่วไปในแชตส่วนตัวแบบตัวต่อตัวหรือแบบกลุ่ม ข้อความส่วนตัวเป็นสิ่งที่ต้องสังเกต: ใช้สีการกล่าวถึงในแถวของห้อง ในรายการยังไม่ได้อ่านทั้งหมด (เรียงรวมกับการกล่าวถึง) บนไอคอนเวิร์กสเปซ ในชื่อหน้าต่าง และในถาด ส่วนตัวนับยังไม่ได้อ่านทั้งหมดยังคงเป็นสียังไม่ได้อ่าน กิจกรรมไม่แสดงข้อความส่วนตัว เพราะเป็นฟีดของการกล่าวถึงและเธรด"
  zh: "一对一或群组私信中的普通消息。私信是醒目的：在房间行、“全部未读”列表（与提及排在一起）、工作区图标、窗口标题和托盘中都使用提及色；“全部未读”计数本身仍为未读色。“动态”不列出私信：它是提及和讨论串的动态。"
help.code.m2.trigger_macos:
  en: "A plain message in a 1:1 or group direct message. A direct message is loud: it takes the mention colour in its row, in the All unreads list (sorted with the mentions), on the workspace icon and in the window title, puts the dot on the menu bar icon and counts in the number on the Dock icon; the All unreads counter itself stays the unread colour. Activity lists no direct messages: it is a feed of mentions and threads."
  ru: "Обычное сообщение в личной переписке или групповом личном чате. Личные сообщения заметны: они получают цвет упоминания в строке комнаты, в списке «Всех непрочитанных» (вместе с упоминаниями), на значке рабочего пространства и в заголовке окна, ставят точку на значке в строке меню и учитываются в числе на значке в Dock; сам счётчик «Всех непрочитанных» остаётся цвета непрочитанного. «Активность» не показывает личные сообщения: это лента упоминаний и тредов."
  es: "Un mensaje normal en un mensaje directo 1:1 o de grupo. Un mensaje directo es llamativo: toma el color de mención en su fila, en la lista de Todos los no leídos (junto a las menciones), en el icono del espacio y en el título de la ventana, pone el punto en el icono de la barra de menús y cuenta en el número del icono del Dock; el contador de Todos los no leídos sigue con el color de no leídos. Actividad no muestra mensajes directos: es un feed de menciones e hilos."
  th: "ข้อความทั่วไปในแชตส่วนตัวแบบตัวต่อตัวหรือแบบกลุ่ม ข้อความส่วนตัวเป็นสิ่งที่ต้องสังเกต: ใช้สีการกล่าวถึงในแถวของห้อง ในรายการยังไม่ได้อ่านทั้งหมด (เรียงรวมกับการกล่าวถึง) บนไอคอนเวิร์กสเปซ และในชื่อหน้าต่าง แสดงจุดบนไอคอนในแถบเมนู และนับรวมในตัวเลขบนไอคอนใน Dock ส่วนตัวนับยังไม่ได้อ่านทั้งหมดยังคงเป็นสียังไม่ได้อ่าน กิจกรรมไม่แสดงข้อความส่วนตัว เพราะเป็นฟีดของการกล่าวถึงและเธรด"
  zh: "一对一或群组私信中的普通消息。私信是醒目的：在房间行、“全部未读”列表（与提及排在一起）、工作区图标和窗口标题中都使用提及色，在菜单栏图标上显示圆点，并计入程序坞图标上的数字；“全部未读”计数本身仍为未读色。“动态”不列出私信：它是提及和讨论串的动态。"
