  en: "Highlight word"
  ru: "Выделяемое слово"
  es: "Palabra resaltada"
  th: "คำที่ไฮไลต์"
  zh: "高亮词"
help.code.m4.trigger:
  en: "One of your highlighted words (My account → Preferences), as a whole word in any case. The server counts it as a mention; in the timeline and the thread the row is highlighted like a mention and the word is marked."
  ru: "Одно из ваших выделяемых слов («Мой аккаунт» → «Предпочтения»), целым словом в любом регистре. Сервер считает его упоминанием; в ленте и в треде строка подсвечивается как упоминание, а слово выделяется."
  es: "Una de tus palabras resaltadas (Mi cuenta → Preferencias), como palabra completa y sin distinguir mayúsculas. El servidor lo cuenta como mención; en el chat y en el hilo la fila se resalta como una mención y la palabra se marca."
  th: "คำที่ไฮไลต์ของคุณ (บัญชีของฉัน → การตั้งค่า) แบบทั้งคำ ไม่สนตัวพิมพ์ เซิร์ฟเวอร์นับเป็นการกล่าวถึง ในฟีดและในเธรด แถวจะถูกไฮไลต์เหมือนการกล่าวถึงและคำนั้นถูกทำเครื่องหมาย"
  zh: "你的高亮词之一（“我的账户”→“偏好设置”），按整词匹配，不区分大小写。服务器将其计为提及；在消息流和讨论串中，该行像提及一样高亮，该词会被标出。"
help.code.m5.title:
  en: "Plain message in a channel"
  ru: "Обычное сообщение в канале"
  es: "Mensaje normal en un canal"
  th: "ข้อความทั่วไปในช่อง"
  zh: "频道中的普通消息"
help.code.m5.trigger:
  en: "A message in a channel or private group with no mention. Unless the server counts every message, it only marks the room: a dot in the unread colour and a bold name."
  ru: "Сообщение в канале или приватной группе без упоминаний. Если сервер не считает все сообщения, он только отмечает комнату: точка цвета непрочитанного и жирное название."
  es: "Un mensaje en un canal o grupo privado sin menciones. Salvo que el servidor cuente todos los mensajes, solo marca la sala: un punto del color de no leídos y el nombre en negrita."
  th: "ข้อความในช่องหรือกลุ่มส่วนตัวที่ไม่มีการกล่าวถึง หากเซิร์ฟเวอร์ไม่ได้นับทุกข้อความ จะเพียงทำเครื่องหมายห้อง: จุดสียังไม่ได้อ่านและชื่อตัวหนา"
  zh: "频道或私有群组中不含提及的消息。除非服务器计数每条消息，否则只标记房间：未读色圆点和加粗的名称。"
help.code.t1.title:
  en: "Plain thread reply"
  ru: "Обычный ответ в треде"
  es: "Respuesta normal en un hilo"
  th: "คำตอบทั่วไปในเธรด"
  zh: "讨论串中的普通回复"
help.code.t1.trigger:
  en: "A reply in a thread you follow. Unread thread replies use the thread colour everywhere: the room's counter, the thread row, the collapsed Threads header, the room header's Threads button, Activity."
  ru: "Ответ в треде, который вы отслеживаете. Непрочитанные ответы в тредах везде показываются цветом тредов: счётчик комнаты, строка треда, свёрнутый раздел «Треды», кнопка «Треды» в заголовке комнаты, «Активность»."
  es: "Una respuesta en un hilo que sigues. Las respuestas de hilos no leídas usan el color de hilos en todas partes: el contador de la sala, la fila del hilo, la sección Hilos plegada, el botón Hilos de la cabecera de la sala, Actividad."
  th: "คำตอบในเธรดที่คุณติดตาม คำตอบเธรดที่ยังไม่ได้อ่านใช้สีเธรดทุกที่: ตัวนับของห้อง แถวเธรด ส่วนเธรดที่ยุบไว้ ปุ่มเธรดในส่วนหัวห้อง กิจกรรม"
  zh: "你关注的讨论串中的回复。未读的讨论串回复在所有地方都使用讨论串色：房间计数、讨论串行、折叠的“讨论串”分区、房间标题栏的“讨论串”按钮、“动态”。"
help.code.t2.title:
  en: "Thread reply that mentions me"
  ru: "Ответ в треде с упоминанием меня"
  es: "Respuesta en un hilo que me menciona"
  th: "คำตอบในเธรดที่กล่าวถึงฉัน"
  zh: "提及我的讨论串回复"
help.code.t2.trigger:
  en: "A reply in a thread that mentions you (or has your highlighted word)."
  ru: "Ответ в треде, где упомянули вас (или есть ваше выделяемое слово)."
  es: "Una respuesta en un hilo que te menciona (o contiene tu palabra resaltada)."
  th: "คำตอบในเธรดที่กล่าวถึงคุณ (หรือมีคำที่คุณไฮไลต์)"
  zh: "讨论串中提及你（或含你的高亮词）的回复。"
help.code.t3.title:
  en: "Thread reply with @all / @here"
  ru: "Ответ в треде с @all / @here"
  es: "Respuesta en un hilo con @all / @here"
  th: "คำตอบในเธรดที่มี @all / @here"
  zh: "含 @all / @here 的讨论串回复"
help.code.t3.trigger:
  en: "A reply with @all or @here in a thread you follow. The server marks the thread unread with @all, not as a mention of you: the room's counter and the thread row show the @all colour (the thread colour if the room mutes @all and @here)."
  ru: "Ответ с @all или @here в треде, который вы отслеживаете. Сервер отмечает тред как непрочитанный с @all, а не как упоминание вас: счётчик комнаты и строка треда — цвета @all (цвета тредов, если комната заглушает @all и @here)."
  es: "Una respuesta con @all o @here en un hilo que sigues. El servidor marca el hilo como no leído con @all, no como una mención a ti: el contador de la sala y la fila del hilo usan el color de @all (el de hilos si la sala silencia @all y @here)."
  th: "คำตอบที่มี @all หรือ @here ในเธรดที่คุณติดตาม เซิร์ฟเวอร์ทำเครื่องหมายเธรดว่ายังไม่ได้อ่านแบบ @all ไม่ใช่การกล่าวถึงคุณ: ตัวนับของห้องและแถวเธรดใช้สี @all (ใช้สีเธรดหากห้องปิดเสียง @all และ @here)"
  zh: "你关注的讨论串中含 @all 或 @here 的回复。服务器将该讨论串标为含 @all 的未读，而不是提及你：房间计数和讨论串行显示 @all 色（若房间静音了 @all 和 @here，则为讨论串色）。"
help.code.l1.title:
  en: "Reminder due"
  ru: "Сработало напоминание"
  es: "Recordatorio pendiente"
  th: "ถึงเวลาการเตือน"
  zh: "提醒到期"
help.code.l1.trigger:
  en: "A “Later” reminder comes due, and while it is overdue. %{sound}, unless “Play a sound” or the reminder sound is off. While notifications are paused or your status is Busy, it shows without sound."
  ru: "Подошёл срок напоминания «Позже», и пока оно просрочено. %{sound}, если не выключены «Воспроизводить звук» или звук напоминаний. Пока уведомления на паузе или ваш статус «Занят», оно показывается без звука."
  es: "Llega la hora de un recordatorio de «Más tarde», y mientras está vencido. %{sound}, salvo que «Reproducir un sonido» o el sonido de los recordatorios estén desactivados. Mientras las notificaciones están en pausa o tu estado es Ocupado, se muestra sin sonido."
  th: "การเตือนใน “ภายหลัง” ถึงกำหนด และระหว่างที่เลยกำหนด %{sound} เว้นแต่ปิด “เล่นเสียง” หรือเสียงการเตือนไว้ ขณะหยุดการแจ้งเตือนชั่วคราวหรือสถานะเป็นไม่ว่าง จะแสดงโดยไม่มีเสียง"
  zh: "“稍后”提醒到期时，以及逾期期间。%{sound}，除非关闭了“播放提示音”或提醒提示音。通知暂停或你的状态为忙碌时，提醒会显示但没有声音。"
help.code.l1.sound:
  en: "It plays your account's New message sound"
  ru: "Звучит «Звук нового сообщения» из аккаунта"
  es: "Suena el Sonido de mensaje nuevo de tu cuenta"
  th: "เล่นเสียงข้อความใหม่ของบัญชี"
  zh: "播放账户的“新消息提示音”"
help.code.l1.sound_windows:
  en: "Its Windows notification plays the Windows notification sound (your account's New message sound when the notification cannot be shown)"
  ru: "Его уведомление Windows воспроизводит звук уведомления Windows (если уведомление не удалось показать — «Звук нового сообщения» из аккаунта)"
  es: "Su notificación de Windows reproduce el sonido de notificación de Windows (el Sonido de mensaje nuevo de tu cuenta si la notificación no se puede mostrar)"
  th: "การแจ้งเตือนของ Windows จะเล่นเสียงการแจ้งเตือนของ Windows (หากแสดงการแจ้งเตือนไม่ได้ จะเล่นเสียงข้อความใหม่ของบัญชี)"
  zh: "其 Windows 通知播放 Windows 通知提示音（无法显示通知时播放账户的“新消息提示音”）"
help.code.l2.title:
  en: "Missed reminders"
  ru: "Пропущенные напоминания"
  es: "Recordatorios perdidos"
  th: "การเตือนที่พลาดไป"
  zh: "错过的提醒"
help.code.l2.trigger:
  en: "Reminders that came due while Rustket was not running: “You missed N reminders”."
  ru: "Напоминания, сработавшие, пока Rustket не был запущен: «Вы пропустили N напоминаний»."
  es: "Recordatorios que vencieron mientras Rustket no estaba abierto: «Te perdiste N recordatorios»."
  th: "การเตือนที่ถึงกำหนดขณะที่ Rustket ไม่ได้ทำงาน: “คุณพลาดการเตือน N รายการ”"
  zh: "Rustket 未运行时到期的提醒：“你错过了 N 个提醒”。"
help.code.d1.title:
  en: "Scheduled message not sent"
  ru: "Отложенное сообщение не отправлено"
  es: "Mensaje programado no enviado"
  th: "ข้อความตั้งเวลาส่งไม่สำเร็จ"
  zh: "定时消息未发出"
help.code.d1.trigger:
  en: "A scheduled message was not sent on time."
  ru: "Отложенное сообщение не ушло вовремя."
  es: "Un mensaje programado no se envió a tiempo."
  th: "ข้อความตั้งเวลาไม่ได้ส่งตามเวลา"
  zh: "定时消息未按时发出。"
help.code.c1.title:
  en: "Incoming call"
  ru: "Входящий звонок"
  es: "Llamada entrante"
  th: "สายเรียกเข้า"
  zh: "来电"
help.code.c1.trigger:
  en: "A video conference rings you."
  ru: "Вам звонят через видеоконференцию."
  es: "Una videoconferencia te llama."
  th: "การประชุมทางวิดีโอโทรหาคุณ"
  zh: "视频会议向你呼叫。"
help.code.o1.title:
  en: "New omnichannel chat"
  ru: "Новый омниканальный чат"
  es: "Nuevo chat omnicanal"
  th: "แชตออมนิแชนเนลใหม่"
  zh: "新的全渠道会话"
help.code.o1.trigger:
  en: "A new chat or inquiry enters the omnichannel queue: the new chat sound. With manual routing the server also sends a desktop notification for each queued inquiry, shown like a message notification (desktop notifications on, not paused, not Busy)."
  ru: "В очередь омниканала пришёл новый чат или запрос: звук нового чата. При ручной маршрутизации сервер ещё присылает уведомление о каждом запросе в очереди; оно показывается как уведомление о сообщении (уведомления включены, нет паузы, статус не «Занят»)."
  es: "Un chat o consulta nueva entra en la cola omnicanal: el sonido de chat nuevo. Con el enrutamiento manual, el servidor también envía una notificación de escritorio por cada consulta en cola, que se muestra como una notificación de mensaje (notificaciones de escritorio activadas, sin pausa, no Ocupado)."
  th: "แชตหรือคำถามใหม่เข้าคิวออมนิแชนเนล: เสียงแชตใหม่ เมื่อการกำหนดเส้นทางเป็นแบบการเลือกด้วยตนเอง เซิร์ฟเวอร์จะส่งการแจ้งเตือนบนเดสก์ท็อปสำหรับคำถามแต่ละรายการในคิวด้วย ซึ่งแสดงเหมือนการแจ้งเตือนข้อความ (เปิดการแจ้งเตือนบนเดสก์ท็อป ไม่ได้หยุดชั่วคราว ไม่ได้อยู่ในสถานะไม่ว่าง)"
  zh: "新的会话或咨询进入全渠道队列：播放新会话提示音。使用手动分配时，服务器还会为队列中的每个咨询发送桌面通知，显示方式与消息通知相同（桌面通知已开启、未暂停、非忙碌）。"
help.code.r1.title:
  en: "“Receive notifications” off"
  ru: "«Получать уведомления» выключено"
  es: "«Recibir notificaciones» desactivado"
  th: "ปิด “รับการแจ้งเตือน”"
  zh: "关闭“接收通知”"
help.code.r1.trigger:
  en: "Room header → Notification preferences. The room is muted: its counters, dots and thread rows turn grey and no longer count as unread; mentions of you stay red. The table below shows what changes."
  ru: "Заголовок комнаты → «Настройки уведомлений». Комната заглушается: её счётчики, точки и строки тредов становятся серыми и не считаются непрочитанными; упоминания вас остаются красными. Что меняется — в таблице ниже."
  es: "Encabezado de la sala → Preferencias de notificaciones. La sala queda silenciada: sus contadores, puntos y filas de hilos se vuelven grises y ya no cuentan como no leídos; las menciones a ti siguen en rojo. La tabla de abajo muestra qué cambia."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน ห้องจะถูกปิดเสียง: ตัวนับ จุด และแถวเธรดของห้องเป็นสีเทาและไม่นับเป็นยังไม่ได้อ่าน การกล่าวถึงคุณยังเป็นสีแดง ตารางด้านล่างแสดงสิ่งที่เปลี่ยน"
  zh: "房间标题 → 通知偏好。房间被静音：其计数、圆点和讨论串行变为灰色，不再计为未读；提及你的仍为红色。下表显示变化。"
help.code.r2.title:
  en: "“Show unread counter” off"
  ru: "«Показывать счётчик непрочитанных» выключено"
  es: "«Mostrar contador de no leídos» desactivado"
  th: "ปิด “แสดงจำนวนที่ยังไม่ได้อ่าน”"
  zh: "关闭“显示未读计数”"
help.code.r2.trigger:
  en: "Room header → Notification preferences. The table below shows what changes."
  ru: "Заголовок комнаты → «Настройки уведомлений». Что меняется — в таблице ниже."
  es: "Encabezado de la sala → Preferencias de notificaciones. La tabla de abajo muestra qué cambia."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน ตารางด้านล่างแสดงสิ่งที่เปลี่ยน"
  zh: "房间标题 → 通知偏好。下表显示变化。"
help.code.r3.title:
  en: "“Show mention badges” off"
  ru: "«Показывать значки упоминаний» выключено"
  es: "«Mostrar insignias de menciones» desactivado"
  th: "ปิด “แสดงป้ายการกล่าวถึง”"
  zh: "关闭“显示提及标记”"
help.code.r3.trigger:
  en: "Room header → Notification preferences. Rustket then shows no mention or @all colour in this room's badges and dots (room row, thread rows, collapsed sections, Activity, totals): a visible counter takes the unread or thread colour. Rocket.Chat's web client keeps it red. Messages in the timeline are still highlighted. The table below shows what changes."
  ru: "Заголовок комнаты → «Настройки уведомлений». Тогда Rustket не показывает цвета упоминания и @all в счётчиках и точках этой комнаты (строка комнаты, строки тредов, свёрнутые разделы, «Активность», итоги): видимый счётчик получает цвет непрочитанного или тредов. Веб-клиент Rocket.Chat оставляет его красным. Сообщения в ленте по-прежнему подсвечиваются. Что меняется — в таблице ниже."
  es: "Encabezado de la sala → Preferencias de notificaciones. Rustket deja de mostrar el color de mención y de @all en los contadores y puntos de esta sala (fila de la sala, filas de hilos, secciones plegadas, Actividad, totales): un contador visible usa el color de no leídos o de hilos. El cliente web de Rocket.Chat lo mantiene en rojo. Los mensajes de la conversación se siguen resaltando. La tabla de abajo muestra qué cambia."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน จากนั้น Rustket จะไม่แสดงสีการกล่าวถึงหรือสี @all ในตัวนับและจุดของห้องนี้ (แถวห้อง แถวเธรด ส่วนที่ยุบไว้ กิจกรรม ยอดรวม): ตัวนับที่ยังแสดงจะใช้สียังไม่ได้อ่านหรือสีเธรด เว็บไคลเอนต์ของ Rocket.Chat ยังคงแสดงเป็นสีแดง ข้อความในไทม์ไลน์ยังคงถูกไฮไลต์ ตารางด้านล่างแสดงสิ่งที่เปลี่ยน"
  zh: "房间标题 → 通知偏好。此后 Rustket 不再在此房间的计数和圆点中（房间行、讨论串行、折叠的分区、“动态”、汇总）显示提及色和 @all 色：可见的计数改用未读色或讨论串色。Rocket.Chat 网页客户端仍显示红色。时间线中的消息仍会高亮。下表显示变化。"
help.code.r4.title:
  en: "“Mute @all and @here mentions”"
  ru: "«Заглушить упоминания @all и @here»"
  es: "«Silenciar menciones @all y @here»"
  th: "“ปิดเสียงการกล่าวถึง @all และ @here”"
  zh: "“静音 @all 和 @here 提及”"
help.code.r4.trigger:
  en: "Room header → Notification preferences. @all and @here in this room then count as plain unread everywhere: the unread colour (the thread colour in a thread) and no row highlight in the timeline (the @all chip keeps its colour). The table below shows what changes."
  ru: "Заголовок комнаты → «Настройки уведомлений». Тогда @all и @here в этой комнате везде считаются обычным непрочитанным: цвет непрочитанного (цвет тредов в треде), без подсветки строки в ленте (чип @all сохраняет свой цвет). Что меняется — в таблице ниже."
  es: "Encabezado de la sala → Preferencias de notificaciones. @all y @here en esta sala cuentan entonces como no leídos normales en todas partes: el color de no leídos (el de hilos en un hilo) y sin resaltar la fila en la conversación (la etiqueta @all conserva su color). La tabla de abajo muestra qué cambia."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน จากนั้น @all และ @here ในห้องนี้จะนับเป็นข้อความที่ยังไม่ได้อ่านทั่วไปทุกที่: ใช้สียังไม่ได้อ่าน (สีเธรดในเธรด) และไม่ไฮไลต์แถวในไทม์ไลน์ (ป้าย @all ยังคงสีเดิม) ตารางด้านล่างแสดงสิ่งที่เปลี่ยน"
  zh: "房间标题 → 通知偏好。此后此房间中的 @all 和 @here 在所有地方都按普通未读处理：使用未读色（讨论串中为讨论串色），时间线中整行不高亮（@all 标签保留其颜色）。下表显示变化。"
help.code.r5.title:
  en: "Room desktop alert"
  ru: "Оповещение комнаты на компьютере"
  es: "Alerta de escritorio de la sala"
  th: "การแจ้งเตือนบนเดสก์ท็อปของห้อง"
  zh: "房间桌面提醒"
help.code.r5.trigger:
  en: "Room header → Notification preferences → Desktop → Alert: all messages, mentions or nothing. Overrides your account's setting."
  ru: "Заголовок комнаты → «Настройки уведомлений» → «Компьютер» → «Оповещение»: все сообщения, упоминания или ничего. Важнее настройки аккаунта."
  es: "Encabezado de la sala → Preferencias de notificaciones → Escritorio → Alerta: todos los mensajes, menciones o nada. Prevalece sobre el ajuste de tu cuenta."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน → เดสก์ท็อป → การแจ้งเตือน: ทุกข้อความ การกล่าวถึง หรือไม่มี มีผลเหนือการตั้งค่าของบัญชี"
  zh: "房间标题 → 通知偏好 → 桌面 → 提醒：所有消息、提及或无。优先于账户设置。"
help.code.q1.title:
  en: "Paused by hand"
  ru: "Пауза вручную"
  es: "Pausa manual"
  th: "หยุดชั่วคราวด้วยตนเอง"
  zh: "手动暂停"
help.code.q1.trigger:
  en: "Status menu or tray → Pause notifications. No message notifications and no sounds; reminders and the call card still show, counters still update. %{dnd}"
  ru: "Меню статуса или трей → «Приостановить уведомления». Нет уведомлений о сообщениях и звуков; напоминания и карточка звонка показываются, счётчики обновляются. %{dnd}"
  es: "Menú de estado o bandeja → Pausar notificaciones. Sin notificaciones de mensajes ni sonidos; los recordatorios y la tarjeta de llamada se siguen mostrando y los contadores se actualizan. %{dnd}"
  th: "เมนูสถานะหรือถาด → หยุดการแจ้งเตือนชั่วคราว ไม่มีการแจ้งเตือนข้อความและเสียง การเตือนความจำและการ์ดสายเรียกเข้ายังแสดง ตัวนับยังอัปเดต %{dnd}"
  zh: "状态菜单或托盘 → 暂停通知。不显示消息通知、不播放声音；提醒和来电卡片仍会显示，计数照常更新。%{dnd}"
help.code.q1.trigger_macos:
  en: "Status menu or menu bar icon → Pause notifications. No message notifications and no sounds; reminders and the call card still show, counters still update. %{dnd}"
  ru: "Меню статуса или значок в строке меню → «Приостановить уведомления». Нет уведомлений о сообщениях и звуков; напоминания и карточка звонка показываются, счётчики обновляются. %{dnd}"
  es: "Menú de estado o icono de la barra de menús → Pausar notificaciones. Sin notificaciones de mensajes ni sonidos; los recordatorios y la tarjeta de llamada se siguen mostrando y los contadores se actualizan. %{dnd}"
  th: "เมนูสถานะหรือไอคอนในแถบเมนู → หยุดการแจ้งเตือนชั่วคราว ไม่มีการแจ้งเตือนข้อความและเสียง การเตือนความจำและการ์ดสายเรียกเข้ายังแสดง ตัวนับยังอัปเดต %{dnd}"
  zh: "状态菜单或菜单栏图标 → 暂停通知。不显示消息通知、不播放声音；提醒和来电卡片仍会显示，计数照常更新。%{dnd}"
help.code.q2.title:
  en: "Outside working hours"
  ru: "Вне рабочих часов"
  es: "Fuera del horario laboral"
  th: "นอกเวลาทำงาน"
  zh: "工作时间外"
help.code.q2.trigger:
  en: "Settings → Notifications → working hours. Outside them it works like a pause. When a pause by hand overlaps them, the notifications name the cause that ends last."
  ru: "«Настройки» → «Уведомления» → рабочие часы. Вне их всё работает как пауза. Если на них накладывается пауза вручную, указывается та причина, что закончится позже."
  es: "Configuración → Notificaciones → horario laboral. Fuera de él funciona como una pausa. Si coincide con una pausa manual, se indica la causa que termina más tarde."
  th: "การตั้งค่า → การแจ้งเตือน → เวลาทำงาน นอกเวลาดังกล่าวจะทำงานเหมือนหยุดชั่วคราว หากหยุดชั่วคราวด้วยตนเองซ้อนกับช่วงนี้ จะแสดงสาเหตุที่สิ้นสุดช้ากว่า"
  zh: "设置 → 通知 → 工作时间。工作时间外等同于暂停。若与手动暂停重叠，显示较晚结束的那个原因。"
help.code.q3.title:
  en: "Status Busy"
  ru: "Статус «Занят»"
  es: "Estado Ocupado"
  th: "สถานะไม่ว่าง"
  zh: "忙碌状态"
help.code.q3.trigger:
  en: "Set by hand, or by a pause when “Set my status to Busy while paused” is on. The server sends no desktop notifications; calls and new chats do not ring; reminders still show, without sound."
  ru: "Ставится вручную или паузой, если включено «Ставить статус „Занят“ на время паузы». Сервер не присылает уведомлений; звонки и новые чаты не звучат; напоминания показываются без звука."
  es: "Se pone a mano, o con una pausa si está activado «Poner mi estado en Ocupado durante la pausa». El servidor no envía notificaciones de escritorio; las llamadas y los chats nuevos no suenan; los recordatorios se siguen mostrando, sin sonido."
  th: "ตั้งเอง หรือตั้งโดยการหยุดชั่วคราวเมื่อเปิด “ตั้งสถานะเป็นไม่ว่างขณะหยุดชั่วคราว” เซิร์ฟเวอร์จะไม่ส่งการแจ้งเตือน สายเรียกเข้าและแชตใหม่ไม่มีเสียง การเตือนยังแสดงอยู่แต่ไม่มีเสียง"
  zh: "手动设置，或在开启“暂停时将状态设为忙碌”时由暂停设置。服务器不发送桌面通知；来电和新会话不响铃；提醒仍会显示，但没有声音。"
help.code.q4.title:
  en: "The conversation is on screen"
  ru: "Беседа открыта на экране"
  es: "La conversación está en pantalla"
  th: "การสนทนาแสดงอยู่บนหน้าจอ"
  zh: "会话正显示在屏幕上"
help.code.q4.trigger:
  en: "No notification or sound for the room you are looking at, or for a thread whose panel is open, while your account's “Mute the conversation you are looking at” is on (Rocket.Chat's default). A thread reply counts as on screen only in its open thread panel, or in the open room when it was also sent to the channel. Its badge clears when it is read: the window is focused, the feed is at the bottom and no app dialog covers it. Unread thread replies stay until the thread itself is open and read."
  ru: "Нет уведомлений и звуков для комнаты, на которую вы смотрите, и для треда, открытого в панели, пока в аккаунте включено «Не уведомлять об открытой беседе» (так по умолчанию в Rocket.Chat). Ответ в треде считается видимым, только когда открыта панель его треда, или в открытой комнате, если он отправлен и в канал. Значок пропадает, когда они прочитаны: окно активно, лента прокручена вниз, поверх нет диалогов приложения. Непрочитанные ответы в тредах остаются, пока вы не откроете и не прочитаете сам тред."
  es: "Sin notificación ni sonido para la sala que estás viendo, ni para un hilo con su panel abierto, mientras «Silenciar la conversación que estás viendo» de tu cuenta esté activado (lo predeterminado en Rocket.Chat). Una respuesta de hilo cuenta como en pantalla solo en el panel abierto de su hilo, o en la sala abierta si también se envió al canal. Su insignia desaparece al leerse: la ventana tiene el foco, el chat está al final y ningún diálogo de la aplicación lo cubre. Las respuestas no leídas de hilos se quedan hasta que abres y lees el propio hilo."
  th: "ไม่มีการแจ้งเตือนหรือเสียงสำหรับห้องที่คุณกำลังดู หรือเธรดที่เปิดแผงอยู่ ขณะที่ “ปิดเสียงบทสนทนาที่คุณกำลังดูอยู่” ของบัญชีเปิดอยู่ (ค่าเริ่มต้นของ Rocket.Chat) คำตอบในเธรดนับว่าอยู่บนหน้าจอเฉพาะในแผงของเธรดนั้นที่เปิดอยู่ หรือในห้องที่เปิดอยู่เมื่อส่งไปยังช่องด้วย ป้ายจะหายไปเมื่ออ่านแล้ว: หน้าต่างมีโฟกัส ฟีดอยู่ล่างสุด และไม่มีกล่องโต้ตอบของแอปบัง คำตอบในเธรดที่ยังไม่ได้อ่านจะยังอยู่จนกว่าจะเปิดและอ่านเธรดนั้นเอง"
  zh: "当账户的“静音正在查看的会话”开启时（Rocket.Chat 的默认设置），对你正在查看的房间或已打开面板的讨论串不发通知、不播放声音。讨论串回复只有在其讨论串面板打开时，或同时发送到频道且该房间已打开时，才算显示在屏幕上。读过后标记消失：窗口获得焦点、消息流在底部且没有应用对话框遮挡。未读的讨论串回复会保留，直到你打开并读完该讨论串。"
help.code.q5.title:
  en: "No connection"
  ru: "Нет подключения"
  es: "Sin conexión"
  th: "ไม่มีการเชื่อมต่อ"
  zh: "无连接"
help.code.q5.trigger:
  en: "Offline or showing the saved copy: Rustket receives nothing new, so no message notifications arrive until it reconnects (the server may still notify your other devices). Reminders (L1, L2) and the D1 “not sent on time” alert still appear."
  ru: "Нет сети или показана сохранённая копия: Rustket ничего нового не получает, поэтому уведомлений о сообщениях нет, пока он не переподключится (сервер может уведомить другие ваши устройства). При этом срабатывают напоминания (L1, L2) и оповещение D1 «не отправлено вовремя»."
  es: "Sin conexión o mostrando la copia guardada: Rustket no recibe nada nuevo, así que no llegan notificaciones de mensajes hasta que se reconecte (el servidor puede avisar a tus otros dispositivos). Los recordatorios (L1, L2) y el aviso de D1 «no se envió a tiempo» siguen apareciendo."
  th: "ออฟไลน์หรือแสดงสำเนาที่บันทึกไว้: Rustket ไม่ได้รับอะไรใหม่ จึงไม่มีการแจ้งเตือนข้อความจนกว่าจะเชื่อมต่อใหม่ (เซิร์ฟเวอร์อาจแจ้งเตือนอุปกรณ์อื่นของคุณ) การเตือน (L1, L2) และการแจ้งว่า “ส่งไม่ทันเวลา” ของ D1 ยังแสดงอยู่"
  zh: "离线或显示已保存的副本：Rustket 收不到新内容，因此在重新连接前不会有消息通知（服务器仍可能通知你的其他设备）。提醒（L1、L2）和 D1 的“未按时发出”提示仍会出现。"
help.scheme_rc:
  en: "Indicators follow Rocket.Chat's web client and desktop app (Settings → Appearance → Unread indicators)."
  ru: "Индикаторы как в веб-клиенте и настольном приложении Rocket.Chat («Настройки» → «Внешний вид» → «Индикаторы непрочитанного»)."
  es: "Los indicadores siguen al cliente web y la aplicación de escritorio de Rocket.Chat (Configuración → Apariencia → Indicadores de no leídos)."
  th: "ตัวบ่งชี้เป็นแบบเว็บไคลเอนต์และแอปเดสก์ท็อปของ Rocket.Chat (การตั้งค่า → รูปลักษณ์ → ตัวบ่งชี้ข้อความที่ยังไม่ได้อ่าน)"
  zh: "指示标记与 Rocket.Chat 网页客户端和桌面应用一致（设置 → 外观 → 未读指示标记）。"
help.unread_alert:
  en: "My account: Unread Tray Icon Alert"
  ru: "Мой аккаунт: Иконка уведомлений о непрочитанных сообщениях в трее"
  es: "Mi cuenta: Alerta de icono de bandeja de no leídos"
  th: "บัญชีของฉัน: ไอคอนถาดที่ยังไม่ได้อ่าน"
  zh: "我的账户：未读托盘图标提醒"
help.change_in_rocketchat:
  en: "“•” when nothing is counted; change in Rocket.Chat's web client (Account → Preferences → Messages)"
  ru: "«•», когда счётчика нет; меняется в веб-клиенте Rocket.Chat («Учетная запись» → «Настройки» → «Сообщения»)"
  es: "«•» cuando no hay nada contado; se cambia en el cliente web de Rocket.Chat (Account → Preferencias → Mensajes)"
  th: "“•” เมื่อไม่มีตัวนับ เปลี่ยนได้ในเว็บไคลเอนต์ของ Rocket.Chat (Account → การตั้งค่า → ข้อความ)"
  zh: "没有计数时显示“•”；在 Rocket.Chat 网页客户端中更改（账户 → 偏好设置 → 消息）"
help.kind_rc.mention:
  en: "red (danger)"
  ru: "красный (danger)"
  es: "rojo (danger)"
  th: "สีแดง (danger)"
  zh: "红色（danger）"
help.kind_rc.group_mention:
  en: "orange (warning)"
  ru: "оранжевый (warning)"
  es: "naranja (warning)"
  th: "สีส้ม (warning)"
  zh: "橙色（warning）"
help.kind_rc.thread:
  en: "blue (primary)"
  ru: "синий (primary)"
  es: "azul (primary)"
  th: "สีน้ำเงิน (primary)"
  zh: "蓝色（primary）"
help.kind_rc.unread:
  en: "grey (secondary)"
  ru: "серый (secondary)"
  es: "gris (secondary)"
  th: "สีเทา (secondary)"
  zh: "灰色（secondary）"
help.kind_meaning_rc.mention:
  en: "Something for you: a mention of you or one of your highlight words, also in a thread (the room's counter, the thread row's dot, the Threads counter in the room header, the Activity counter, the thread's dot in the timeline), an overdue reminder (Later) or a scheduled message not sent on time (Drafts & scheduled). A direct message is red only when it mentions you. Room notification settings do not change its colour. With both “Show unread counter” and “Show mention badges” off, the room's counter is hidden, and with “Show mention badges” off Activity leaves its mentions out."
  ru: "Что-то для вас: упоминание вас или одно из ваших выделяемых слов, в том числе в треде (счётчик комнаты, точка у строки треда, счётчик на кнопке «Треды» в заголовке комнаты, счётчик «Активности», точка треда в ленте), просроченное напоминание («Позже») или запланированное сообщение, не отправленное вовремя («Черновики и запланированные»). Личное сообщение красное, только когда упоминает вас. Настройки уведомлений комнаты не меняют этот цвет. Если выключены и «Показывать счётчик непрочитанных», и «Показывать значки упоминаний», счётчик комнаты скрыт, а при выключенном «Показывать значки упоминаний» «Активность» не учитывает её упоминания."
  es: "Algo para ti: una mención a ti o una de tus palabras resaltadas, también en un hilo (el contador de la sala, el punto de la fila del hilo, el contador del botón Hilos de la cabecera de la sala, el contador de Actividad, el punto del hilo en la conversación), un recordatorio vencido (Más tarde) o un mensaje programado no enviado a tiempo (Borradores y programados). Un mensaje directo es rojo solo si te menciona. Las preferencias de notificaciones de la sala no cambian su color. Con «Mostrar contador de no leídos» y «Mostrar insignias de menciones» desactivados, el contador de la sala se oculta, y con «Mostrar insignias de menciones» desactivado Actividad deja fuera sus menciones."
  th: "สิ่งที่ถึงคุณ: การกล่าวถึงคุณหรือคำที่ไฮไลต์ของคุณ รวมถึงในเธรด (ตัวนับของห้อง จุดของแถวเธรด ตัวนับบนปุ่มเธรดในส่วนหัวห้อง ตัวนับของกิจกรรม จุดของเธรดในไทม์ไลน์) การเตือนความจำที่เลยกำหนด (ภายหลัง) หรือข้อความที่ตั้งเวลาไว้แต่ส่งไม่ทันเวลา (ฉบับร่างและที่ตั้งเวลาไว้) ข้อความส่วนตัวเป็นสีแดงเฉพาะเมื่อกล่าวถึงคุณ การตั้งค่าการแจ้งเตือนของห้องไม่เปลี่ยนสีนี้ เมื่อปิดทั้ง “แสดงจำนวนที่ยังไม่ได้อ่าน” และ “แสดงป้ายการกล่าวถึง” ตัวนับของห้องจะถูกซ่อน และเมื่อปิด “แสดงป้ายการกล่าวถึง” กิจกรรมจะไม่นับการกล่าวถึงของห้องนั้น"
  zh: "与你有关的内容：提及你或你的某个高亮词，包括在讨论串中（房间计数、讨论串行的圆点、房间标题栏“讨论串”按钮上的计数、“动态”计数、时间线中讨论串的圆点），过期的提醒（“稍后”）或未按时发送的定时消息（“草稿与定时”）。私信只有提及你时才是红色。房间的通知偏好不会改变它的颜色。同时关闭“显示未读计数”和“显示提及标记”时，房间计数被隐藏；关闭“显示提及标记”时，“动态”不包含该房间的提及。"
help.kind_meaning_rc.group_mention:
  en: "@all or @here while nothing mentions you: the room's counter when no thread is unread either (unread threads go before @all, so a room with both is blue), the Activity counter while it counts neither a mention of you nor a thread, the dot of a thread that has @all (its thread row and the timeline), and the Threads counter in the room header while any unread thread has @all."
  ru: "@all или @here, пока нет упоминаний вас: счётчик комнаты, если нет и непрочитанных тредов (непрочитанные треды важнее @all, поэтому комната с тем и другим синяя), счётчик «Активности», пока в нём нет ни упоминаний вас, ни тредов, точка треда с @all (у строки треда и в ленте) и счётчик на кнопке «Треды» в заголовке комнаты, пока хоть в одном непрочитанном треде есть @all."
  es: "@all o @here mientras nada te menciona: el contador de la sala cuando tampoco hay hilos sin leer (los hilos sin leer van antes que @all, así que una sala con ambos es azul), el contador de Actividad mientras no cuenta ni menciones a ti ni hilos, el punto de un hilo con @all (su fila de hilo y la conversación) y el contador del botón Hilos de la cabecera de la sala mientras algún hilo sin leer tenga @all."
  th: "@all หรือ @here เมื่อไม่มีการกล่าวถึงคุณ: ตัวนับของห้องเมื่อไม่มีเธรดที่ยังไม่ได้อ่านด้วย (เธรดที่ยังไม่ได้อ่านมาก่อน @all ห้องที่มีทั้งสองอย่างจึงเป็นสีน้ำเงิน) ตัวนับของกิจกรรมเมื่อไม่ได้นับทั้งการกล่าวถึงคุณและเธรด จุดของเธรดที่มี @all (แถวเธรดและในไทม์ไลน์) และตัวนับบนปุ่มเธรดในส่วนหัวห้องเมื่อมีเธรดที่ยังไม่ได้อ่านที่มี @all"
  zh: "没有提及你时的 @all 或 @here：也没有未读讨论串时的房间计数（未读讨论串优先于 @all，因此两者都有的房间为蓝色）、既不计提及你也不计讨论串时的“动态”计数、含 @all 的讨论串的圆点（讨论串行和时间线中），以及任一未读讨论串含 @all 时房间标题栏“讨论串”按钮上的计数。"
help.kind_meaning_rc.thread:
  en: "Unread thread replies while nothing mentions you: the room's counter (plus one for each unread thread), the Activity counter, a thread row's dot and the thread's dot in the timeline (orange when the thread has @all), with its reply button filled blue, and the Threads counter in the room header while no unread thread has @all."
  ru: "Непрочитанные ответы в тредах, пока нет упоминаний вас: счётчик комнаты (плюс один за каждый непрочитанный тред), счётчик «Активности», точка у строки треда и точка треда в ленте (оранжевая, если в треде есть @all), а кнопка его ответов залита синим, и счётчик на кнопке «Треды» в заголовке комнаты, пока ни в одном непрочитанном треде нет @all."
  es: "Respuestas de hilos no leídas mientras nada te menciona: el contador de la sala (uno más por cada hilo sin leer), el contador de Actividad, el punto de la fila de un hilo y el punto del hilo en la conversación (naranja si el hilo tiene @all), con su botón de respuestas relleno de azul, y el contador del botón Hilos de la cabecera de la sala mientras ningún hilo sin leer tenga @all."
  th: "คำตอบเธรดที่ยังไม่ได้อ่านเมื่อไม่มีการกล่าวถึงคุณ: ตัวนับของห้อง (บวกหนึ่งต่อเธรดที่ยังไม่ได้อ่านแต่ละเธรด) ตัวนับของกิจกรรม จุดของแถวเธรดและจุดของเธรดในไทม์ไลน์ (สีส้มเมื่อเธรดมี @all) โดยปุ่มคำตอบเป็นสีน้ำเงินทึบ และตัวนับบนปุ่มเธรดในส่วนหัวห้องเมื่อไม่มีเธรดที่ยังไม่ได้อ่านที่มี @all"
  zh: "没有提及你时的未读讨论串回复：房间计数（每个未读讨论串加一）、“动态”计数、讨论串行的圆点和时间线中讨论串的圆点（讨论串含 @all 时为橙色），其回复按钮填充为蓝色，以及没有未读讨论串含 @all 时房间标题栏“讨论串”按钮上的计数。"
help.kind_meaning_rc.unread:
  en: "Everything else the server counts: every message of a direct message, every channel message when the server counts all messages, the All unreads counter of unread rooms, scheduled messages that are on time. A message the server does not count shows no counter: the room's name is only highlighted."
  ru: "Всё остальное, что считает сервер: каждое сообщение в личной переписке, каждое сообщение канала, если сервер считает все сообщения, счётчик непрочитанных комнат у «Всех непрочитанных», запланированные сообщения, которые идут по плану. Сообщение, которое сервер не считает, счётчика не даёт: название комнаты только выделяется."
  es: "Todo lo demás que cuenta el servidor: cada mensaje de un mensaje directo, cada mensaje de canal cuando el servidor cuenta todos, el contador de salas no leídas de Todos los no leídos, los mensajes programados que van a tiempo. Un mensaje que el servidor no cuenta no muestra contador: solo se resalta el nombre de la sala."
  th: "ทุกอย่างอื่นที่เซิร์ฟเวอร์นับ: ทุกข้อความในข้อความส่วนตัว ทุกข้อความในช่องเมื่อเซิร์ฟเวอร์นับทุกข้อความ ตัวนับห้องที่ยังไม่ได้อ่านของยังไม่ได้อ่านทั้งหมด ข้อความที่ตั้งเวลาไว้ซึ่งยังทันเวลา ข้อความที่เซิร์ฟเวอร์ไม่นับจะไม่มีตัวนับ ชื่อห้องเพียงเด่นขึ้น"
  zh: "服务器计数的其他一切：私信中的每条消息、服务器计数所有消息时频道中的每条消息、“全部未读”中未读房间的计数、按时的定时消息。服务器不计数的消息不显示计数：房间名称仅突出显示。"
help.legend_caption_rc:
  en: "Colours of the counters and dots as Rocket.Chat draws them: the sidebar always uses Rocket.Chat's sidebar shades, the room view the theme's. Where each code uses each colour now (“dot”: a dot instead of a counter). The workspace icon's badge is grey; the tray, Dock and window icon (not on Wayland) show a red badge with the number of unread messages."
  ru: "Цвета счётчиков и точек, как их рисует Rocket.Chat: на боковой панели всегда оттенки боковой панели Rocket.Chat, в комнате — оттенки темы. Где какой код сейчас использует каждый цвет («точка» — точка вместо счётчика). Значок рабочего пространства показывает серый счётчик; трей, Dock и значок окна (кроме Wayland) — красный значок с числом непрочитанных сообщений."
  es: "Colores de los contadores y puntos tal como los dibuja Rocket.Chat: la barra lateral usa siempre los tonos de la barra lateral de Rocket.Chat, la sala los del tema. Dónde usa ahora cada código cada color («punto»: un punto en lugar de un contador). La insignia del icono del espacio es gris; la bandeja, el Dock y el icono de la ventana (salvo en Wayland) muestran una insignia roja con el número de mensajes no leídos."
  th: "สีของตัวนับและจุดตามที่ Rocket.Chat วาด: แถบด้านข้างใช้เฉดสีแถบด้านข้างของ Rocket.Chat เสมอ ห้องใช้สีของธีม และตำแหน่งที่แต่ละรหัสใช้สีนั้นอยู่ตอนนี้ (“จุด”: แสดงเป็นจุดแทนตัวนับ) ป้ายของไอคอนเวิร์กสเปซเป็นสีเทา ถาด Dock และไอคอนหน้าต่าง (ยกเว้นบน Wayland) แสดงป้ายสีแดงพร้อมจำนวนข้อความที่ยังไม่ได้อ่าน"
  zh: "Rocket.Chat 绘制的计数和圆点颜色：侧边栏始终使用 Rocket.Chat 侧边栏的色调，房间视图使用主题的颜色。以及目前各代码在何处使用各颜色（“圆点”：显示圆点而非计数）。工作区图标的徽标为灰色；托盘、程序坞和窗口图标（Wayland 上除外）显示带未读消息数的红色徽标。"
