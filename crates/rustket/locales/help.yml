help.code.m2.trigger_rc:
  en: "A plain message in a 1:1 or group direct message. When the server counts every direct message (its default), a grey counter in its row; otherwise only the name is highlighted. Red only when the message mentions you. Activity lists no direct messages: it is a feed of mentions and threads."
  ru: "Обычное сообщение в личной переписке или групповом личном чате. Если сервер считает все личные сообщения (по умолчанию), в строке комнаты серый счётчик; иначе только выделяется название. Красный — только если сообщение упоминает вас. «Активность» не показывает личные сообщения: это лента упоминаний и тредов."
  es: "Un mensaje normal en un mensaje directo 1:1 o de grupo. Si el servidor cuenta todos los mensajes directos (por defecto), un contador gris en su fila; si no, solo se resalta el nombre. Rojo solo si el mensaje te menciona. Actividad no muestra mensajes directos: es un feed de menciones e hilos."
  th: "ข้อความทั่วไปในแชตส่วนตัวแบบตัวต่อตัวหรือแบบกลุ่ม หากเซิร์ฟเวอร์นับทุกข้อความส่วนตัว (ค่าเริ่มต้น) จะมีตัวนับสีเทาในแถวของห้อง มิฉะนั้นชื่อจะเพียงเด่นขึ้น เป็นสีแดงเฉพาะเมื่อข้อความกล่าวถึงคุณ กิจกรรมไม่แสดงข้อความส่วนตัว เพราะเป็นฟีดของการกล่าวถึงและเธรด"
  zh: "一对一或群组私信中的普通消息。如果服务器计数每条私信（默认），房间行中显示灰色计数；否则名称仅突出显示。只有提及你时才是红色。“动态”不列出私信：它是提及和讨论串的动态。"
help.code.m4.trigger_rc:
  en: "One of your highlighted words (My account → Preferences), as a whole word in any case. The server counts it as a mention (a red counter); in the timeline and the thread the word is marked white on red, also in links and your own messages, and the row is not highlighted."
  ru: "Одно из ваших выделяемых слов («Мой аккаунт» → «Предпочтения») целым словом в любом регистре. Сервер считает его упоминанием (красный счётчик); в ленте и треде слово отмечается белым на красном, также в ссылках и ваших собственных сообщениях, а строка не подсвечивается."
  es: "Una de tus palabras resaltadas (Mi cuenta → Preferencias), como palabra completa y sin distinguir mayúsculas. El servidor la cuenta como mención (un contador rojo); en la conversación y el hilo la palabra se marca en blanco sobre rojo, también en enlaces y en tus propios mensajes, y la fila no se resalta."
  th: "คำที่ไฮไลต์ของคุณ (บัญชีของฉัน → การตั้งค่า) แบบทั้งคำ ไม่สนตัวพิมพ์ เซิร์ฟเวอร์นับเป็นการกล่าวถึง (ตัวนับสีแดง) ในไทม์ไลน์และเธรด คำจะถูกทำเครื่องหมายเป็นสีขาวบนพื้นสีแดง รวมถึงในลิงก์และข้อความของคุณเอง และไม่ไฮไลต์แถว"
  zh: "你的某个高亮词（我的账户 → 偏好设置），按整词匹配，不区分大小写。服务器把它计为提及（红色计数）；在时间线和讨论串中该词以红底白字标出，链接和你自己的消息中也是如此，整行不高亮。"
help.code.m5.trigger_rc:
  en: "A message in a channel or private group with no mention. Unless the server counts every message, it only highlights the room's name: its row shows no counter and no dot; the tray, Dock and workspace icon show “•”."
  ru: "Сообщение в канале или приватной группе без упоминаний. Если сервер не считает все сообщения, название комнаты только выделяется: в её строке ни счётчика, ни точки; трей, Dock и значок рабочего пространства показывают «•»."
  es: "Un mensaje en un canal o grupo privado sin menciones. Salvo que el servidor cuente todos los mensajes, solo se resalta el nombre de la sala: su fila no muestra contador ni punto; la bandeja, el Dock y el icono del espacio muestran «•»."
  th: "ข้อความในช่องหรือกลุ่มส่วนตัวที่ไม่มีการกล่าวถึง หากเซิร์ฟเวอร์ไม่ได้นับทุกข้อความ ชื่อห้องจะเพียงเด่นขึ้น: แถวของห้องไม่มีตัวนับและไม่มีจุด ถาด Dock และไอคอนเวิร์กสเปซแสดง “•”"
  zh: "频道或私有群组中不含提及的消息。除非服务器计数每条消息，否则房间名称仅突出显示：房间行中没有计数，也没有圆点；托盘、程序坞和工作区图标显示“•”。"
help.code.t1.trigger_rc:
  en: "A reply in a thread you follow. Unread thread replies are blue unless something mentions you: the room's counter, the thread row, the Threads counter in the room header, the thread's reply button in the timeline. They go before @all."
  ru: "Ответ в треде, который вы отслеживаете. Непрочитанные ответы в тредах синие, если нет упоминаний вас: счётчик комнаты, строка треда, счётчик на кнопке «Треды» в заголовке комнаты, кнопка ответов треда в ленте. Они важнее @all."
  es: "Una respuesta en un hilo que sigues. Las respuestas de hilos no leídas son azules salvo que algo te mencione: el contador de la sala, la fila del hilo, el contador del botón Hilos de la cabecera de la sala, el botón de respuestas del hilo en la conversación. Van antes que @all."
  th: "คำตอบในเธรดที่คุณติดตาม คำตอบเธรดที่ยังไม่ได้อ่านเป็นสีน้ำเงิน เว้นแต่มีการกล่าวถึงคุณ: ตัวนับของห้อง แถวเธรด ตัวนับบนปุ่มเธรดในส่วนหัวห้อง ปุ่มคำตอบของเธรดในไทม์ไลน์ และมาก่อน @all"
  zh: "你关注的讨论串中的回复。除非有提及你的内容，未读的讨论串回复为蓝色：房间计数、讨论串行、房间标题栏“讨论串”按钮上的计数、时间线中讨论串的回复按钮。它们优先于 @all。"
help.code.t2.trigger_rc:
  en: "A reply in a thread that mentions you (or has your highlighted word): red in the room's counter, the thread row and the Threads counter in the room header."
  ru: "Ответ в треде, который упоминает вас (или содержит ваше выделяемое слово): красный в счётчике комнаты, строке треда и на кнопке «Треды» в заголовке комнаты."
  es: "Una respuesta en un hilo que te menciona (o tiene tu palabra resaltada): rojo en el contador de la sala, la fila del hilo y el contador del botón Hilos de la cabecera de la sala."
  th: "คำตอบในเธรดที่กล่าวถึงคุณ (หรือมีคำที่ไฮไลต์ของคุณ): สีแดงในตัวนับของห้อง แถวเธรด และตัวนับบนปุ่มเธรดในส่วนหัวห้อง"
  zh: "提及你（或含有你的高亮词）的讨论串回复：房间计数、讨论串行和房间标题栏“讨论串”按钮上的计数为红色。"
help.code.t3.trigger_rc:
  en: "A reply with @all or @here in a thread you follow. The thread's dot and the Threads counter in the room header are orange; the room's counter is blue, because threads go before @all."
  ru: "Ответ с @all или @here в треде, который вы отслеживаете. Точка треда и счётчик на кнопке «Треды» в заголовке комнаты оранжевые; счётчик комнаты синий, потому что треды важнее @all."
  es: "Una respuesta con @all o @here en un hilo que sigues. El punto del hilo y el contador del botón Hilos de la cabecera de la sala son naranjas; el contador de la sala es azul, porque los hilos van antes que @all."
  th: "คำตอบที่มี @all หรือ @here ในเธรดที่คุณติดตาม จุดของเธรดและตัวนับบนปุ่มเธรดในส่วนหัวห้องเป็นสีส้ม ตัวนับของห้องเป็นสีน้ำเงิน เพราะเธรดมาก่อน @all"
  zh: "你关注的讨论串中带 @all 或 @here 的回复。讨论串的圆点和房间标题栏“讨论串”按钮上的计数为橙色；房间计数为蓝色，因为讨论串优先于 @all。"
help.code.r1.trigger_rc:
  en: "Room header → Notification preferences. The room no longer notifies, but its row counter, colours and thread rows do not change and still count in the sidebar, tray and window title. The All unreads counter and Activity leave out its plain unread and thread replies (All unreads lists the room only with muted rooms included); mentions of you stay in Activity. The table below shows it."
  ru: "Заголовок комнаты → «Настройки уведомлений». Комната больше не уведомляет, но счётчик в её строке, цвета и строки тредов не меняются и по-прежнему учитываются на боковой панели, в трее и заголовке окна. Счётчик «Всех непрочитанных» и «Активность» не учитывают её обычные непрочитанные и ответы в тредах («Все непрочитанные» показывают комнату, только если включён показ комнат без уведомлений); упоминания вас остаются в «Активности». Это видно в таблице ниже."
  es: "Encabezado de la sala → Preferencias de notificaciones. La sala deja de notificar, pero el contador de su fila, sus colores y sus filas de hilos no cambian y siguen contando en la barra lateral, la bandeja y el título de la ventana. El contador de Todos los no leídos y Actividad dejan fuera sus no leídos normales y las respuestas de hilos (Todos los no leídos solo lista la sala con las salas silenciadas incluidas); las menciones a ti siguen en Actividad. La tabla de abajo lo muestra."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน ห้องจะไม่แจ้งเตือนอีก แต่ตัวนับในแถว สี และแถวเธรดของห้องไม่เปลี่ยนและยังนับอยู่ในแถบด้านข้าง ถาด และชื่อหน้าต่าง ตัวนับของยังไม่ได้อ่านทั้งหมดและกิจกรรมไม่นับข้อความที่ยังไม่ได้อ่านทั่วไปและคำตอบเธรดของห้องนี้ (ยังไม่ได้อ่านทั้งหมดแสดงห้องนี้เฉพาะเมื่อรวมห้องที่ปิดเสียงไว้) การกล่าวถึงคุณยังอยู่ในกิจกรรม ตารางด้านล่างแสดงให้เห็น"
  zh: "房间标题 → 通知偏好。房间不再通知，但其行计数、颜色和讨论串行不变，仍计入侧边栏、托盘和窗口标题。“全部未读”计数和“动态”不包含它的普通未读和讨论串回复（“全部未读”只在包含已静音房间时列出该房间）；提及你的消息仍在“动态”中。下表显示了这一点。"
help.code.r3.trigger_rc:
  en: "Room header → Notification preferences. On its own it only takes the room's mentions out of Activity, so Rustket shows the switch only while “Show unread counter” is off; together with it, the mention and @all counters are hidden too. The table below shows what changes."
  ru: "Заголовок комнаты → «Настройки уведомлений». Сам по себе только убирает упоминания комнаты из «Активности», поэтому Rustket показывает этот переключатель, только когда «Показывать счётчик непрочитанных» выключен; вместе с ним скрываются и счётчики упоминаний и @all. Что меняется — в таблице ниже."
  es: "Encabezado de la sala → Preferencias de notificaciones. Por sí solo solo quita de Actividad las menciones de la sala, así que Rustket muestra el interruptor solo mientras «Mostrar contador de no leídos» está desactivado; junto con él se ocultan también los contadores de menciones y @all. La tabla de abajo muestra qué cambia."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน ลำพังตัวเลือกนี้เพียงนำการกล่าวถึงของห้องออกจากกิจกรรม Rustket จึงแสดงสวิตช์นี้เฉพาะเมื่อปิด “แสดงจำนวนที่ยังไม่ได้อ่าน” อยู่ เมื่อใช้ร่วมกัน ตัวนับการกล่าวถึงและ @all จะถูกซ่อนด้วย ตารางด้านล่างแสดงสิ่งที่เปลี่ยน"
  zh: "房间标题 → 通知偏好。单独开启时只会把房间的提及从“动态”中移除，因此 Rustket 只在“显示未读计数”关闭时显示此开关；两者一起开启时，提及和 @all 的计数也会隐藏。下表显示变化。"
help.code.r4.trigger_rc:
  en: "Room header → Notification preferences. @all and @here in this room no longer notify; the room's counters, colours and the timeline do not change; Activity no longer lists or counts its @all and @here. The table below shows it."
  ru: "Заголовок комнаты → «Настройки уведомлений». @all и @here в этой комнате больше не уведомляют; счётчики комнаты, цвета и лента не меняются; «Активность» больше не показывает и не считает её @all и @here. Это видно в таблице ниже."
  es: "Encabezado de la sala → Preferencias de notificaciones. @all y @here en esta sala dejan de notificar; los contadores de la sala, los colores y la conversación no cambian; Actividad ya no lista ni cuenta sus @all y @here. La tabla de abajo lo muestra."
  th: "หัวห้อง → การตั้งค่าการแจ้งเตือน @all และ @here ในห้องนี้จะไม่แจ้งเตือนอีก ตัวนับของห้อง สี และไทม์ไลน์ไม่เปลี่ยน กิจกรรมจะไม่แสดงหรือนับ @all และ @here ของห้องนี้อีก ตารางด้านล่างแสดงให้เห็น"
  zh: "房间标题 → 通知偏好。此房间中的 @all 和 @here 不再通知；房间计数、颜色和时间线不变；“动态”不再列出或计数其 @all 和 @here。下表显示了这一点。"
