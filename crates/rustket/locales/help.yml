help.no_account:
  en: "No account is signed in: server-side parts use Rocket.Chat's defaults. Sign in to see yours."
  ru: "Нет вошедшего аккаунта: серверная часть показана по значениям Rocket.Chat по умолчанию. Войдите, чтобы увидеть свою."
  es: "No hay ninguna cuenta con sesión iniciada: la parte del servidor usa los valores predeterminados de Rocket.Chat. Inicia sesión para ver los tuyos."
  th: "ยังไม่มีบัญชีที่ลงชื่อเข้าใช้ ส่วนของเซิร์ฟเวอร์ใช้ค่าเริ่มต้นของ Rocket.Chat ลงชื่อเข้าใช้เพื่อดูค่าของคุณ"
  zh: "未登录任何账户：服务器端部分按 Rocket.Chat 默认值显示。登录后可查看你的设置。"
