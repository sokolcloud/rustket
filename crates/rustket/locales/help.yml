  es: "%{server} (la cuenta aún no se ha cargado: sus preferencias usan los valores predeterminados de Rocket.Chat)"
  th: "%{server} (ยังไม่ได้โหลดบัญชี: การตั้งค่าใช้ค่าเริ่มต้นของ Rocket.Chat)"
