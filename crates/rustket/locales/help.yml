help.intro:
  en: "Every kind of signal has a short code (M1, T2, R1, Q3…). This page is computed from your current settings: change a setting and it changes here too."
  ru: "У каждого вида сигнала есть короткий код (M1, T2, R1, Q3…). Страница рассчитывается по вашим текущим настройкам: измените настройку — изменится и здесь."
  es: "Cada tipo de señal tiene un código corto (M1, T2, R1, Q3…). Esta página se calcula con tu configuración actual: si cambias un ajuste, cambia también aquí."
  th: "สัญญาณแต่ละแบบมีรหัสสั้น ๆ (M1, T2, R1, Q3…) หน้านี้คำนวณจากการตั้งค่าปัจจุบันของคุณ เมื่อเปลี่ยนการตั้งค่า หน้านี้ก็เปลี่ยนตาม"
  zh: "每种信号都有一个简短代码（M1、T2、R1、Q3…）。本页根据你当前的设置计算：更改设置后，这里也会随之变化。"
