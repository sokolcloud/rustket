help.kind_meaning.unread:
  en: "Unread in a room's main timeline: its counter, or its dot for a new message the server does not count (a plain channel message); the All unreads counter of unread rooms; the workspace icon's dot and the tray's quiet dot while nothing louder is unread."
  ru: "Непрочитанное в основной ленте комнаты: её счётчик или точка, когда сервер не учитывает новое сообщение в счётчике (обычное сообщение в канале); счётчик непрочитанных комнат у «Всех непрочитанных»; точка на значке рабочего пространства и приглушённая точка на значке в трее, пока нет ничего важнее."
  es: "No leídos en la línea principal de una sala: su contador, o su punto por un mensaje nuevo que el servidor no cuenta (un mensaje normal en un canal); el contador de salas no leídas de Todos los no leídos; el punto del icono del espacio y el punto atenuado de la bandeja mientras no haya nada más importante."
  th: "ข้อความที่ยังไม่ได้อ่านในไทม์ไลน์หลักของห้อง: ตัวนับของห้อง หรือจุดของห้องเมื่อมีข้อความใหม่ที่เซิร์ฟเวอร์ไม่นับ (ข้อความทั่วไปในช่อง) ตัวนับห้องที่ยังไม่ได้อ่านในยังไม่ได้อ่านทั้งหมด และจุดบนไอคอนเวิร์กสเปซกับจุดแบบเงียบบนไอคอนในถาดขณะที่ไม่มีอะไรสำคัญกว่า"
  zh: "房间主时间线中的未读：房间的计数，或服务器不计数的新消息（频道中的普通消息）显示的圆点；“全部未读”的未读房间计数；没有更重要的未读时工作区图标上的圆点和托盘图标上的静默圆点。"
help.kind_meaning.mention:
  en: "Something for you: a mention of you, one of your highlight words or a direct message (room counter or dot, thread row dot, the room header's Threads button, Activity except DMs, the workspace icon's counter, the number in the window title, the tray's red dot), an overdue reminder (Later) or a scheduled message not sent on time (Drafts & scheduled). Mentions of you and highlight words also highlight their row in the feed, in the feed's own mention colours."
  ru: "То, что касается вас: упоминание вас, вашего выделяемого слова или личное сообщение (счётчик или точка комнаты, точка у строки треда, кнопка «Треды» в заголовке комнаты, «Активность», кроме личных сообщений, счётчик на значке рабочего пространства, число в заголовке окна, красная точка на значке в трее), просроченное напоминание («Позже») или отложенное сообщение, не отправленное вовремя («Черновики и отложенные»). Упоминания вас и выделяемые слова также подсвечивают свою строку в ленте — собственными цветами упоминания ленты."
  es: "Algo para ti: una mención a ti, una de tus palabras resaltadas o un mensaje directo (contador o punto de la sala, punto de la fila del hilo, el botón Hilos de la cabecera de la sala, Actividad salvo los mensajes directos, el contador del icono del espacio, el número del título de la ventana, el punto rojo de la bandeja), un recordatorio vencido (Más tarde) o un mensaje programado que no se envió a tiempo (Borradores y programados). Las menciones a ti y las palabras resaltadas también resaltan su fila en el chat, con los colores de mención propios del chat."
  th: "สิ่งที่เกี่ยวกับคุณ: การกล่าวถึงคุณ คำที่คุณไฮไลต์ หรือข้อความส่วนตัว (ตัวนับหรือจุดของห้อง จุดของแถวเธรด ปุ่มเธรดในส่วนหัวห้อง กิจกรรมยกเว้นข้อความส่วนตัว ตัวนับบนไอคอนเวิร์กสเปซ ตัวเลขในชื่อหน้าต่าง จุดสีแดงบนไอคอนในถาด) การเตือนที่เลยกำหนด (ภายหลัง) หรือข้อความตั้งเวลาที่ส่งไม่ทันเวลา (ฉบับร่างและข้อความที่ตั้งเวลา) การกล่าวถึงคุณและคำที่ไฮไลต์จะไฮไลต์แถวของตนในฟีดด้วย โดยใช้สีการกล่าวถึงของฟีดเอง"
  zh: "与你有关：提及你、你的高亮词或私信（房间计数或圆点、讨论串行圆点、房间标题栏的“讨论串”按钮、“动态”（私信除外）、工作区图标上的计数、窗口标题中的数字、托盘图标上的红点）、逾期提醒（稍后）或未按时发出的定时消息（草稿与定时消息）。提及你的消息和含高亮词的消息还会在消息流中以消息流自己的提及配色高亮整行。"
help.kind_meaning.group_mention:
  en: "@all or @here, unless the room mutes them or hides mention badges: the room's counter or dot, the thread row's dot, the room header's Threads button, the Activity counter, and the orange dot of the workspace icon and the tray while nothing mentions you."
  ru: "@all или @here, если комната их не заглушает и не скрывает значки упоминаний: счётчик или точка комнаты, точка у строки треда, кнопка «Треды» в заголовке комнаты, счётчик «Активности» и оранжевая точка на значке рабочего пространства и в трее, пока вас никто не упомянул."
  es: "@all o @here, salvo que la sala los silencie u oculte las insignias de menciones: el contador o punto de la sala, el punto de la fila del hilo, el botón Hilos de la cabecera de la sala, el contador de Actividad y el punto naranja del icono del espacio y de la bandeja mientras nada te menciona."
  th: "@all หรือ @here เว้นแต่ห้องปิดเสียงไว้หรือซ่อนป้ายการกล่าวถึง: ตัวนับหรือจุดของห้อง จุดของแถวเธรด ปุ่มเธรดในส่วนหัวห้อง ตัวนับกิจกรรม และจุดสีส้มบนไอคอนเวิร์กสเปซและในถาดขณะที่ยังไม่มีใครกล่าวถึงคุณ"
  zh: "@all 或 @here（除非房间已将其静音或隐藏提及标记）：房间计数或圆点、讨论串行圆点、房间标题栏的“讨论串”按钮、“动态”计数，以及没有人提及你时工作区图标和托盘上的橙点。"
help.kind_meaning.thread:
  en: "Unread thread replies: a room's counter when only threads are unread, a thread row's dot, the Activity dot, the dots of unread threads in the timeline and the Threads panel, the dot of the room header's Threads button, and the workspace icon's dot when only threads are unread."
  ru: "Непрочитанные ответы в тредах: счётчик комнаты, когда непрочитаны только треды, точка у строки треда, точка у «Активности», точки непрочитанных тредов в ленте и на панели тредов, точка на кнопке «Треды» в заголовке комнаты и точка на значке рабочего пространства, когда непрочитаны только треды."
  es: "Respuestas de hilos no leídas: el contador de una sala cuando solo hay hilos sin leer, el punto de la fila de un hilo, el punto de Actividad, los puntos de los hilos no leídos en la conversación y en el panel de hilos, el punto del botón Hilos de la cabecera de la sala y el punto del icono del espacio cuando solo hay hilos sin leer."
  th: "คำตอบเธรดที่ยังไม่ได้อ่าน: ตัวนับของห้องเมื่อมีเพียงเธรดที่ยังไม่ได้อ่าน จุดของแถวเธรด จุดของกิจกรรม จุดของเธรดที่ยังไม่ได้อ่านในไทม์ไลน์และแผงเธรด จุดบนปุ่มเธรดในส่วนหัวห้อง และจุดบนไอคอนเวิร์กสเปซเมื่อมีเพียงเธรดที่ยังไม่ได้อ่าน"
  zh: "未读的讨论串回复：只有讨论串未读时房间的计数、讨论串行的圆点、“动态”的圆点、时间线和讨论串面板中未读讨论串的圆点、房间标题栏“讨论串”按钮上的圆点，以及只有讨论串未读时工作区图标上的圆点。"
help.kind_meaning.muted:
  en: "Needs nothing from you and is not counted as unread: a room with notifications off and its thread rows (mentions of you stay red), scheduled messages that are on time."
  ru: "Не требует внимания и не считается непрочитанным: комната с выключенными уведомлениями и строки её тредов (упоминания вас остаются красными), отложенные сообщения, которые уходят в срок."
  es: "No requiere nada de ti y no cuenta como no leído: una sala con las notificaciones desactivadas y las filas de sus hilos (las menciones a ti siguen en rojo), mensajes programados a tiempo."
  th: "ไม่ต้องทำอะไรและไม่นับเป็นยังไม่ได้อ่าน: ห้องที่ปิดการแจ้งเตือนและแถวเธรดของห้องนั้น (การกล่าวถึงคุณยังเป็นสีแดง) ข้อความตั้งเวลาที่ยังตรงเวลา"
  zh: "无需你处理，也不计为未读：关闭了通知的房间及其讨论串行（提及你的仍为红色）、按时的定时消息。"
