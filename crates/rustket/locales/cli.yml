_version: 2
cli.usage:
  en: "Usage: %{bin} [OPTIONS] [LINK...]"
  ru: "Использование: %{bin} [ПАРАМЕТРЫ] [ССЫЛКА...]"
  es: "Uso: %{bin} [OPCIONES] [ENLACE...]"
  th: "วิธีใช้: %{bin} [OPTIONS] [LINK...]"
  zh: "用法：%{bin} [OPTIONS] [LINK...]"
cli.about:
  en: "Native Rocket.Chat desktop client."
  ru: "Нативный клиент Rocket.Chat для рабочего стола."
  es: "Cliente nativo de Rocket.Chat para escritorio."
  th: "ไคลเอนต์เดสก์ท็อปแบบเนทีฟสำหรับ Rocket.Chat"
  zh: "原生 Rocket.Chat 桌面客户端。"
cli.links:
  en: "rocketchat:// and https://go.rocket.chat/ links are passed to the running instance (or open in a new one)."
  ru: "Ссылки rocketchat:// и https://go.rocket.chat/ передаются уже запущенному экземпляру (или открываются в новом)."
  es: "Los enlaces rocketchat:// y https://go.rocket.chat/ se pasan a la instancia en ejecución (o se abren en una nueva)."
  th: "ลิงก์ rocketchat:// และ https://go.rocket.chat/ จะถูกส่งไปยังอินสแตนซ์ที่กำลังทำงาน (หรือเปิดในอินสแตนซ์ใหม่)"
  zh: "rocketchat:// 和 https://go.rocket.chat/ 链接会传递给正在运行的实例（或在新实例中打开）。"
cli.options:
  en: "Options:"
  ru: "Параметры:"
  es: "Opciones:"
  th: "ตัวเลือก:"
  zh: "选项："
cli.opt_help:
  en: "Print this help and exit"
  ru: "Показать эту справку и выйти"
  es: "Mostrar esta ayuda y salir"
  th: "แสดงวิธีใช้นี้แล้วออก"
  zh: "显示此帮助并退出"
cli.opt_version:
  en: "Print the version and exit"
  ru: "Показать версию и выйти"
  es: "Mostrar la versión y salir"
  th: "แสดงเวอร์ชันแล้วออก"
  zh: "显示版本并退出"
cli.opt_dump_theme:
  en: "Print a theme template (every colour token) and exit"
  ru: "Вывести шаблон темы (все цвета) и выйти"
  es: "Mostrar una plantilla de tema (todos los colores) y salir"
  th: "แสดงเทมเพลตธีม (โทเค็นสีทั้งหมด) แล้วออก"
  zh: "输出主题模板（包含所有颜色令牌）并退出"
cli.opt_dump_locale:
  en: "Print a translation template for a language (default en) and exit"
  ru: "Вывести шаблон перевода для языка (по умолчанию en) и выйти"
  es: "Imprimir una plantilla de traducción para un idioma (por defecto en) y salir"
  th: "พิมพ์เทมเพลตการแปลของภาษา (ค่าเริ่มต้น en) แล้วออก"
  zh: "输出某种语言的翻译模板（默认 en）并退出"
cli.unknown_locale:
  en: "Unknown language %{code}. Bundled languages: %{list}; external ones are files in the languages folder."
  ru: "Неизвестный язык %{code}. Встроенные языки: %{list}; внешние — файлы в папке языков."
  es: "Idioma desconocido: %{code}. Idiomas incluidos: %{list}; los externos son archivos en la carpeta de idiomas."
  th: "ไม่รู้จักภาษา %{code} ภาษาที่มาในตัว: %{list} ส่วนภาษาภายนอกเป็นไฟล์ในโฟลเดอร์ภาษา"
  zh: "未知语言 %{code}。内置语言：%{list}；外部语言是语言文件夹中的文件。"
cli.env:
  en: "Environment:"
  ru: "Переменные окружения:"
  es: "Variables de entorno:"
  th: "ตัวแปรสภาพแวดล้อม:"
  zh: "环境变量："
cli.env_backend:
  en: "force the CPU renderer"
  ru: "включить программную отрисовку"
  es: "forzar el renderizado por CPU"
  th: "บังคับใช้ตัวเรนเดอร์ด้วย CPU"
  zh: "强制使用 CPU 渲染器"
cli.env_log:
  en: "log filter (stderr; debug logs can contain message text)"
  ru: "фильтр журнала (stderr; журнал уровня debug может содержать текст сообщений)"
  es: "filtro de registro (stderr; los registros de depuración pueden contener texto de mensajes)"
  th: "ตัวกรองบันทึก (stderr; บันทึกระดับ debug อาจมีข้อความแชท)"
  zh: "日志过滤器（输出到 stderr；调试日志可能包含消息文本）"
cli.env_backtrace:
  en: "print a backtrace when the app crashes"
  ru: "печатать трассировку стека при сбое"
  es: "mostrar la traza de la pila cuando la aplicación falla"
  th: "แสดง backtrace เมื่อแอปขัดข้อง"
  zh: "应用崩溃时打印回溯信息"
