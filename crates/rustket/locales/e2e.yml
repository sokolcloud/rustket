  zh: "端到端加密未启用"
e2e.not_enabled_body:
  en: "Encrypted rooms ask for your E2E password when you open them."
  ru: "Зашифрованные комнаты попросят пароль E2E при открытии."
  es: "Las salas cifradas te piden la contraseña E2E al abrirlas."
  th: "ห้องที่เข้ารหัสจะขอรหัสผ่าน E2E เมื่อคุณเปิดห้อง"
  zh: "打开加密聊天室时会要求输入你的 E2EE 密码。"
e2e.save_password_title:
  en: "Save your encryption password"
  ru: "Сохраните пароль шифрования"
  es: "Guarda tu contraseña de cifrado"
  th: "บันทึกรหัสผ่านการเข้ารหัสของคุณ"
  zh: "保存你的加密密码"
e2e.save_password_body:
  en: "This is your end-to-end encryption password. You need it to read encrypted messages on other devices and after logging in again. It is not stored on the server."
  ru: "Это ваш пароль сквозного шифрования. Он нужен, чтобы читать зашифрованные сообщения на других устройствах и после повторного входа. На сервере он не хранится."
  es: "Esta es tu contraseña de cifrado de extremo a extremo. La necesitas para leer mensajes cifrados en otros dispositivos y después de volver a iniciar sesión. No se almacena en el servidor."
  th: "นี่คือรหัสผ่านการเข้ารหัสแบบต้นทางถึงปลายทาง ของคุณ คุณต้องใช้รหัสผ่านนี้เพื่ออ่านข้อความที่เข้ารหัสบนอุปกรณ์อื่นและหลังจากเข้าสู่ระบบอีกครั้ง รหัสผ่านนี้ไม่ได้เก็บไว้บนเซิร์ฟเวอร์"
  zh: "这是你的端到端加密密码。在其他设备上或重新登录后读取加密消息都需要它。它不会存储在服务器上。"
e2e.save_password_once:
  en: "It is shown only once. Please save it now."
  ru: "Он показывается только один раз. Сохраните его сейчас."
  es: "Solo se muestra una vez. Guárdala ahora."
  th: "รหัสผ่านจะแสดงเพียงครั้งเดียว โปรดบันทึกไว้ตอนนี้"
  zh: "密码只显示一次。请立即保存。"
e2e.save_password_later_hint:
  en: "You can change it later in My account → Security."
  ru: "Позже его можно сменить в разделе «Мой аккаунт → Безопасность»."
  es: "Puedes cambiarla más tarde en Mi cuenta → Seguridad."
  th: "คุณเปลี่ยนรหัสผ่านได้ภายหลังใน บัญชีของฉัน → ความปลอดภัย"
  zh: "你之后可以在“我的账户 → 安全”中更改它。"
