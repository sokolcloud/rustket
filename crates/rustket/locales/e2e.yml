  ru: "Сообщение зашифровано способом, который не поддерживается."
  es: "Este mensaje usa un cifrado que no se puede descifrar."
  th: "ข้อความนี้ใช้การเข้ารหัสที่ไม่สามารถถอดรหัสได้"
  zh: "此消息使用了无法解密的加密方式。"
e2e.msg_plaintext_edit:
  en: "This message also contains unencrypted content"
  ru: "Это сообщение содержит и незашифрованные данные"
  es: "Este mensaje también contiene contenido sin cifrar"
  th: "ข้อความนี้มีเนื้อหาที่ไม่ได้เข้ารหัสด้วย"
  zh: "此消息还包含未加密的内容"
e2e.file_hash_mismatch:
