  ru: "Сообщение не удаётся расшифровать ключом комнаты."
  es: "Este mensaje no se puede descifrar con la clave de la sala."
  th: "ไม่สามารถถอดรหัสข้อความนี้ด้วยคีย์ของห้องได้"
