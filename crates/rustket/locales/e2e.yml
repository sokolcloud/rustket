e2e.banner_disabled_by_admin:
  en: "End-to-end encryption was disabled by the administrator: encrypted messages stay readable, new messages are not encrypted"
  ru: "Администратор отключил сквозное шифрование: зашифрованные сообщения остаются доступны, новые не шифруются"
  es: "El administrador desactivó el cifrado de extremo a extremo: los mensajes cifrados siguen siendo legibles, los mensajes nuevos no se cifran"
  th: "ผู้ดูแลระบบปิดใช้การเข้ารหัสแบบต้นทางถึงปลายทาง แล้ว: ข้อความที่เข้ารหัสยังคงอ่านได้ แต่ข้อความใหม่จะไม่ถูกเข้ารหัส"
  zh: "管理员已禁用端到端加密：已加密的消息仍可读取，新消息将不再加密"
e2e.retry:
