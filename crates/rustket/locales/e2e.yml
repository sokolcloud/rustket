e2e.enter_password_body:
  en: "To access your encrypted rooms and messages, enter your end-to-end encryption password. It is not your login password."
  ru: "Чтобы открыть зашифрованные комнаты и сообщения, введите пароль сквозного шифрования. Это не пароль от аккаунта."
  es: "Para acceder a tus salas y mensajes cifrados, introduce tu contraseña de cifrado de extremo a extremo. No es tu contraseña de inicio de sesión."
  th: "ป้อนรหัสผ่านการเข้ารหัสแบบต้นทางถึงปลายทาง เพื่อเข้าถึงห้องและข้อความที่เข้ารหัสของคุณ รหัสผ่านนี้ไม่ใช่รหัสผ่านสำหรับเข้าสู่ระบบ"
  zh: "要访问加密的聊天室和消息，请输入你的端到端加密密码。它不是你的登录密码。"
