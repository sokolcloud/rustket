  ru: "Участники не могут читать комнату из-за отсутствия ключей? Лучше сбросьте ключи шифрования комнаты."
  es: "¿Los miembros no pueden leer la sala porque faltan sus claves? En su lugar, restablece las claves de cifrado de la sala."
  th: "สมาชิกอ่านห้องไม่ได้เพราะไม่มีคีย์ใช่ไหม ให้รีเซ็ตคีย์เข้ารหัสของห้องแทน"
  zh: "成员因缺少密钥而无法读取此聊天室？请改为重置聊天室的加密密钥。"
