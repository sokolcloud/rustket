  th: "กำลังรอคีย์เข้ารหัสของห้อง ต้องมีสมาชิกคนอื่นออนไลน์อยู่เพื่อแชร์คีย์"
  zh: "正在等待聊天室的加密密钥。需要另一位成员在线才能共享该密钥。"
e2e.composer_unavailable:
  en: "End-to-end encryption is not ready on this device"
  ru: "Сквозное шифрование на этом устройстве не готово"
  es: "El cifrado de extremo a extremo no está listo en este dispositivo"
  th: "การเข้ารหัสแบบต้นทางถึงปลายทาง ยังไม่พร้อมบนอุปกรณ์นี้"
  zh: "此设备上的端到端加密尚未就绪"
e2e.composer_unencrypted:
  en: "Messages are sent unencrypted until the room key is available"
  ru: "Сообщения отправляются без шифрования, пока ключ комнаты недоступен"
  es: "Los mensajes se envían sin cifrar hasta que la clave de la sala esté disponible"
  th: "ข้อความจะถูกส่งแบบไม่เข้ารหัสจนกว่าคีย์ของห้องจะพร้อม"
  zh: "在聊天室密钥可用之前，消息将以未加密方式发送"
e2e.enable_room:
  en: "Enable encryption"
  ru: "Включить шифрование"
  es: "Activar cifrado"
  th: "เปิดใช้การเข้ารหัส"
  zh: "启用加密"
e2e.enable_room_body:
  en: "Enable end-to-end encryption for this room? Messages and files will be readable only by members whose devices hold the room key. Search, link previews and some actions do not work with encrypted content."
  ru: "Включить сквозное шифрование в этой комнате? Сообщения и файлы смогут прочитать только участники, у устройств которых есть ключ комнаты. Поиск, предпросмотр ссылок и часть действий с зашифрованным содержимым не работают."
  es: "¿Activar el cifrado de extremo a extremo en esta sala? Los mensajes y archivos solo podrán leerlos los miembros cuyos dispositivos tengan la clave de la sala. La búsqueda, las vistas previas de enlaces y algunas acciones no funcionan con contenido cifrado."
  th: "เปิดใช้การเข้ารหัสแบบต้นทางถึงปลายทาง สำหรับห้องนี้หรือไม่ ข้อความและไฟล์จะอ่านได้เฉพาะสมาชิกที่อุปกรณ์มีคีย์ของห้อง การค้นหา ตัวอย่างลิงก์ และการดำเนินการบางอย่างใช้กับเนื้อหาที่เข้ารหัสไม่ได้"
  zh: "为此聊天室启用端到端加密？只有设备上持有聊天室密钥的成员才能读取消息和文件。搜索、链接预览和部分操作无法用于加密内容。"
e2e.enable_room_confirm:
  en: "Enable"
  ru: "Включить"
  es: "Activar"
  th: "เปิดใช้"
  zh: "启用"
e2e.disable_room:
  en: "Disable encryption"
  ru: "Отключить шифрование"
  es: "Desactivar cifrado"
  th: "ปิดใช้การเข้ารหัส"
  zh: "禁用加密"
e2e.disable_room_body:
  en: "Disable end-to-end encryption for this room? New messages will be sent unencrypted; messages encrypted before stay encrypted."
  ru: "Отключить сквозное шифрование в этой комнате? Новые сообщения будут отправляться без шифрования; прежние зашифрованные сообщения останутся зашифрованными."
  es: "¿Desactivar el cifrado de extremo a extremo en esta sala? Los mensajes nuevos se enviarán sin cifrar; los mensajes cifrados anteriormente siguen cifrados."
  th: "ปิดใช้การเข้ารหัสแบบต้นทางถึงปลายทาง สำหรับห้องนี้หรือไม่ ข้อความใหม่จะถูกส่งแบบไม่เข้ารหัส ส่วนข้อความที่เข้ารหัสไว้ก่อนหน้ายังคงเข้ารหัสอยู่"
  zh: "为此聊天室禁用端到端加密？新消息将以未加密方式发送；此前已加密的消息仍保持加密。"
e2e.disable_room_confirm:
  en: "Disable"
  ru: "Отключить"
  es: "Desactivar"
  th: "ปิดใช้"
  zh: "禁用"
e2e.disable_room_reset_hint:
