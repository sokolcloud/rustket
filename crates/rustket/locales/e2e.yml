  en: "The secret store could not be used"
  ru: "Не удалось обратиться к хранилищу секретов"
  es: "No se pudo usar el almacén de secretos"
  th: "ไม่สามารถใช้ที่เก็บข้อมูลลับได้"
  zh: "无法使用密钥存储"
e2e.err_internal:
  en: "Something went wrong with end-to-end encryption"
  ru: "Ошибка сквозного шифрования"
  es: "Algo salió mal con el cifrado de extremo a extremo"
  th: "เกิดข้อผิดพลาดกับการเข้ารหัสแบบต้นทางถึงปลายทาง"
  zh: "端到端加密出现错误"
e2e.slash_unavailable:
  en: "Slash commands are unavailable in encrypted rooms: this text is sent as an encrypted message"
  ru: "Команды недоступны в зашифрованных комнатах: этот текст будет отправлен как зашифрованное сообщение"
  es: "Los comandos de barra no están disponibles en salas cifradas: este texto se envía como mensaje cifrado"
  th: "คำสั่งสแลชใช้ไม่ได้ในห้องที่เข้ารหัส: ข้อความนี้จะถูกส่งเป็นข้อความที่เข้ารหัส"
  zh: "斜杠命令在加密聊天室中不可用：此文本将作为加密消息发送"
e2e.composer_settings_unknown:
  en: "The server's encryption settings could not be loaded yet; sending to this encrypted room is paused"
  ru: "Не удалось загрузить настройки шифрования сервера; отправка в эту зашифрованную комнату приостановлена"
  es: "Aún no se han podido cargar los ajustes de cifrado del servidor; el envío a esta sala cifrada está en pausa"
  th: "ยังโหลดการตั้งค่าการเข้ารหัสของเซิร์ฟเวอร์ไม่ได้ การส่งไปยังห้องที่เข้ารหัสนี้จึงหยุดไว้ชั่วคราว"
  zh: "尚未能加载服务器的加密设置；已暂停向此加密聊天室发送消息"
e2e.composer_room_unknown:
  en: "This room's details have not loaded yet; sending is paused until it is known whether the room is encrypted"
  ru: "Данные комнаты ещё не загружены; отправка приостановлена, пока неизвестно, зашифрована ли комната"
  es: "Los detalles de esta sala aún no se han cargado; el envío está en pausa hasta saber si la sala está cifrada"
  th: "ยังโหลดรายละเอียดของห้องนี้ไม่เสร็จ การส่งจะหยุดไว้ชั่วคราวจนกว่าจะทราบว่าห้องเข้ารหัสหรือไม่"
  zh: "此聊天室的详细信息尚未加载；在确定聊天室是否加密之前，已暂停发送"
e2e.edit_plaintext_refused:
  en: "This message was sent unencrypted and cannot be edited in an encrypted room"
  ru: "Это сообщение отправлено без шифрования, и его нельзя изменить в зашифрованной комнате"
  es: "Este mensaje se envió sin cifrar y no se puede editar en una sala cifrada"
  th: "ข้อความนี้ถูกส่งแบบไม่เข้ารหัส จึงแก้ไขในห้องที่เข้ารหัสไม่ได้"
  zh: "此消息以未加密方式发送，无法在加密聊天室中编辑"
e2e.sign_out_warning_title:
  en: "Save your E2E password first"
  ru: "Сначала сохраните пароль E2E"
  es: "Guarda primero tu contraseña E2E"
  th: "บันทึกรหัสผ่าน E2E ก่อน"
  zh: "请先保存你的 E2EE 密码"
e2e.sign_out_warning_body:
  en: "You have not saved your end-to-end encryption password yet. It is deleted from this device when you sign out, and without it encrypted messages cannot be read after you sign in again."
  ru: "Вы ещё не сохранили пароль сквозного шифрования. При выходе он будет удалён с этого устройства, а без него после повторного входа зашифрованные сообщения прочитать не получится."
  es: "Aún no has guardado tu contraseña de cifrado de extremo a extremo. Se borra de este dispositivo al cerrar sesión y, sin ella, los mensajes cifrados no se podrán leer cuando vuelvas a iniciar sesión."
  th: "คุณยังไม่ได้บันทึกรหัสผ่านการเข้ารหัสแบบต้นทางถึงปลายทาง รหัสผ่านจะถูกลบออกจากอุปกรณ์นี้เมื่อคุณออกจากระบบ และหากไม่มีรหัสผ่านนี้ คุณจะอ่านข้อความที่เข้ารหัสไม่ได้หลังจากลงชื่อเข้าใช้อีกครั้ง"
  zh: "你尚未保存端到端加密密码。退出登录时它将从此设备上删除，没有它，重新登录后将无法读取加密消息。"
e2e.remove_warning_body:
  en: "You have not saved your end-to-end encryption password yet. It is deleted from this device when you remove this server, and without it encrypted messages cannot be read after you add the server and sign in again."
  ru: "Вы ещё не сохранили пароль сквозного шифрования. При удалении сервера он будет удалён с этого устройства, а без него после повторного добавления сервера и входа зашифрованные сообщения прочитать не получится."
  es: "Aún no has guardado tu contraseña de cifrado de extremo a extremo. Se borra de este dispositivo al quitar este servidor y, sin ella, los mensajes cifrados no se podrán leer cuando vuelvas a añadir el servidor e iniciar sesión."
  th: "คุณยังไม่ได้บันทึกรหัสผ่านการเข้ารหัสแบบต้นทางถึงปลายทาง รหัสผ่านจะถูกลบออกจากอุปกรณ์นี้เมื่อคุณนำเซิร์ฟเวอร์นี้ออก และหากไม่มีรหัสผ่านนี้ คุณจะอ่านข้อความที่เข้ารหัสไม่ได้หลังจากเพิ่มเซิร์ฟเวอร์และลงชื่อเข้าใช้อีกครั้ง"
  zh: "你尚未保存端到端加密密码。移除此服务器时它将从此设备上删除，没有它，重新添加服务器并登录后将无法读取加密消息。"
e2e.sign_out_warning_hint:
  en: "Copy it to a safe place, such as a password manager, before you continue."
  ru: "Прежде чем продолжить, скопируйте его в надёжное место, например в менеджер паролей."
  es: "Cópiala en un lugar seguro, como un gestor de contraseñas, antes de continuar."
  th: "คัดลอกรหัสผ่านไปเก็บไว้ในที่ปลอดภัย เช่น โปรแกรมจัดการรหัสผ่าน ก่อนดำเนินการต่อ"
  zh: "继续之前，请将其复制到安全的地方，例如密码管理器。"
e2e.sign_out_anyway:
  en: "Sign out anyway"
  ru: "Всё равно выйти"
  es: "Cerrar sesión de todos modos"
  th: "ออกจากระบบเลย"
  zh: "仍然退出登录"
e2e.remove_anyway:
  en: "Remove anyway"
  ru: "Всё равно удалить"
  es: "Quitar de todos modos"
  th: "นำออกเลย"
  zh: "仍然移除"
