  th: "ไฟล์ที่ถอดรหัสแล้วไม่ตรงกับเช็กซัม"
  zh: "解密后的文件与其校验和不符"
e2e.files_unencrypted_refused:
  en: "Files cannot be sent unencrypted in an encrypted room"
  ru: "В зашифрованную комнату нельзя отправлять незашифрованные файлы"
  es: "No se pueden enviar archivos sin cifrar en una sala cifrada"
  th: "ไม่สามารถส่งไฟล์แบบไม่เข้ารหัสในห้องที่เข้ารหัสได้"
  zh: "在加密聊天室中不能发送未加密的文件"
e2e.send_blocked:
