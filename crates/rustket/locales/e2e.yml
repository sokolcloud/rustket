  ru: "Войдите снова, чтобы создать новые ключи шифрования."
  es: "Vuelve a iniciar sesión para crear nuevas claves de cifrado."
  th: "เข้าสู่ระบบอีกครั้งเพื่อสร้างคีย์เข้ารหัสใหม่"
  zh: "请重新登录以创建新的加密密钥。"
