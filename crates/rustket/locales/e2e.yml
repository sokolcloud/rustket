  ru: "Сбросить ключи шифрования"
  es: "Restablecer claves de cifrado"
  th: "รีเซ็ตคีย์เข้ารหัส"
  zh: "重置加密密钥"
e2e.reset_room_key_body:
  en: "Create a new encryption key for this room? Members get it from online members with the key. Members who had no key before cannot read older messages."
  ru: "Создать новый ключ шифрования комнаты? Участники получат его от участников в сети, у которых есть ключ. Те, у кого ключа не было, не смогут прочитать старые сообщения."
  es: "¿Crear una nueva clave de cifrado para esta sala? Los miembros la reciben de los miembros conectados que tienen la clave. Los miembros que no tenían clave no podrán leer los mensajes anteriores."
  th: "สร้างคีย์เข้ารหัสใหม่สำหรับห้องนี้หรือไม่ สมาชิกจะได้รับคีย์จากสมาชิกที่ออนไลน์และมีคีย์อยู่ สมาชิกที่ไม่เคยมีคีย์มาก่อนจะอ่านข้อความเก่าไม่ได้"
  zh: "为此聊天室创建新的加密密钥？成员将从持有该密钥的在线成员处获取它。此前没有密钥的成员无法读取较早的消息。"
e2e.reset_room_key_confirm:
  en: "Reset keys"
  ru: "Сбросить ключи"
  es: "Restablecer claves"
  th: "รีเซ็ตคีย์"
  zh: "重置密钥"
