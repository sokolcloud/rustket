e2e.account_help:
  en: "Messages and files in encrypted rooms can only be read on devices that know your E2E password."
  ru: "Сообщения и файлы зашифрованных комнат можно прочитать только на устройствах, которым известен ваш пароль E2E."
  es: "Los mensajes y archivos de las salas cifradas solo se pueden leer en dispositivos que conocen tu contraseña E2E."
  th: "ข้อความและไฟล์ในห้องที่เข้ารหัสจะอ่านได้เฉพาะบนอุปกรณ์ที่รู้รหัสผ่าน E2E ของคุณ"
  zh: "加密聊天室中的消息和文件只能在知道你的 E2EE 密码的设备上读取。"
