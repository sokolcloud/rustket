e2e.msg_locked:
  en: "This message is end-to-end encrypted. Enter your E2E password to read it."
  ru: "Сообщение защищено сквозным шифрованием. Введите пароль E2E, чтобы прочитать его."
  es: "Este mensaje está cifrado de extremo a extremo. Introduce tu contraseña E2E para leerlo."
  th: "ข้อความนี้เข้ารหัสแบบต้นทางถึงปลายทาง ป้อนรหัสผ่าน E2E ของคุณเพื่ออ่าน"
  zh: "此消息已进行端到端加密。请输入你的 E2EE 密码以读取。"
