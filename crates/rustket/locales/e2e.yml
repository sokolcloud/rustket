  th: "แก้ไขข้อความที่เข้ารหัสไม่ได้จนกว่าคีย์เข้ารหัสของห้องจะพร้อม"
  zh: "在聊天室加密密钥可用之前，无法编辑加密消息"
e2e.composer_locked:
