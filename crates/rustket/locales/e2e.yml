  zh: "只能使用拉丁字母、数字和符号（所有客户端均可读取）"
e2e.account_reset_title:
  en: "Reset E2E password"
  ru: "Сбросить пароль E2E"
  es: "Restablecer contraseña E2E"
  th: "รีเซ็ตรหัสผ่าน E2E"
  zh: "重置 E2EE 密码"
e2e.account_reset_help:
  en: "Forgot your E2E password? Resetting creates new keys: messages encrypted before stay unreadable for you until another member shares the room keys again, and you will be logged out."
  ru: "Забыли пароль E2E? Сброс создаёт новые ключи: прежние зашифрованные сообщения останутся недоступны, пока другой участник снова не передаст ключи комнат, и вы выйдете из аккаунта."
  es: "¿Olvidaste tu contraseña E2E? Al restablecerla se crean claves nuevas: los mensajes cifrados anteriormente seguirán siendo ilegibles para ti hasta que otro miembro vuelva a compartir las claves de la sala, y se cerrará tu sesión."
  th: "ลืมรหัสผ่าน E2E ใช่ไหม การรีเซ็ตจะสร้างคีย์ใหม่: ข้อความที่เข้ารหัสไว้ก่อนหน้าจะอ่านไม่ได้จนกว่าสมาชิกคนอื่นจะแชร์คีย์ของห้องให้อีกครั้ง และคุณจะถูกออกจากระบบ"
  zh: "忘记了 E2EE 密码？重置会创建新密钥：在其他成员再次共享聊天室密钥之前，你将无法读取此前的加密消息，并且你将退出登录。"
e2e.account_reset_confirm:
  en: "This cannot be undone. You will be logged out of this server on every device."
  ru: "Это нельзя отменить. Вы выйдете с этого сервера на всех устройствах."
  es: "Esta acción no se puede deshacer. Se cerrará tu sesión en este servidor en todos los dispositivos."
  th: "การดำเนินการนี้ไม่สามารถย้อนกลับได้ คุณจะถูกออกจากระบบของเซิร์ฟเวอร์นี้บนทุกอุปกรณ์"
  zh: "此操作无法撤销。你将在所有设备上退出此服务器的登录。"
