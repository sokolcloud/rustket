  ru: "Ключи шифрования комнаты сброшены"
  es: "Se restablecieron las claves de cifrado de la sala"
  th: "รีเซ็ตคีย์เข้ารหัสของห้องแล้ว"
  zh: "聊天室的加密密钥已重置"
