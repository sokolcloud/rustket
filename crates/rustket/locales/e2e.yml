e2e.msg_no_key:
  en: "This message cannot be decrypted: its key is missing after room key resets."
  ru: "Сообщение нельзя расшифровать: после сброса ключей комнаты его ключ недоступен."
  es: "Este mensaje no se puede descifrar: falta su clave tras restablecer las claves de la sala."
  th: "ไม่สามารถถอดรหัสข้อความนี้ได้: คีย์หายไปหลังจากรีเซ็ตคีย์ของห้อง"
  zh: "无法解密此消息：聊天室密钥重置后，其密钥已丢失。"
e2e.msg_key_error:
