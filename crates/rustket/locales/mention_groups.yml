_version: 2
mention_groups.title:
  en: "Mention groups"
  ru: "Группы упоминаний"
  es: "Grupos de mención"
  th: "กลุ่มการกล่าวถึง"
  zh: "提及组"
mention_groups.caption:
  en: "A group like @backend notifies everyone in it: when you send a message, Rustket adds their names after the group, as in @backend (@alice @bob). Groups sync across your devices through a hidden room on the server; its administrators can see group names and usernames."
  ru: "Группа вроде @backend оповещает всех, кто в неё входит: при отправке Rustket добавляет их имена после группы, например @backend (@alice @bob). Группы синхронизируются между вашими устройствами через скрытую комнату на сервере; её администраторы видят названия групп и имена пользователей."
  es: "Un grupo como @backend notifica a todos sus miembros: al enviar un mensaje, Rustket añade sus nombres después del grupo, como en @backend (@alice @bob). Los grupos se sincronizan entre tus dispositivos mediante una sala oculta en el servidor; sus administradores pueden ver los nombres de los grupos y de usuario."
  th: "กลุ่มอย่าง @backend จะแจ้งเตือนทุกคนในกลุ่ม เมื่อคุณส่งข้อความ Rustket จะเพิ่มชื่อของพวกเขาต่อท้ายกลุ่ม เช่น @backend (@alice @bob) กลุ่มจะซิงค์ระหว่างอุปกรณ์ของคุณผ่านห้องที่ซ่อนอยู่บนเซิร์ฟเวอร์ ผู้ดูแลระบบของเซิร์ฟเวอร์จะเห็นชื่อกลุ่มและชื่อผู้ใช้"
  zh: "像 @backend 这样的组会通知组内的每个人：发送消息时，Rustket 会在组名后加上他们的用户名，例如 @backend (@alice @bob)。组通过服务器上的一个隐藏聊天室在你的设备之间同步；服务器管理员可以看到组名和用户名。"
mention_groups.signed_out:
  en: "Sign in to a server to edit its mention groups."
  ru: "Войдите на сервер, чтобы изменить его группы упоминаний."
  es: "Inicia sesión en un servidor para editar sus grupos de mención."
  th: "ลงชื่อเข้าใช้เซิร์ฟเวอร์เพื่อแก้ไขกลุ่มการกล่าวถึง"
  zh: "登录服务器后即可编辑其提及组。"
