  zh: "部分更改尚未保存到服务器。"
mention_groups.failed:
  en: "Couldn't sync mention groups: %{error}. They are kept on this device until the next try."
  ru: "Не удалось синхронизировать группы упоминаний: %{error}. Они сохранены на этом устройстве до следующей попытки."
  es: "No se pudieron sincronizar los grupos de mención: %{error}. Se conservan en este dispositivo hasta el próximo intento."
  th: "ไม่สามารถซิงค์กลุ่มการกล่าวถึงได้: %{error} กลุ่มจะเก็บไว้บนอุปกรณ์นี้จนกว่าจะลองใหม่ครั้งถัดไป"
  zh: "无法同步提及组：%{error}。在下次尝试之前，它们会保存在此设备上。"
mention_groups.sync_failed:
  en: "Couldn't sync mention groups. They are kept on this device until the next try."
  ru: "Не удалось синхронизировать группы упоминаний. Они сохранены на этом устройстве до следующей попытки."
  es: "No se pudieron sincronizar los grupos de mención. Se conservan en este dispositivo hasta el próximo intento."
  th: "ซิงค์กลุ่มการกล่าวถึงไม่ได้ กลุ่มจะถูกเก็บไว้ในอุปกรณ์นี้จนกว่าจะลองครั้งถัดไป"
  zh: "无法同步提及组。在下次重试前，它们会保存在本设备上。"
mention_groups.edit_failed:
  en: "Couldn't change the mention group"
  ru: "Не удалось изменить группу упоминаний"
  es: "No se pudo cambiar el grupo de mención"
  th: "เปลี่ยนกลุ่มการกล่าวถึงไม่ได้"
  zh: "无法更改提及组"
mention_groups.err_name:
  en: "Use %{min}–%{max} lowercase letters, digits, - or _, starting with a letter or digit."
  ru: "Используйте от %{min} до %{max} строчных латинских букв, цифр, - или _; начинаться нужно с буквы или цифры."
  es: "Usa de %{min} a %{max} letras minúsculas, dígitos, - o _, empezando por una letra o un dígito."
  th: "ใช้ตัวอักษรภาษาอังกฤษตัวพิมพ์เล็ก ตัวเลข - หรือ _ จำนวน %{min}–%{max} ตัว โดยขึ้นต้นด้วยตัวอักษรหรือตัวเลข"
  zh: "请使用 %{min}–%{max} 个小写字母、数字、- 或 _，并以字母或数字开头。"
mention_groups.err_reserved:
  en: "@%{name} is reserved by the server."
  ru: "@%{name} зарезервировано сервером."
  es: "@%{name} está reservado por el servidor."
  th: "@%{name} ถูกสงวนไว้โดยเซิร์ฟเวอร์"
  zh: "@%{name} 已被服务器保留。"
mention_groups.err_own:
  en: "That's your own username."
  ru: "Это ваше собственное имя пользователя."
  es: "Ese es tu propio nombre de usuario."
  th: "นี่คือชื่อผู้ใช้ของคุณเอง"
  zh: "这是你自己的用户名。"
mention_groups.err_duplicate:
  en: "You already have a group with this name."
  ru: "У вас уже есть группа с таким названием."
  es: "Ya tienes un grupo con este nombre."
  th: "คุณมีกลุ่มที่ใช้ชื่อนี้อยู่แล้ว"
  zh: "你已有同名的组。"
mention_groups.err_user:
  en: "@%{name} is a user on this server."
  ru: "@%{name} — пользователь на этом сервере."
  es: "@%{name} es un usuario de este servidor."
  th: "@%{name} เป็นผู้ใช้บนเซิร์ฟเวอร์นี้"
  zh: "@%{name} 是此服务器上的用户。"
mention_groups.err_team:
  en: "@%{name} is a team on this server."
  ru: "@%{name} — команда на этом сервере."
  es: "@%{name} es un equipo de este servidor."
  th: "@%{name} เป็นทีมบนเซิร์ฟเวอร์นี้"
  zh: "@%{name} 是此服务器上的团队。"
mention_groups.err_empty:
  en: "Add at least one person besides you."
  ru: "Добавьте хотя бы одного участника, кроме себя."
  es: "Añade al menos a una persona además de ti."
  th: "เพิ่มสมาชิกอย่างน้อยหนึ่งคนนอกจากตัวคุณ"
  zh: "请至少添加一位除你以外的成员。"
mention_groups.err_too_many:
  en: "A group can have at most %{max} people."
  ru: "В группе может быть не больше %{max} участников."
  es: "Un grupo puede tener como máximo %{max} personas."
  th: "กลุ่มหนึ่งมีสมาชิกได้ไม่เกิน %{max} คน"
  zh: "一个组最多可有 %{max} 人。"
mention_groups.err_full:
  en: "You can have at most %{max} groups."
  ru: "Можно создать не больше %{max} групп."
  es: "Puedes tener como máximo %{max} grupos."
  th: "คุณมีกลุ่มได้ไม่เกิน %{max} กลุ่ม"
  zh: "最多可有 %{max} 个组。"
mention_groups.err_too_large:
  en: "The groups are too large to sync. Remove some people or groups."
  ru: "Группы слишком большие для синхронизации. Уберите часть участников или групп."
  es: "Los grupos son demasiado grandes para sincronizarse. Quita algunas personas o grupos."
  th: "กลุ่มมีขนาดใหญ่เกินกว่าจะซิงค์ได้ โปรดนำสมาชิกหรือกลุ่มบางส่วนออก"
  zh: "组太大，无法同步。请移除一些成员或组。"
mention_groups.err_missing:
  en: "Not found on the server: %{names}."
  ru: "Не найдены на сервере: %{names}."
  es: "No encontrados en el servidor: %{names}."
  th: "ไม่พบบนเซิร์ฟเวอร์: %{names}"
  zh: "服务器上找不到：%{names}。"
mention_groups.err_check:
  en: "Couldn't check the names: %{error}"
  ru: "Не удалось проверить имена: %{error}"
  es: "No se pudieron comprobar los nombres: %{error}"
  th: "ตรวจสอบชื่อไม่ได้: %{error}"
  zh: "无法检查名称：%{error}"
mention_groups.edit_no_notify:
  en: "Edited messages don't notify newly mentioned people."
  ru: "При правке сообщения новые упомянутые участники не получают оповещений."
  es: "Los mensajes editados no notifican a las personas mencionadas de nuevo."
  th: "ข้อความที่แก้ไขจะไม่แจ้งเตือนผู้ที่ถูกกล่าวถึงใหม่"
  zh: "编辑后的消息不会通知新提及的人。"
mention_groups.e2e_cap:
  en: "Encrypted messages notify only the first %{max} mentions."
  ru: "Зашифрованные сообщения оповещают только первые %{max} упоминаний."
  es: "Los mensajes cifrados solo notifican las primeras %{max} menciones."
  th: "ข้อความที่เข้ารหัสจะแจ้งเตือนเฉพาะการกล่าวถึง %{max} รายการแรก"
  zh: "加密消息只会通知前 %{max} 个提及。"
