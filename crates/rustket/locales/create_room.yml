create_room.help_channel:
  en: "A public channel: anyone can find and join it."
  ru: "Публичный канал: любой может найти его и вступить."
  es: "Un canal público: cualquiera puede encontrarlo y unirse."
  th: "ช่องสาธารณะ: ทุกคนค้นหาและเข้าร่วมได้"
  zh: "公共频道：任何人都可以找到并加入。"
create_room.help_group:
  en: "A private channel: only invited people can see and join it."
  ru: "Приватный канал: видят и вступают только приглашённые."
  es: "Un canal privado: solo las personas invitadas pueden verlo y unirse."
  th: "ช่องส่วนตัว: เฉพาะผู้ที่ได้รับเชิญเท่านั้นที่เห็นและเข้าร่วมได้"
  zh: "私有频道：只有受邀者可以看到并加入。"
create_room.help_team:
  en: "A team groups channels and people around a common goal."
  ru: "Команда объединяет каналы и людей вокруг общей цели."
  es: "Un equipo reúne canales y personas en torno a un objetivo común."
  th: "ทีมรวมช่องและผู้คนเข้าด้วยกันเพื่อเป้าหมายร่วมกัน"
  zh: "团队将频道和成员围绕共同目标组织在一起。"
create_room.help_dm:
  en: "A private conversation with one or more people."
  ru: "Личная переписка с одним или несколькими людьми."
  es: "Una conversación privada con una o varias personas."
  th: "บทสนทนาส่วนตัวกับคนหนึ่งคนหรือมากกว่า"
  zh: "与一人或多人的私人会话。"
create_room.help_discussion:
  en: "A focused conversation inside an existing channel."
  ru: "Отдельная беседа внутри существующего канала."
  es: "Una conversación centrada en un tema dentro de un canal existente."
  th: "บทสนทนาเฉพาะเรื่องภายในช่องที่มีอยู่"
  zh: "在现有频道内围绕特定话题的会话。"
