_version: 2
moderation.act_report_user:
  en: "Report user"
  ru: "Пожаловаться на пользователя"
  es: "Denunciar usuario"
  th: "รายงานผู้ใช้"
  zh: "举报用户"
moderation.report_user:
  en: "Report user"
  ru: "Пожаловаться на пользователя"
  es: "Denunciar usuario"
  th: "รายงานผู้ใช้"
  zh: "举报用户"
moderation.report_user_title:
  en: "Report %{user}"
  ru: "Пожаловаться на %{user}"
  es: "Denunciar a %{user}"
  th: "รายงาน %{user}"
  zh: "举报 %{user}"
moderation.report_user_body:
  en: "Tell the workspace's moderators what this user did. They decide what happens next."
  ru: "Расскажите модераторам рабочего пространства, что сделал этот пользователь. Дальнейшее решают они."
  es: "Explica a los moderadores del espacio de trabajo qué hizo este usuario. Ellos deciden qué hacer."
  th: "แจ้งผู้ดูแลของเวิร์กสเปซว่าผู้ใช้นี้ทำอะไร ผู้ดูแลจะตัดสินใจขั้นต่อไป"
  zh: "请告诉工作区的版主该用户做了什么，由他们决定如何处理。"
moderation.user_reported:
  en: "Report sent to the moderators"
  ru: "Жалоба отправлена модераторам"
  es: "Denuncia enviada a los moderadores"
  th: "ส่งรายงานถึงผู้ดูแลแล้ว"
  zh: "举报已发送给版主"
moderation.report_user_failed:
  en: "Couldn't report the user"
  ru: "Не удалось пожаловаться на пользователя"
  es: "No se pudo denunciar al usuario"
  th: "รายงานผู้ใช้ไม่ได้"
  zh: "无法举报该用户"
moderation.block:
  en: "Block"
  ru: "Заблокировать"
  es: "Bloquear"
  th: "บล็อก"
  zh: "屏蔽"
moderation.unblock:
  en: "Unblock"
  ru: "Разблокировать"
  es: "Desbloquear"
  th: "เลิกบล็อก"
  zh: "取消屏蔽"
moderation.confirm_block:
  en: "Block %{user}? Neither of you can send messages in this direct message, and their messages are hidden from you."
  ru: "Заблокировать %{user}? Никто из вас не сможет писать в этих личных сообщениях, а сообщения пользователя будут скрыты."
  es: "¿Bloquear a %{user}? Ninguno de los dos podrá enviar mensajes en este mensaje directo y sus mensajes quedarán ocultos."
  th: "บล็อก %{user} ใช่ไหม ทั้งสองฝ่ายจะส่งข้อความในข้อความส่วนตัวนี้ไม่ได้ และข้อความของผู้ใช้นี้จะถูกซ่อน"
  zh: "屏蔽 %{user}？你们双方都无法在此私信中发送消息，对方的消息将对你隐藏。"
moderation.done_blocked:
  en: "%{user} is blocked"
  ru: "%{user} заблокирован"
  es: "%{user} está bloqueado"
  th: "บล็อก %{user} แล้ว"
  zh: "已屏蔽 %{user}"
moderation.done_unblocked:
  en: "%{user} is unblocked"
  ru: "%{user} разблокирован"
  es: "%{user} está desbloqueado"
  th: "เลิกบล็อก %{user} แล้ว"
  zh: "已取消屏蔽 %{user}"
moderation.message_blocked:
  en: "Message from a blocked user"
  ru: "Сообщение заблокированного пользователя"
  es: "Mensaje de un usuario bloqueado"
  th: "ข้อความจากผู้ใช้ที่ถูกบล็อก"
  zh: "来自已屏蔽用户的消息"
moderation.message_filtered:
  en: "Hidden by your hidden words"
  ru: "Скрыто по вашему списку скрытых слов"
  es: "Oculto por tus palabras ocultas"
  th: "ซ่อนตามคำที่คุณซ่อนไว้"
  zh: "已按你的隐藏词隐藏"
moderation.hidden_title:
  en: "Hidden words"
  ru: "Скрытые слова"
  es: "Palabras ocultas"
  th: "คำที่ซ่อน"
  zh: "隐藏词"
moderation.hidden_help:
  en: "Messages from others that contain one of these words or phrases are collapsed in every room. Click a collapsed message to show it."
  ru: "Сообщения других пользователей с этими словами или фразами сворачиваются во всех комнатах. Нажмите на свёрнутое сообщение, чтобы показать его."
  es: "Los mensajes de otras personas que contienen alguna de estas palabras o frases se contraen en todas las salas. Haz clic en un mensaje contraído para mostrarlo."
  th: "ข้อความจากผู้อื่นที่มีคำหรือวลีเหล่านี้จะถูกยุบในทุกห้อง คลิกข้อความที่ยุบเพื่อแสดง"
  zh: "他人发送的包含这些词语或短语的消息会在所有房间中折叠。点击折叠的消息即可显示。"
moderation.hidden_whole_word:
  en: "Whole words only"
  ru: "Только целые слова"
  es: "Solo palabras completas"
  th: "เฉพาะทั้งคำ"
  zh: "仅匹配完整单词"
moderation.hidden_whole_word_help:
  en: "A word inside a longer word does not count. Case is always ignored."
  ru: "Слово внутри более длинного слова не учитывается. Регистр не важен."
  es: "Una palabra dentro de otra más larga no cuenta. No se distingue entre mayúsculas y minúsculas."
  th: "คำที่อยู่ในคำที่ยาวกว่าจะไม่นับ ไม่สนใจตัวพิมพ์เล็กใหญ่เสมอ"
  zh: "较长单词中包含的词不算匹配。始终不区分大小写。"
moderation.hidden_add_label:
  en: "Add a word or phrase"
  ru: "Добавить слово или фразу"
  es: "Añadir una palabra o frase"
  th: "เพิ่มคำหรือวลี"
  zh: "添加词语或短语"
moderation.hidden_placeholder:
  en: "e.g. spoiler"
  ru: "например, спойлер"
  es: "p. ej., spoiler"
  th: "เช่น สปอยล์"
  zh: "例如：剧透"
moderation.hidden_add:
  en: "Add"
  ru: "Добавить"
  es: "Añadir"
  th: "เพิ่ม"
  zh: "添加"
moderation.hidden_remove:
  en: "Remove"
  ru: "Удалить"
  es: "Quitar"
  th: "ลบ"
  zh: "移除"
moderation.hidden_none:
  en: "No hidden words yet."
  ru: "Скрытых слов пока нет."
  es: "Todavía no hay palabras ocultas."
  th: "ยังไม่มีคำที่ซ่อน"
  zh: "还没有隐藏词。"
moderation.hidden_empty:
  en: "Type a word or phrase first."
  ru: "Сначала введите слово или фразу."
  es: "Escribe primero una palabra o frase."
  th: "พิมพ์คำหรือวลีก่อน"
  zh: "请先输入词语或短语。"
