room_panel.confirm_hide:
  en: "Hide %{room}? You can find it again in the directory or through search."
  ru: "Скрыть %{room}? Комнату можно снова найти в каталоге или поиском."
  es: "¿Ocultar %{room}? Puedes volver a encontrarla en el directorio o con la búsqueda."
  th: "ซ่อน %{room} ใช่ไหม คุณสามารถค้นหาห้องนี้ได้อีกครั้งในไดเรกทอรีหรือผ่านการค้นหา"
  zh: "隐藏 %{room}？之后可以在目录中或通过搜索重新找到它。"
room_panel.confirm_leave:
  en: "Leave %{room}? You will need an invitation or to join again to come back."
  ru: "Покинуть %{room}? Чтобы вернуться, понадобится приглашение или повторное вступление."
  es: "¿Salir de %{room}? Para volver necesitarás una invitación o unirte de nuevo."
  th: "ออกจาก %{room} ใช่ไหม คุณจะต้องได้รับคำเชิญหรือเข้าร่วมใหม่เพื่อกลับมา"
  zh: "离开 %{room}？之后需要邀请或重新加入才能返回。"
room_panel.confirm_delete:
  en: "Delete %{room}? All messages and files will be deleted. This cannot be undone."
  ru: "Удалить %{room}? Все сообщения и файлы будут удалены. Это нельзя отменить."
  es: "¿Eliminar %{room}? Se eliminarán todos los mensajes y archivos. Esta acción no se puede deshacer."
  th: "ลบ %{room} ใช่ไหม ข้อความและไฟล์ทั้งหมดจะถูกลบ การดำเนินการนี้ไม่สามารถย้อนกลับได้"
  zh: "删除 %{room}？所有消息和文件都将被删除，此操作无法撤销。"
