  th: "ที่เก็บรหัสผ่านของระบบไม่พร้อมใช้งาน โทเค็นการเข้าสู่ระบบและคีย์ E2E จึงถูกเก็บในไฟล์บนคอมพิวเตอร์เครื่องนี้ ไฟล์นี้ไม่ได้เข้ารหัส"
