  ru: "Незашифрованный файл входов и ключей E2E удалён. Его записи (%{count}) хранятся в памяти до выхода из приложения."
  es: "Se eliminó el archivo sin cifrar de inicios de sesión y claves E2E. Sus entradas (%{count}) se guardan en memoria hasta que cierres la aplicación."
  th: "ลบไฟล์การเข้าสู่ระบบและคีย์ E2E ที่ไม่ได้เข้ารหัสแล้ว รายการ %{count} รายการในไฟล์จะถูกเก็บในหน่วยความจำจนกว่าคุณจะออกจากโปรแกรม"
