app.secrets_memory_title:
  en: "Never store secrets in a file?"
  ru: "Никогда не хранить секреты в файле?"
  es: "¿No guardar nunca los secretos en un archivo?"
  th: "ไม่เก็บข้อมูลลับในไฟล์เลยใช่ไหม"
  zh: "永不将机密存储到文件中？"
app.secrets_memory_body:
  en: "Login tokens and E2E keys will never be written to a file. Whenever the system keyring is unavailable, they are kept in memory and forgotten when Rustket quits: after such a restart you have to sign in again and enter your E2E password. While the keyring works, nothing changes."
  ru: "Токены входа и ключи E2E никогда не будут записываться в файл. Если системное хранилище паролей недоступно, они хранятся в памяти и забываются при выходе из Rustket: после такого перезапуска придётся снова войти и ввести пароль E2E. Пока хранилище паролей работает, ничего не меняется."
  es: "Los tokens de inicio de sesión y las claves E2E nunca se escribirán en un archivo. Cuando el llavero del sistema no esté disponible, se guardan en memoria y se olvidan al cerrar Rustket: después de ese reinicio tendrás que volver a iniciar sesión e introducir tu contraseña E2E. Mientras el llavero funcione, no cambia nada."
  th: "โทเค็นการเข้าสู่ระบบและคีย์ E2E จะไม่ถูกเขียนลงไฟล์เลย เมื่อที่เก็บรหัสผ่านของระบบไม่พร้อมใช้งาน ข้อมูลจะถูกเก็บในหน่วยความจำและหายไปเมื่อออกจาก Rustket หลังจากเปิดโปรแกรมใหม่ในกรณีนี้ คุณต้องลงชื่อเข้าใช้อีกครั้งและป้อนรหัสผ่าน E2E ระหว่างที่ที่เก็บรหัสผ่านใช้งานได้ จะไม่มีอะไรเปลี่ยนแปลง"
  zh: "登录令牌和 E2EE 密钥将永远不会写入文件。系统密钥环不可用时，它们保存在内存中，并在 Rustket 退出时被清除：这种情况下重启后需要重新登录并输入你的 E2EE 密码。密钥环可用时，一切照旧。"
app.secrets_memory_file_note:
  en: "The unencrypted file in use now is deleted right away; you stay signed in until you quit."
  ru: "Используемый сейчас незашифрованный файл будет сразу удалён; до выхода из приложения вы останетесь в системе."
  es: "El archivo sin cifrar que se usa ahora se elimina de inmediato; seguirás con la sesión iniciada hasta que cierres la aplicación."
  th: "ไฟล์ที่ไม่ได้เข้ารหัสซึ่งใช้อยู่ตอนนี้จะถูกลบทันที คุณยังคงลงชื่อเข้าใช้อยู่จนกว่าจะออกจากโปรแกรม"
  zh: "当前使用的未加密文件会立即删除；在你退出应用之前，你仍保持登录。"
app.secrets_memory_pending:
  en: "The generated E2E password of %{accounts} has not been saved yet. It will be lost when Rustket quits, and without it encrypted messages cannot be read after you sign in again. Cancel and save it first: open that workspace and use “Show password” in its E2E banner (sign in first if needed)."
  ru: "Сгенерированный пароль E2E для %{accounts} ещё не сохранён. Он пропадёт при выходе из Rustket, и без него после повторного входа зашифрованные сообщения прочитать не получится. Нажмите «Отмена» и сначала сохраните его: откройте это рабочее пространство и нажмите «Показать пароль» в его баннере E2E (при необходимости сначала войдите)."
  es: "La contraseña E2E generada para %{accounts} aún no se ha guardado. Se perderá al cerrar Rustket y, sin ella, los mensajes cifrados no se podrán leer cuando vuelvas a iniciar sesión. Cancela y guárdala primero: abre ese espacio de trabajo y usa «Mostrar contraseña» en su aviso E2E (inicia sesión antes si hace falta)."
  th: "รหัสผ่าน E2E ที่สร้างขึ้นสำหรับ %{accounts} ยังไม่ได้บันทึก รหัสผ่านจะหายไปเมื่อออกจาก Rustket และหากไม่มีรหัสผ่านนี้ คุณจะอ่านข้อความที่เข้ารหัสไม่ได้หลังจากลงชื่อเข้าใช้อีกครั้ง โปรดยกเลิกและบันทึกรหัสผ่านก่อน: เปิดเวิร์กสเปซนั้นแล้วใช้ \"แสดงรหัสผ่าน\" ในแบนเนอร์ E2E (ลงชื่อเข้าใช้ก่อนหากจำเป็น)"
  zh: "为 %{accounts} 生成的 E2EE 密码尚未保存。Rustket 退出时它将丢失，没有它，重新登录后将无法读取加密消息。请先取消并保存它：打开该工作区，在其 E2EE 横幅中点击“显示密码”（如有需要请先登录）。"
