  zh: "系统密钥环不可用：%{reason}"
app.keyring_unreachable:
  en: "Logins saved in the system keyring cannot be read now; sign in again or unlock the keyring."
  ru: "Входы, сохранённые в системном хранилище паролей, сейчас недоступны; войдите снова или разблокируйте хранилище."
  es: "Ahora no se pueden leer los inicios de sesión guardados en el llavero del sistema; vuelve a iniciar sesión o desbloquea el llavero."
  th: "ขณะนี้อ่านการเข้าสู่ระบบที่บันทึกไว้ในที่เก็บรหัสผ่านของระบบไม่ได้ โปรดลงชื่อเข้าใช้อีกครั้งหรือปลดล็อกที่เก็บรหัสผ่าน"
  zh: "目前无法读取保存在系统密钥环中的登录信息，请重新登录或解锁密钥环。"
app.keyring_migrated:
  en: "%{count} saved login(s) were moved into the system keyring."
  ru: "Сохранённые входы (%{count}) перенесены в системное хранилище паролей."
  es: "Inicios de sesión guardados movidos al llavero del sistema: %{count}."
  th: "ย้ายการเข้าสู่ระบบที่บันทึกไว้ %{count} รายการไปยังที่เก็บรหัสผ่านของระบบแล้ว"
  zh: "已将 %{count} 个保存的登录移入系统密钥环。"
app.plaintext_left:
  en: "%{count} saved login(s) are still stored in a plain file."
  ru: "Сохранённые входы (%{count}) всё ещё хранятся в обычном файле."
  es: "Inicios de sesión guardados que siguen en un archivo sin cifrar: %{count}."
  th: "การเข้าสู่ระบบที่บันทึกไว้ %{count} รายการยังเก็บอยู่ในไฟล์ธรรมดา"
  zh: "仍有 %{count} 个保存的登录存储在明文文件中。"
