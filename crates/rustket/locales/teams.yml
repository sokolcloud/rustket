  en: "You are not allowed to delete some of these rooms."
  ru: "У вас нет прав на удаление некоторых из этих комнат."
  es: "No tienes permiso para eliminar algunas de estas salas."
  th: "คุณไม่ได้รับอนุญาตให้ลบห้องบางห้องเหล่านี้"
  zh: "你无权删除其中的部分聊天室。"
teams.err_unauthorized:
  en: "You do not have permission to do this."
  ru: "У вас нет прав на это действие."
  es: "No tienes permiso para hacer esto."
  th: "คุณไม่มีสิทธิ์ดำเนินการนี้"
  zh: "你无权执行此操作。"
