  en: "The room is not part of this team."
  ru: "Комната не входит в эту команду."
  es: "La sala no forma parte de este equipo."
  th: "ห้องนี้ไม่ได้อยู่ในทีมนี้"
  zh: "该聊天室不属于此团队。"
teams.err_not_member_private:
  en: "You are not a member of this private team."
  ru: "Вы не участник этой приватной команды."
  es: "No eres miembro de este equipo privado."
