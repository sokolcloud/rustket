  ru: "Чтобы перенести комнату, нужно быть её владельцем."
  es: "Debes ser propietario de la sala para moverla."
  th: "คุณต้องเป็นเจ้าของห้องจึงจะย้ายห้องได้"
  zh: "你必须是该聊天室的所有者才能移动它。"
