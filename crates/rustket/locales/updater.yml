  ru: "Нет прав на запись в %{path}."
  es: "No se puede escribir en %{path}."
  th: "เขียนไปยัง %{path} ไม่ได้"
  zh: "无法写入 %{path}。"
updater.error_translocated:
  en: "Rustket runs from the disk image or a temporary location. Move it to the Applications folder first."
  ru: "Rustket запущен с образа диска или из временного расположения. Сначала перенесите его в папку «Программы»."
  es: "Rustket se ejecuta desde la imagen de disco o una ubicación temporal. Muévelo primero a la carpeta Aplicaciones."
  th: "Rustket กำลังทำงานจากดิสก์อิมเมจหรือตำแหน่งชั่วคราว โปรดย้ายไปไว้ในโฟลเดอร์ Applications ก่อน"
  zh: "Rustket 正从磁盘映像或临时位置运行。请先将其移到“应用程序”文件夹。"
updater.error_unsupported:
  en: "This installation cannot be updated automatically."
  ru: "Эту установку нельзя обновить автоматически."
  es: "Esta instalación no se puede actualizar automáticamente."
  th: "การติดตั้งนี้อัปเดตอัตโนมัติไม่ได้"
  zh: "此安装无法自动更新。"
updater.error_cancelled:
  en: "The update was interrupted."
  ru: "Обновление прервано."
  es: "La actualización se interrumpió."
  th: "การอัปเดตถูกขัดจังหวะ"
  zh: "更新已中断。"
