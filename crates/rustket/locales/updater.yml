  ru: "Ошибка %{tool} (код выхода %{code})."
  es: "%{tool} falló (código de salida %{code})."
  th: "%{tool} ล้มเหลว (รหัสออก %{code})"
  zh: "%{tool} 失败（退出代码 %{code}）。"
updater.error_not_writable:
