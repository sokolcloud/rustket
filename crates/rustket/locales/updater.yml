  es: "Rustket %{version} está instalado"
  th: "ติดตั้ง Rustket %{version} แล้ว"
  zh: "Rustket %{version} 已安装"
updater.installed_body:
  en: "The update is installed, but Rustket could not restart itself. Restart it to use the new version."
  ru: "Обновление установлено, но Rustket не смог перезапуститься сам. Перезапустите его, чтобы начать работу в новой версии."
  es: "La actualización está instalada, pero Rustket no pudo reiniciarse solo. Reinícialo para usar la nueva versión."
  th: "ติดตั้งอัปเดตแล้ว แต่ Rustket รีสตาร์ตตัวเองไม่ได้ โปรดรีสตาร์ตเพื่อใช้เวอร์ชันใหม่"
  zh: "更新已安装，但 Rustket 无法自行重启。请手动重启以使用新版本。"
updater.open_package:
  en: "Open package"
  ru: "Открыть пакет"
  es: "Abrir paquete"
  th: "เปิดแพ็กเกจ"
  zh: "打开软件包"
updater.show_file:
  en: "Show file"
  ru: "Показать файл"
  es: "Mostrar archivo"
  th: "แสดงไฟล์"
  zh: "显示文件"
updater.auth_cancelled:
  en: "Update cancelled: authentication was not confirmed"
  ru: "Обновление отменено: подтверждение не получено"
  es: "Actualización cancelada: no se confirmó la autenticación"
  th: "ยกเลิกการอัปเดต: ไม่ได้ยืนยันตัวตน"
  zh: "更新已取消：身份验证未确认"
updater.error_network:
  en: "No connection to GitHub. Check your network and try again."
  ru: "Нет соединения с GitHub. Проверьте сеть и повторите попытку."
  es: "Sin conexión con GitHub. Comprueba tu red e inténtalo de nuevo."
  th: "เชื่อมต่อ GitHub ไม่ได้ ตรวจสอบเครือข่ายแล้วลองอีกครั้ง"
  zh: "无法连接到 GitHub。请检查网络后重试。"
updater.error_rate_limited:
  en: "GitHub limits how often updates can be checked. Try again later."
  ru: "GitHub ограничивает частоту проверок. Повторите попытку позже."
  es: "GitHub limita la frecuencia de búsqueda de actualizaciones. Inténtalo más tarde."
  th: "GitHub จำกัดความถี่ในการตรวจหาอัปเดต โปรดลองอีกครั้งภายหลัง"
  zh: "GitHub 限制了检查更新的频率。请稍后重试。"
updater.error_http:
  en: "GitHub answered with an error (HTTP %{code})."
  ru: "GitHub ответил ошибкой (HTTP %{code})."
  es: "GitHub respondió con un error (HTTP %{code})."
  th: "GitHub ตอบกลับด้วยข้อผิดพลาด (HTTP %{code})"
  zh: "GitHub 返回错误（HTTP %{code}）。"
updater.error_bad_release:
  en: "The release data is invalid."
  ru: "Данные выпуска некорректны."
  es: "Los datos de la versión no son válidos."
  th: "ข้อมูลรีลีสไม่ถูกต้อง"
  zh: "发布数据无效。"
updater.error_no_asset:
  en: "The release has no package for this system."
  ru: "В выпуске нет пакета для этой системы."
  es: "La versión no tiene un paquete para este sistema."
  th: "รีลีสนี้ไม่มีแพ็กเกจสำหรับระบบนี้"
  zh: "该版本没有适用于此系统的软件包。"
updater.error_no_checksum:
  en: "The release has no checksum for the package, so it cannot be verified."
  ru: "В выпуске нет контрольной суммы пакета, проверить его нельзя."
  es: "La versión no tiene suma de comprobación para el paquete, así que no se puede verificar."
  th: "รีลีสนี้ไม่มีเช็กซัมของแพ็กเกจ จึงตรวจสอบไม่ได้"
  zh: "该版本没有软件包的校验和，因此无法验证。"
updater.error_checksum:
  en: "The downloaded file is damaged: its checksum does not match."
  ru: "Загруженный файл повреждён: контрольная сумма не совпадает."
  es: "El archivo descargado está dañado: su suma de comprobación no coincide."
  th: "ไฟล์ที่ดาวน์โหลดเสียหาย: เช็กซัมไม่ตรงกัน"
  zh: "下载的文件已损坏：校验和不匹配。"
updater.error_size:
  en: "The download was incomplete."
  ru: "Файл загрузился не полностью."
  es: "La descarga quedó incompleta."
  th: "ดาวน์โหลดไม่ครบ"
  zh: "下载不完整。"
updater.error_disk:
  en: "Not enough disk space."
  ru: "Недостаточно места на диске."
  es: "No hay suficiente espacio en disco."
  th: "พื้นที่ดิสก์ไม่เพียงพอ"
  zh: "磁盘空间不足。"
updater.error_permission:
  en: "Permission denied."
  ru: "Недостаточно прав доступа."
  es: "Permiso denegado."
  th: "ไม่มีสิทธิ์เข้าถึง"
  zh: "权限被拒绝。"
updater.error_io:
  en: "A file operation failed."
  ru: "Ошибка при работе с файлами."
  es: "Falló una operación con archivos."
  th: "การดำเนินการกับไฟล์ล้มเหลว"
  zh: "文件操作失败。"
updater.error_auth_agent:
  en: "No authentication dialog is available to ask for the administrator password. Install the package yourself."
  ru: "Нет окна запроса пароля администратора. Установите пакет вручную."
  es: "No hay ningún diálogo de autenticación disponible para pedir la contraseña de administrador. Instala el paquete manualmente."
  th: "ไม่มีหน้าต่างยืนยันตัวตนสำหรับขอรหัสผ่านผู้ดูแลระบบ โปรดติดตั้งแพ็กเกจด้วยตนเอง"
  zh: "没有可用于请求管理员密码的身份验证对话框。请手动安装该软件包。"
updater.error_tool:
