_version: 2
updater.title:
  en: "Updates"
  ru: "Обновления"
  es: "Actualizaciones"
  th: "อัปเดต"
  zh: "更新"
updater.auto_check:
  en: "Check for updates automatically"
  ru: "Автоматически проверять обновления"
  es: "Buscar actualizaciones automáticamente"
  th: "ตรวจหาอัปเดตโดยอัตโนมัติ"
  zh: "自动检查更新"
updater.auto_check_help:
  en: "Looks for a new release on GitHub at startup and twice a day. Nothing is installed without your confirmation."
  ru: "Новые выпуски ищутся на GitHub при запуске и дважды в сутки. Без вашего подтверждения ничего не устанавливается."
  es: "Busca una nueva versión en GitHub al iniciar y dos veces al día. No se instala nada sin tu confirmación."
  th: "ตรวจหาเวอร์ชันใหม่บน GitHub ตอนเปิดโปรแกรมและวันละสองครั้ง จะไม่มีการติดตั้งใดๆ หากคุณไม่ยืนยัน"
  zh: "启动时及每天两次在 GitHub 上查找新版本。未经你确认不会安装任何内容。"
updater.prereleases:
  en: "Include pre-releases"
  ru: "Предлагать предварительные версии"
  es: "Incluir versiones preliminares"
  th: "รวมเวอร์ชันทดสอบ"
  zh: "包括预发布版本"
updater.prereleases_help:
  en: "Also offer test versions published before a release."
  ru: "Предлагать и тестовые версии, которые выходят до релиза."
  es: "Ofrecer también versiones de prueba publicadas antes de una versión estable."
  th: "เสนอเวอร์ชันทดสอบที่เผยแพร่ก่อนเวอร์ชันจริงด้วย"
  zh: "同时提供正式发布前的测试版本。"
updater.method:
  en: "Installation"
  ru: "Способ установки"
  es: "Instalación"
  th: "การติดตั้ง"
  zh: "安装方式"
updater.kind_detecting:
  en: "Detecting…"
  ru: "Определяется…"
  es: "Detectando…"
  th: "กำลังตรวจสอบ…"
  zh: "正在检测…"
updater.kind_deb:
  en: "Debian/Ubuntu package: updates are installed with apt (needs an administrator password)"
  ru: "Пакет Debian/Ubuntu: обновления устанавливаются через apt (нужен пароль администратора)"
  es: "Paquete Debian/Ubuntu: las actualizaciones se instalan con apt (requiere contraseña de administrador)"
  th: "แพ็กเกจ Debian/Ubuntu: ติดตั้งอัปเดตด้วย apt (ต้องใช้รหัสผ่านผู้ดูแลระบบ)"
  zh: "Debian/Ubuntu 软件包：通过 apt 安装更新（需要管理员密码）"
updater.kind_rpm:
  en: "RPM package: updates are installed with dnf, zypper or rpm (needs an administrator password)"
  ru: "Пакет RPM: обновления устанавливаются через dnf, zypper или rpm (нужен пароль администратора)"
  es: "Paquete RPM: las actualizaciones se instalan con dnf, zypper o rpm (requiere contraseña de administrador)"
  th: "แพ็กเกจ RPM: ติดตั้งอัปเดตด้วย dnf, zypper หรือ rpm (ต้องใช้รหัสผ่านผู้ดูแลระบบ)"
  zh: "RPM 软件包：通过 dnf、zypper 或 rpm 安装更新（需要管理员密码）"
updater.kind_appimage:
  en: "AppImage: the file is replaced with the new version"
  ru: "AppImage: файл заменяется новой версией"
  es: "AppImage: el archivo se reemplaza por la nueva versión"
  th: "AppImage: ไฟล์จะถูกแทนที่ด้วยเวอร์ชันใหม่"
  zh: "AppImage：用新版本替换该文件"
updater.kind_inno_user:
  en: "Windows installer, for this user"
  ru: "Установщик Windows, для текущего пользователя"
  es: "Instalador de Windows, para este usuario"
  th: "ตัวติดตั้ง Windows สำหรับผู้ใช้นี้"
  zh: "Windows 安装程序，仅当前用户"
updater.kind_inno_all:
  en: "Windows installer, for all users (needs administrator rights)"
  ru: "Установщик Windows, для всех пользователей (нужны права администратора)"
  es: "Instalador de Windows, para todos los usuarios (requiere permisos de administrador)"
  th: "ตัวติดตั้ง Windows สำหรับผู้ใช้ทุกคน (ต้องใช้สิทธิ์ผู้ดูแลระบบ)"
  zh: "Windows 安装程序，所有用户（需要管理员权限）"
updater.kind_zip:
  en: "Portable Windows version: the files in its folder are replaced"
  ru: "Портативная версия для Windows: файлы в её папке заменяются"
  es: "Versión portable de Windows: se reemplazan los archivos de su carpeta"
  th: "Windows แบบพกพา: ไฟล์ในโฟลเดอร์จะถูกแทนที่"
  zh: "Windows 便携版：替换其文件夹中的文件"
updater.kind_mac:
  en: "macOS app: the app bundle is replaced"
  ru: "Приложение macOS: пакет приложения заменяется"
  es: "Aplicación de macOS: se reemplaza el paquete de la aplicación"
  th: "แอป macOS: บันเดิลแอปจะถูกแทนที่"
  zh: "macOS 应用：替换应用程序包"
updater.kind_unmanaged:
  en: "Not installed from a Rustket package: new versions are only announced, download them from the release page"
  ru: "Установлено не из пакета Rustket: о новых версиях только сообщается, скачать их можно на странице выпуска"
  es: "No instalado desde un paquete de Rustket: solo se avisa de nuevas versiones, descárgalas desde la página de la versión"
  th: "ไม่ได้ติดตั้งจากแพ็กเกจ Rustket: จะแจ้งเฉพาะเมื่อมีเวอร์ชันใหม่ ดาวน์โหลดได้จากหน้ารีลีส"
  zh: "不是通过 Rustket 软件包安装：仅提示新版本，请从发布页面下载"
updater.check_now:
  en: "Check now"
