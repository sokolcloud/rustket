  zh: "打开设置"
videoconf.embedded_hint_title:
  en: "The call opens in your browser"
  ru: "Звонок открывается в браузере"
  es: "La llamada se abre en tu navegador"
  th: "การโทรจะเปิดในเบราว์เซอร์"
  zh: "通话将在浏览器中打开"
videoconf.embedded_hint_body:
  en: "Sign in to this workspace in the browser if it asks you to."
  ru: "Если браузер попросит, войдите в это рабочее пространство."
  es: "Inicia sesión en este espacio de trabajo en el navegador si te lo pide."
  th: "หากเบราว์เซอร์ขอ โปรดลงชื่อเข้าใช้เวิร์กสเปซนี้"
  zh: "如果浏览器提示，请登录此工作区。"
