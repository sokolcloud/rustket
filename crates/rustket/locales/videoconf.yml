_version: 2
videoconf.call:
  en: "Video call"
  ru: "Видеозвонок"
  es: "Videollamada"
  th: "วิดีโอคอล"
  zh: "视频通话"
videoconf.call_unavailable:
  en: "Video call unavailable for this type of room"
  ru: "Видеозвонок недоступен для этого типа комнаты"
  es: "Videollamada no disponible para este tipo de sala"
  th: "ห้องประเภทนี้ใช้วิดีโอคอลไม่ได้"
  zh: "此类型的聊天室不支持视频通话"
videoconf.no_provider_title:
  en: "Conference call not available"
  ru: "Конференц-связь недоступна"
  es: "Llamada de conferencia no disponible"
  th: "การประชุมทางวิดีโอไม่พร้อมใช้งาน"
  zh: "视频会议不可用"
videoconf.no_provider_body:
  en: "Conference call apps can be installed in the Rocket.Chat marketplace by a workspace admin."
  ru: "Администратор рабочего пространства может установить приложения для конференц-связи из маркетплейса Rocket.Chat."
  es: "Un administrador del espacio de trabajo puede instalar aplicaciones de llamadas de conferencia desde el Marketplace de Rocket.Chat."
  th: "ผู้ดูแลเวิร์กสเปซสามารถติดตั้งแอปการประชุมทางวิดีโอได้จาก Rocket.Chat Marketplace"
  zh: "工作区管理员可以从 Rocket.Chat 应用市场安装视频会议应用。"
videoconf.admin_no_provider_title:
  en: "Conference call not enabled"
  ru: "Конференц-связь не включена"
  es: "Llamada de conferencia no habilitada"
  th: "ยังไม่ได้เปิดใช้การประชุมทางวิดีโอ"
  zh: "视频会议未启用"
videoconf.admin_no_provider_body:
  en: "Conference call apps are available in the Rocket.Chat marketplace."
  ru: "Приложения для конференц-связи доступны в маркетплейсе Rocket.Chat."
  es: "Las aplicaciones de llamadas de conferencia están disponibles en el Marketplace de Rocket.Chat."
  th: "แอปการประชุมทางวิดีโอมีให้ใช้ใน Rocket.Chat Marketplace"
  zh: "视频会议应用可在 Rocket.Chat 应用市场中获取。"
videoconf.not_configured_title:
  en: "Conference call not enabled"
  ru: "Конференц-связь не включена"
  es: "Llamada de conferencia no habilitada"
  th: "ยังไม่ได้เปิดใช้การประชุมทางวิดีโอ"
  zh: "视频会议未启用"
videoconf.not_configured_body:
  en: "A workspace admin needs to enable the conference call feature first."
  ru: "Сначала администратор рабочего пространства должен включить конференц-связь."
  es: "Primero un administrador del espacio de trabajo debe habilitar la función de llamadas de conferencia."
  th: "ผู้ดูแลเวิร์กสเปซต้องเปิดใช้ฟีเจอร์การประชุมทางวิดีโอก่อน"
  zh: "需要工作区管理员先启用视频会议功能。"
videoconf.admin_not_configured_title:
  en: "Conference call not enabled"
  ru: "Конференц-связь не включена"
  es: "Llamada de conferencia no habilitada"
  th: "ยังไม่ได้เปิดใช้การประชุมทางวิดีโอ"
  zh: "视频会议未启用"
videoconf.admin_not_configured_body:
  en: "Configure conference calls in order to make it available on this workspace."
  ru: "Настройте конференц-связь, чтобы она стала доступна в этом рабочем пространстве."
  es: "Configura las llamadas de conferencia para que estén disponibles en este espacio de trabajo."
  th: "ตั้งค่าการประชุมทางวิดีโอเพื่อให้ใช้งานได้ในเวิร์กสเปซนี้"
  zh: "请配置视频会议，以便在此工作区中使用。"
videoconf.open_settings:
  en: "Open settings"
