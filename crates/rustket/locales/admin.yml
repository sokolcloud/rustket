admin.mailer.confirm_all:
  en: "Dry run is off: every user will receive this e-mail. This cannot be undone."
  ru: "Тестовый режим выключен: письмо получат все пользователи. Это нельзя отменить."
  es: "La prueba está desactivada: todos los usuarios recibirán este correo. Esta acción no se puede deshacer."
  th: "ปิดการทดลองส่งอยู่: ผู้ใช้ทุกคนจะได้รับอีเมลนี้ การดำเนินการนี้ย้อนกลับไม่ได้"
  zh: "试运行已关闭：所有用户都将收到此邮件。此操作无法撤销。"
admin.mailer.confirm_query:
  en: "Dry run is off: every user matching the query will receive this e-mail. This cannot be undone."
  ru: "Тестовый режим выключен: письмо получат все пользователи, подходящие под запрос. Это нельзя отменить."
  es: "La prueba está desactivada: todos los usuarios que coincidan con la consulta recibirán este correo. Esta acción no se puede deshacer."
  th: "ปิดการทดลองส่งอยู่: ผู้ใช้ทุกคนที่ตรงกับคิวรีจะได้รับอีเมลนี้ การดำเนินการนี้ย้อนกลับไม่ได้"
  zh: "试运行已关闭：所有符合查询条件的用户都将收到此邮件。此操作无法撤销。"
