  zh: "来自浏览器的链接"
login.paste_help:
  en: "If nothing happens, copy the rocketchat://auth… link from the browser and paste it here."
  ru: "Если ничего не происходит, скопируйте ссылку rocketchat://auth… из браузера и вставьте её сюда."
  es: "Si no pasa nada, copia el enlace rocketchat://auth… del navegador y pégalo aquí."
  th: "หากไม่มีอะไรเกิดขึ้น ให้คัดลอกลิงก์ rocketchat://auth… จากเบราว์เซอร์แล้ววางที่นี่"
  zh: "如果没有反应，请从浏览器复制 rocketchat://auth… 链接并粘贴到此处。"
login.paste_submit:
  en: "Continue"
  ru: "Продолжить"
  es: "Continuar"
  th: "ดำเนินการต่อ"
  zh: "继续"
login.paste_invalid:
