login.pending_title:
  en: "Continue in your browser (%{service})"
  ru: "Продолжите в браузере (%{service})"
  es: "Continúa en tu navegador (%{service})"
  th: "ดำเนินการต่อในเบราว์เซอร์ (%{service})"
  zh: "请在浏览器中继续（%{service}）"
login.pending_help:
  en: "Finish signing in in the browser window. Rustket continues automatically when the browser opens the rocketchat:// link."
  ru: "Завершите вход в окне браузера. Rustket продолжит автоматически, когда браузер откроет ссылку rocketchat://."
  es: "Termina de iniciar sesión en la ventana del navegador. Rustket continuará automáticamente cuando el navegador abra el enlace rocketchat://."
  th: "ลงชื่อเข้าใช้ให้เสร็จในหน้าต่างเบราว์เซอร์ Rustket จะดำเนินการต่อโดยอัตโนมัติเมื่อเบราว์เซอร์เปิดลิงก์ rocketchat://"
  zh: "请在浏览器窗口中完成登录。浏览器打开 rocketchat:// 链接后，Rustket 会自动继续。"
login.pending_polling:
  en: "Finish signing in in the browser window. Rustket is waiting for the server (up to 5 minutes)."
  ru: "Завершите вход в окне браузера. Rustket ждёт ответа сервера (до 5 минут)."
  es: "Termina de iniciar sesión en la ventana del navegador. Rustket está esperando al servidor (hasta 5 minutos)."
  th: "ลงชื่อเข้าใช้ให้เสร็จในหน้าต่างเบราว์เซอร์ Rustket กำลังรอเซิร์ฟเวอร์ (สูงสุด 5 นาที)"
  zh: "请在浏览器窗口中完成登录。Rustket 正在等待服务器响应（最多 5 分钟）。"
login.open_again:
  en: "Open browser again"
  ru: "Открыть браузер снова"
  es: "Volver a abrir el navegador"
  th: "เปิดเบราว์เซอร์อีกครั้ง"
  zh: "再次打开浏览器"
login.cancel:
  en: "Cancel"
  ru: "Отмена"
  es: "Cancelar"
  th: "ยกเลิก"
  zh: "取消"
login.paste_label:
  en: "Link from the browser"
  ru: "Ссылка из браузера"
  es: "Enlace del navegador"
