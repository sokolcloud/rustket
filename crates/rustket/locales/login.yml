  ru: "Это не ссылка rocketchat://."
  es: "No es un enlace rocketchat://."
  th: "นี่ไม่ใช่ลิงก์ rocketchat://"
  zh: "这不是 rocketchat:// 链接。"
login.handler_hint:
  en: "Rustket is not registered for rocketchat:// links."
  ru: "Rustket не зарегистрирован для ссылок rocketchat://."
  es: "Rustket no está registrado para los enlaces rocketchat://."
  th: "Rustket ยังไม่ได้ลงทะเบียนสำหรับลิงก์ rocketchat://"
  zh: "Rustket 尚未注册为 rocketchat:// 链接的处理程序。"
login.register_handler:
  en: "Register"
  ru: "Зарегистрировать"
  es: "Registrar"
  th: "ลงทะเบียน"
  zh: "注册"
login.service_unavailable:
  en: "This login service is not configured."
  ru: "Этот способ входа не настроен."
  es: "Este servicio de inicio de sesión no está configurado."
  th: "ยังไม่ได้ตั้งค่าบริการเข้าสู่ระบบนี้"
  zh: "此登录服务未配置。"
login.tfa_title:
  en: "Two-factor authentication"
  ru: "Двухфакторная аутентификация"
  es: "Autenticación de dos factores"
  th: "การยืนยันตัวตนแบบสองขั้นตอน"
  zh: "两步验证"
login.tfa_totp_help:
  en: "Enter the code from your authenticator app."
  ru: "Введите код из приложения-аутентификатора."
  es: "Introduce el código de tu aplicación de autenticación."
  th: "ป้อนรหัสจากแอปยืนยันตัวตนของคุณ"
  zh: "请输入身份验证器应用中的验证码。"
login.tfa_email_help:
  en: "We sent a code to the e-mail address of %{who}."
  ru: "Мы отправили код на e-mail пользователя %{who}."
  es: "Enviamos un código a la dirección de correo electrónico de %{who}."
  th: "เราส่งรหัสไปยังอีเมลของ %{who} แล้ว"
  zh: "我们已向 %{who} 的电子邮件地址发送了验证码。"
login.tfa_password_help:
  en: "Confirm with your password."
  ru: "Подтвердите паролем."
  es: "Confirma con tu contraseña."
  th: "ยืนยันด้วยรหัสผ่านของคุณ"
  zh: "请输入密码确认。"
login.tfa_code:
  en: "Code"
  ru: "Код"
  es: "Código"
  th: "รหัส"
  zh: "验证码"
login.tfa_resend:
  en: "Send code again"
  ru: "Отправить код ещё раз"
  es: "Enviar el código de nuevo"
  th: "ส่งรหัสอีกครั้ง"
  zh: "重新发送验证码"
login.tfa_resent:
  en: "Code sent"
  ru: "Код отправлен"
  es: "Código enviado"
  th: "ส่งรหัสแล้ว"
  zh: "验证码已发送"
login.tfa_verify:
  en: "Verify"
  ru: "Подтвердить"
  es: "Verificar"
  th: "ยืนยัน"
  zh: "验证"
login.link_error:
  en: "The browser reported a sign-in error: %{error}"
  ru: "Браузер сообщил об ошибке входа: %{error}"
  es: "El navegador informó de un error de inicio de sesión: %{error}"
  th: "เบราว์เซอร์แจ้งข้อผิดพลาดในการลงชื่อเข้าใช้: %{error}"
  zh: "浏览器报告登录错误：%{error}"
login.saml_browser_hint:
  en: "Signed in, but the browser stayed on the site? This server does not pass SAML sign-ins to apps: continue with the browser session instead."
  ru: "Вход выполнен, но браузер остался на сайте? Этот сервер не передаёт SAML-вход приложениям: продолжите с сеансом браузера."
  es: "¿Iniciaste sesión, pero el navegador se quedó en el sitio? Este servidor no pasa los inicios de sesión SAML a las aplicaciones: continúa con la sesión del navegador."
  th: "ลงชื่อเข้าใช้แล้ว แต่เบราว์เซอร์ยังอยู่ที่เว็บไซต์ใช่ไหม เซิร์ฟเวอร์นี้ไม่ส่งต่อการลงชื่อเข้าใช้ SAML ไปยังแอป: ให้ดำเนินการต่อด้วยเซสชันของเบราว์เซอร์แทน"
  zh: "已登录，但浏览器仍停留在网站上？此服务器不会将 SAML 登录传递给应用，请改用浏览器会话继续。"
login.saml_browser_continue:
  en: "Continue from browser"
  ru: "Продолжить из браузера"
  es: "Continuar desde el navegador"
  th: "ดำเนินการต่อจากเบราว์เซอร์"
  zh: "从浏览器继续"
