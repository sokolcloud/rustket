_version: 2
errors.login_blocked:
  en: "Too many failed attempts. Try again later."
  ru: "Слишком много неудачных попыток. Попробуйте позже."
  es: "Demasiados intentos fallidos. Inténtalo de nuevo más tarde."
  th: "พยายามเข้าสู่ระบบไม่สำเร็จหลายครั้งเกินไป โปรดลองอีกครั้งภายหลัง"
  zh: "失败次数过多，请稍后再试。"
errors.unauthorized:
  en: "Wrong username or password."
  ru: "Неверное имя пользователя или пароль."
  es: "Nombre de usuario o contraseña incorrectos."
  th: "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
  zh: "用户名或密码错误。"
errors.two_factor_invalid:
  en: "Invalid code."
  ru: "Неверный код."
  es: "Código no válido."
  th: "รหัสไม่ถูกต้อง"
  zh: "验证码无效。"
errors.two_factor_required:
  en: "A two-factor code is required."
  ru: "Требуется код двухфакторной аутентификации."
  es: "Se requiere un código de autenticación de dos factores."
  th: "ต้องใช้รหัสยืนยันสองขั้นตอน"
  zh: "需要两步验证码。"
errors.certificate:
  en: "The certificate of %{host} is not trusted."
  ru: "Сертификат %{host} не является доверенным."
  es: "El certificado de %{host} no es de confianza."
  th: "ใบรับรองของ %{host} ไม่น่าเชื่อถือ"
  zh: "%{host} 的证书不受信任。"
errors.tls:
  en: "Secure connection failed: %{reason}"
  ru: "Ошибка защищённого соединения: %{reason}"
  es: "Error de conexión segura: %{reason}"
  th: "การเชื่อมต่อที่ปลอดภัยล้มเหลว: %{reason}"
  zh: "安全连接失败：%{reason}"
errors.timeout:
  en: "The server did not answer in time."
  ru: "Сервер не ответил вовремя."
  es: "El servidor no respondió a tiempo."
  th: "เซิร์ฟเวอร์ไม่ตอบสนองภายในเวลาที่กำหนด"
  zh: "服务器未及时响应。"
errors.rate_limited:
  en: "Too many requests. Wait a moment."
  ru: "Слишком много запросов. Подождите немного."
  es: "Demasiadas solicitudes. Espera un momento."
  th: "มีคำขอมากเกินไป โปรดรอสักครู่"
  zh: "请求过多，请稍候。"
errors.bad_url:
  en: "Invalid address: %{reason}"
  ru: "Неверный адрес: %{reason}"
  es: "Dirección no válida: %{reason}"
  th: "ที่อยู่ไม่ถูกต้อง: %{reason}"
  zh: "地址无效：%{reason}"
errors.network:
  en: "The server is unreachable."
  ru: "Сервер недоступен."
  es: "No se puede acceder al servidor."
  th: "ติดต่อเซิร์ฟเวอร์ไม่ได้"
  zh: "无法访问服务器。"
errors.not_rocketchat:
  en: "This does not look like a Rocket.Chat server."
  ru: "Это не похоже на сервер Rocket.Chat."
  es: "Esto no parece un servidor de Rocket.Chat."
  th: "ดูเหมือนว่านี่ไม่ใช่เซิร์ฟเวอร์ Rocket.Chat"
  zh: "这似乎不是 Rocket.Chat 服务器。"
