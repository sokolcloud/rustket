search.operators_help:
  en: "You can also type filters: from:user, mention:user, in:#room, has:link, has:star, is:pinned, has:location, after:DD/MM/YYYY, before:DD/MM/YYYY, on:DD/MM/YYYY, label:, file-title:, file-desc:. After and before do not include the day itself. /regex/i searches with a regular expression."
  ru: "Фильтры можно писать и вручную: from:user, mention:user, in:#room, has:link, has:star, is:pinned, has:location, after:ДД/ММ/ГГГГ, before:ДД/ММ/ГГГГ, on:ДД/ММ/ГГГГ, label:, file-title:, file-desc:. «После» и «до» не включают сам день. /regex/i — поиск по регулярному выражению."
  es: "También puedes escribir filtros: from:user, mention:user, in:#room, has:link, has:star, is:pinned, has:location, after:DD/MM/AAAA, before:DD/MM/AAAA, on:DD/MM/AAAA, label:, file-title:, file-desc:. Después y antes no incluyen el propio día. /regex/i busca con una expresión regular."
  th: "พิมพ์ตัวกรองเองได้ด้วย: from:user, mention:user, in:#room, has:link, has:star, is:pinned, has:location, after:DD/MM/YYYY, before:DD/MM/YYYY, on:DD/MM/YYYY, label:, file-title:, file-desc: โดยหลังจากและก่อนไม่รวมวันนั้น /regex/i ค้นหาด้วยนิพจน์ปกติ"
  zh: "也可以直接输入筛选条件：from:user、mention:user、in:#room、has:link、has:star、is:pinned、has:location、after:DD/MM/YYYY、before:DD/MM/YYYY、on:DD/MM/YYYY、label:、file-title:、file-desc:。之后和之前不包含当天。/regex/i 使用正则表达式搜索。"
