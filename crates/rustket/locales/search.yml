search.encrypted_help:
  en: "The server cannot search end-to-end encrypted messages. Only messages of these rooms already decrypted in this session are searched."
  ru: "Сервер не может искать в сквозном шифровании. Ищутся только сообщения этих комнат, уже расшифрованные в этом сеансе."
  es: "El servidor no puede buscar en mensajes cifrados de extremo a extremo. Solo se buscan los mensajes de estas salas ya descifrados en esta sesión."
  th: "เซิร์ฟเวอร์ค้นหาข้อความที่เข้ารหัสแบบต้นทางถึงปลายทางไม่ได้ จะค้นหาเฉพาะข้อความของห้องเหล่านี้ที่ถอดรหัสแล้วในเซสชันนี้"
  zh: "服务器无法搜索端到端加密的消息。仅搜索本次会话中已解密的这些聊天室消息。"
