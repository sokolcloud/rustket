quiet.set_busy:
  en: "Set my status to Busy while paused"
  ru: "Ставить статус «Занят» на время паузы"
  es: "Poner mi estado en Ocupado durante la pausa"
  th: "ตั้งสถานะเป็นไม่ว่างระหว่างหยุดชั่วคราว"
  zh: "暂停期间将我的状态设为忙碌"
quiet.set_busy_help:
  en: "The server then sends no push notifications to your phone either. Afterwards the previous status comes back, unless you changed it meanwhile."
  ru: "Тогда сервер не присылает и push-уведомления на телефон. После паузы вернётся прежний статус, если вы не поменяли его за это время."
  es: "Así el servidor tampoco envía notificaciones push al teléfono. Después vuelve el estado anterior, salvo que lo hayas cambiado mientras tanto."
  th: "เซิร์ฟเวอร์จะไม่ส่งการแจ้งเตือนแบบพุชไปยังโทรศัพท์ด้วย หลังจากนั้นสถานะเดิมจะกลับมา เว้นแต่คุณเปลี่ยนสถานะระหว่างนั้น"
  zh: "这样服务器也不会向手机推送通知。暂停结束后恢复之前的状态，除非你在此期间改过状态。"
quiet.settings_title:
  en: "Pause and working hours"
  ru: "Пауза и рабочие часы"
  es: "Pausa y horario laboral"
  th: "หยุดชั่วคราวและเวลาทำงาน"
  zh: "暂停与工作时间"
quiet.working_hours:
  en: "Pause notifications outside working hours"
  ru: "Приостанавливать уведомления вне рабочих часов"
  es: "Pausar las notificaciones fuera del horario laboral"
  th: "หยุดการแจ้งเตือนนอกเวลาทำงาน"
  zh: "在工作时间之外暂停通知"
quiet.working_hours_help:
  en: "Times are local. An end before the start ends on the next day. Resuming by hand lasts until the next start or end of working hours."
  ru: "Время местное. Если конец раньше начала, он приходится на следующий день. Возобновление вручную действует до ближайшего начала или конца рабочих часов."
  es: "Las horas son locales. Un final anterior al inicio termina al día siguiente. Reanudar a mano dura hasta el próximo inicio o fin del horario."
  th: "เวลาเป็นเวลาท้องถิ่น ถ้าเวลาสิ้นสุดก่อนเวลาเริ่ม จะสิ้นสุดในวันถัดไป การเปิดต่อเองมีผลจนถึงการเริ่มหรือสิ้นสุดเวลาทำงานครั้งถัดไป"
  zh: "时间为本地时间。结束早于开始表示在次日结束。手动恢复的效果持续到下一次工作时间开始或结束。"
