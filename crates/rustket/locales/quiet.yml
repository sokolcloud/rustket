_version: 2
quiet.pause:
  en: "Pause notifications"
  ru: "Приостановить уведомления"
  es: "Pausar notificaciones"
  th: "หยุดการแจ้งเตือนชั่วคราว"
  zh: "暂停通知"
quiet.pause_title:
  en: "Pause notifications until…"
  ru: "Приостановить уведомления до…"
  es: "Pausar notificaciones hasta…"
  th: "หยุดการแจ้งเตือนจนถึง…"
  zh: "暂停通知直到…"
quiet.custom_body:
  en: "Desktop notifications and sounds stay off until then; unread counters still update."
  ru: "До этого времени не будет уведомлений и звуков; счётчики непрочитанного обновляются как обычно."
  es: "Hasta entonces no habrá notificaciones ni sonidos; los contadores de no leídos siguen actualizándose."
  th: "จะไม่มีการแจ้งเตือนและเสียงจนถึงเวลานั้น ตัวนับข้อความที่ยังไม่อ่านยังอัปเดตตามปกติ"
  zh: "在此之前不显示桌面通知、不播放声音；未读计数照常更新。"
quiet.resume:
  en: "Resume notifications"
  ru: "Возобновить уведомления"
  es: "Reanudar notificaciones"
  th: "เปิดการแจ้งเตือนต่อ"
  zh: "恢复通知"
quiet.paused:
  en: "Notifications paused"
  ru: "Уведомления приостановлены"
  es: "Notificaciones en pausa"
  th: "หยุดการแจ้งเตือนชั่วคราวอยู่"
  zh: "通知已暂停"
