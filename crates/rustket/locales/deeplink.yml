_version: 2
deeplink.token_rejected:
  en: "The sign-in link is not valid"
  ru: "Ссылка для входа недействительна"
  es: "El enlace de inicio de sesión no es válido"
  th: "ลิงก์ลงชื่อเข้าใช้ไม่ถูกต้อง"
  zh: "登录链接无效"
deeplink.auth_error:
  en: "Sign-in failed: %{error}"
  ru: "Вход не удался: %{error}"
  es: "Error al iniciar sesión: %{error}"
  th: "ลงชื่อเข้าใช้ไม่สำเร็จ: %{error}"
  zh: "登录失败：%{error}"
deeplink.room_not_found:
  en: "Room not found"
  ru: "Комната не найдена"
  es: "Sala no encontrada"
  th: "ไม่พบห้อง"
  zh: "未找到聊天室"
deeplink.confirm_title:
  en: "Confirm sign-in"
  ru: "Подтвердите вход"
  es: "Confirmar inicio de sesión"
  th: "ยืนยันการลงชื่อเข้าใช้"
  zh: "确认登录"
deeplink.confirm_warning:
  en: "Only continue if you just signed in in your browser."
  ru: "Продолжайте, только если вы только что вошли в браузере."
  es: "Continúa solo si acabas de iniciar sesión en tu navegador."
  th: "ดำเนินการต่อเฉพาะเมื่อคุณเพิ่งลงชื่อเข้าใช้ในเบราว์เซอร์เท่านั้น"
  zh: "仅当你刚刚在浏览器中登录时才继续。"
deeplink.confirm_sign_in:
  en: "Sign in"
  ru: "Войти"
  es: "Iniciar sesión"
  th: "ลงชื่อเข้าใช้"
  zh: "登录"
deeplink.add_server_title:
  en: "Add workspace?"
  ru: "Добавить рабочее пространство?"
  es: "¿Añadir espacio de trabajo?"
  th: "เพิ่มเวิร์กสเปซหรือไม่"
  zh: "添加工作区？"
deeplink.add_server_body:
  en: "A link points to %{server}, which is not added yet. Add it?"
  ru: "Ссылка ведёт на %{server}, которого ещё нет в списке. Добавить?"
  es: "Un enlace apunta a %{server}, que aún no está añadido. ¿Añadirlo?"
  th: "ลิงก์ชี้ไปที่ %{server} ซึ่งยังไม่ได้เพิ่มไว้ ต้องการเพิ่มหรือไม่"
  zh: "链接指向尚未添加的 %{server}。要添加吗？"
deeplink.add_server_confirm:
  en: "Add"
  ru: "Добавить"
  es: "Añadir"
  th: "เพิ่ม"
  zh: "添加"
deeplink.room_link_timeout:
  en: "The linked room could not be opened: the workspace did not load in time"
  ru: "Не удалось открыть комнату по ссылке: рабочее пространство не загрузилось вовремя"
  es: "No se pudo abrir la sala enlazada: el espacio de trabajo no se cargó a tiempo"
  th: "เปิดห้องจากลิงก์ไม่ได้: เวิร์กสเปซโหลดไม่ทันเวลา"
  zh: "无法打开链接的聊天室：工作区未能及时加载"
deeplink.duplicate_token:
  en: "More than one sign-in link arrived for this login. Start the browser sign-in again."
  ru: "Для этого входа пришло несколько ссылок. Начните вход через браузер заново."
  es: "Llegó más de un enlace de inicio de sesión para este acceso. Vuelve a iniciar sesión con el navegador."
  th: "ได้รับลิงก์ลงชื่อเข้าใช้มากกว่าหนึ่งลิงก์สำหรับการเข้าสู่ระบบนี้ โปรดเริ่มลงชื่อเข้าใช้ผ่านเบราว์เซอร์อีกครั้ง"
  zh: "此次登录收到了多个登录链接。请重新通过浏览器登录。"
deeplink.other_origin_title:
  en: "Link to a different address"
  ru: "Ссылка на другой адрес"
  es: "Enlace a otra dirección"
  th: "ลิงก์ไปยังที่อยู่อื่น"
  zh: "链接指向其他地址"
deeplink.other_origin_body:
  en: "The link points to %{link}, but this workspace is configured as %{server}. The link was ignored."
  ru: "Ссылка ведёт на %{link}, а рабочее пространство настроено как %{server}. Ссылка проигнорирована."
  es: "El enlace apunta a %{link}, pero este espacio de trabajo está configurado como %{server}. Se ignoró el enlace."
  th: "ลิงก์ชี้ไปที่ %{link} แต่เวิร์กสเปซนี้ตั้งค่าเป็น %{server} จึงไม่สนใจลิงก์นี้"
  zh: "链接指向 %{link}，但此工作区配置为 %{server}。已忽略该链接。"
deeplink.confirm_question:
  en: "Sign in to this account?"
  ru: "Войти в этот аккаунт?"
  es: "¿Iniciar sesión en esta cuenta?"
  th: "ลงชื่อเข้าใช้บัญชีนี้หรือไม่"
  zh: "登录此账户？"
deeplink.confirm_display_name:
  en: "Display name: %{name}"
  ru: "Отображаемое имя: %{name}"
  es: "Nombre para mostrar: %{name}"
  th: "ชื่อที่แสดง: %{name}"
  zh: "显示名称：%{name}"
deeplink.confirm_server:
  en: "Server"
  ru: "Сервер"
  es: "Servidor"
  th: "เซิร์ฟเวอร์"
  zh: "服务器"
