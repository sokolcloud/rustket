poll.add_reactions:
  en: "Add the option reactions, so people can vote with one click in any app"
  ru: "Добавить реакции вариантов, чтобы голосовать в один клик в любом приложении"
  es: "Añadir las reacciones de las opciones para votar con un clic en cualquier aplicación"
  th: "เพิ่มรีแอคชันของตัวเลือก เพื่อให้โหวตได้ในคลิกเดียวจากทุกแอป"
  zh: "添加选项表情回应，任何客户端都能一键投票"
poll.convention_hint:
  en: "Votes are reactions. Other apps show the poll as text with reactions."
  ru: "Голоса — это реакции. Другие приложения покажут опрос как текст с реакциями."
  es: "Los votos son reacciones. Otras aplicaciones muestran la encuesta como texto con reacciones."
  th: "การโหวตคือรีแอคชัน แอปอื่นจะแสดงโพลเป็นข้อความพร้อมรีแอคชัน"
  zh: "投票即表情回应。其他客户端会将投票显示为带表情回应的文字。"
