titlebar.setting_help:
  en: "Off: workspaces, settings and window buttons share one row at the top instead of the left column."
  ru: "Если выключено, рабочие пространства, настройки и кнопки окна располагаются в одной строке сверху, а не в левой колонке."
  es: "Desactivado: los espacios de trabajo, la configuración y los botones de la ventana comparten una fila en la parte superior en lugar de la columna izquierda."
  th: "ปิด: เวิร์กสเปซ การตั้งค่า และปุ่มหน้าต่างจะอยู่ในแถวเดียวกันด้านบนแทนคอลัมน์ด้านซ้าย"
  zh: "关闭时：工作区、设置和窗口按钮共用顶部一行，而不是左侧栏。"
