inbox.mark_all_read_tip:
  en: "Marks every listed room as read. Unread threads stay in Activity."
  ru: "Отмечает прочитанными все комнаты списка. Непрочитанные треды остаются в «Активности»."
  es: "Marca como leídas todas las salas de la lista. Los hilos no leídos siguen en Actividad."
  th: "ทำเครื่องหมายทุกห้องในรายการว่าอ่านแล้ว เธรดที่ยังไม่ได้อ่านยังคงอยู่ในกิจกรรม"
  zh: "将列表中的所有聊天室标记为已读。未读讨论串仍保留在“动态”中。"
