scheduled.delete_title:
  en: "Delete this scheduled message?"
  ru: "Удалить отложенное сообщение?"
  es: "¿Eliminar este mensaje programado?"
  th: "ลบข้อความที่ตั้งเวลานี้หรือไม่"
  zh: "删除这条定时消息？"
scheduled.missed_title:
  en: "Scheduled messages not sent on time"
  ru: "Отложенные сообщения не отправлены вовремя"
  es: "Mensajes programados no enviados a tiempo"
  th: "ข้อความที่ตั้งเวลาไม่ได้ส่งตรงเวลา"
  zh: "定时消息未按时发送"
scheduled.missed_body:
  en: "These were not sent when due: Rustket was not running or not connected, or the server did not accept them. Send them now, pick a new time or delete them."
  ru: "Эти сообщения не отправлены вовремя: Rustket не был запущен или не был подключён, либо сервер их не принял. Отправьте их сейчас, выберите новое время или удалите."
  es: "No se enviaron a su hora: Rustket no estaba en marcha o no tenía conexión, o el servidor no los aceptó. Envíalos ahora, elige otra hora o elimínalos."
  th: "ข้อความเหล่านี้ไม่ได้ส่งตามเวลา เพราะ Rustket ไม่ได้ทำงานหรือไม่ได้เชื่อมต่อ หรือเซิร์ฟเวอร์ไม่ยอมรับ ส่งตอนนี้ เลือกเวลาใหม่ หรือลบทิ้ง"
  zh: "这些消息未按时发送：Rustket 未运行或未连接，或服务器未接受。可以立即发送、重新选择时间或删除。"
scheduled.decide_later:
  en: "Decide later"
  ru: "Решить позже"
  es: "Decidir más tarde"
  th: "ตัดสินใจภายหลัง"
  zh: "稍后决定"
scheduled.send_all:
  en: "Send all"
  ru: "Отправить все"
  es: "Enviar todos"
  th: "ส่งทั้งหมด"
  zh: "全部发送"
scheduled.delete_all:
  en: "Delete all"
  ru: "Удалить все"
  es: "Eliminar todos"
  th: "ลบทั้งหมด"
  zh: "全部删除"
scheduled.delete_all_title:
  en: "Delete all messages not sent on time?"
  ru: "Удалить все неотправленные вовремя сообщения?"
  es: "¿Eliminar todos los mensajes no enviados a tiempo?"
  th: "ลบข้อความทั้งหมดที่ไม่ได้ส่งตามเวลาหรือไม่"
  zh: "删除所有未按时发送的消息？"
scheduled.delete_all_body:
  en: "Their text is kept only on this device: it cannot be restored."
  ru: "Их текст хранится только на этом устройстве: восстановить его не получится."
  es: "Su texto solo se guarda en este dispositivo: no se podrá recuperar."
  th: "ข้อความเหล่านี้เก็บไว้ในอุปกรณ์นี้เท่านั้น จึงกู้คืนไม่ได้"
  zh: "这些消息的文本仅保存在此设备上，删除后无法恢复。"
scheduled.being_edited:
  en: "Open in Drafts & scheduled"
  ru: "Открыто в «Черновики и отложенные»"
  es: "Abierto en Borradores y programados"
  th: "เปิดอยู่ในฉบับร่างและข้อความที่ตั้งเวลา"
  zh: "已在“草稿与定时消息”中打开"
scheduled.discarded_title:
  en: "Scheduled messages deleted"
  ru: "Отложенные сообщения удалены"
  es: "Mensajes programados eliminados"
  th: "ลบข้อความที่ตั้งเวลาแล้ว"
  zh: "定时消息已删除"
scheduled.discarded_body:
  en: "Signed out of %{server}: %{count} scheduled message(s) were deleted with the offline data and will not be sent."
  ru: "Выполнен выход из %{server}: отложенные сообщения удалены вместе с офлайн-данными и не будут отправлены (%{count})."
  es: "Se cerró la sesión en %{server}: %{count} mensaje(s) programado(s) se eliminaron con los datos sin conexión y no se enviarán."
  th: "ออกจากระบบ %{server} แล้ว ข้อความที่ตั้งเวลาไว้ %{count} รายการถูกลบพร้อมข้อมูลออฟไลน์และจะไม่ถูกส่ง"
  zh: "已退出 %{server}：%{count} 条定时消息已随离线数据一起删除，不会发送。"
scheduled.failed_title:
  en: "Scheduled message not sent"
  ru: "Отложенное сообщение не отправлено"
  es: "Mensaje programado no enviado"
  th: "ส่งข้อความที่ตั้งเวลาไม่สำเร็จ"
  zh: "定时消息未发送"
scheduled.failed_body:
  en: "%{room}: %{error}. It is back in Drafts & scheduled: send it again, pick a new time or delete it."
  ru: "%{room}: %{error}. Сообщение вернулось в «Черновики и отложенные»: отправьте его снова, выберите новое время или удалите."
  es: "%{room}: %{error}. Ha vuelto a Borradores y programados: reenvíalo, elige otra hora o elimínalo."
  th: "%{room}: %{error} ข้อความกลับไปอยู่ในฉบับร่างและข้อความที่ตั้งเวลาแล้ว ส่งอีกครั้ง เลือกเวลาใหม่ หรือลบทิ้ง"
  zh: "%{room}：%{error}。该消息已回到“草稿与定时消息”：可重新发送、重新选择时间或删除。"
scheduled.no_storage:
  en: "Scheduling needs the offline cache, which is not available, so a scheduled message would be lost on quitting"
  ru: "Для отложенной отправки нужен офлайн-кэш, а он недоступен: отложенное сообщение пропало бы при выходе"
  es: "Programar necesita la caché sin conexión, que no está disponible: un mensaje programado se perdería al salir"
  th: "การตั้งเวลาต้องใช้แคชออฟไลน์ซึ่งใช้งานไม่ได้ ข้อความที่ตั้งเวลาจะหายไปเมื่อปิดโปรแกรม"
  zh: "定时发送需要离线缓存，但它不可用，退出时定时消息会丢失"
scheduled.dropped_title:
  en: "Scheduled messages removed"
  ru: "Отложенные сообщения удалены"
  es: "Mensajes programados eliminados"
  th: "ลบข้อความที่ตั้งเวลาแล้ว"
  zh: "定时消息已移除"
scheduled.dropped_body:
  en: "You are no longer in %{room}: %{count} scheduled message(s) there will not be sent."
  ru: "Вы больше не в %{room}: отложенных сообщений, которые не будут отправлены: %{count}."
  es: "Ya no estás en %{room}: %{count} mensaje(s) programado(s) allí no se enviarán."
  th: "คุณไม่ได้อยู่ใน %{room} แล้ว ข้อความที่ตั้งเวลาไว้ %{count} รายการจะไม่ถูกส่ง"
  zh: "你已不在 %{room}：那里的 %{count} 条定时消息不会发送。"
