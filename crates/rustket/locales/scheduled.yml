  zh: "全部删除"
scheduled.no_storage:
  en: "Scheduling needs the offline cache, which is not available, so a scheduled message would be lost on quitting"
  ru: "Для отложенной отправки нужен офлайн-кэш, а он недоступен: отложенное сообщение пропало бы при выходе"
  es: "Programar necesita la caché sin conexión, que no está disponible: un mensaje programado se perdería al salir"
  th: "การตั้งเวลาต้องใช้แคชออฟไลน์ซึ่งใช้งานไม่ได้ ข้อความที่ตั้งเวลาจะหายไปเมื่อปิดโปรแกรม"
  zh: "定时发送需要离线缓存，但它不可用，退出时定时消息会丢失"
scheduled.dropped_title:
  en: "Scheduled messages removed"
  ru: "Отложенные сообщения удалены"
  es: "Mensajes programados eliminados"
  th: "ลบข้อความที่ตั้งเวลาแล้ว"
  zh: "定时消息已移除"
scheduled.dropped_body:
  en: "You are no longer in %{room}: %{count} scheduled message(s) there will not be sent."
  ru: "Вы больше не в %{room}: отложенных сообщений, которые не будут отправлены: %{count}."
  es: "Ya no estás en %{room}: %{count} mensaje(s) programado(s) allí no se enviarán."
  th: "คุณไม่ได้อยู่ใน %{room} แล้ว ข้อความที่ตั้งเวลาไว้ %{count} รายการจะไม่ถูกส่ง"
  zh: "你已不在 %{room}：那里的 %{count} 条定时消息不会发送。"
