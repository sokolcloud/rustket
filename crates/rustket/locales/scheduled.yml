scheduled.missed_title:
  en: "Scheduled messages not sent on time"
  ru: "Отложенные сообщения не отправлены вовремя"
  es: "Mensajes programados no enviados a tiempo"
  th: "ข้อความที่ตั้งเวลาไม่ได้ส่งตรงเวลา"
  zh: "定时消息未按时发送"
scheduled.missed_body:
  en: "Rustket was not running or not connected when these were due, so they were not sent. Send them now, pick a new time or delete them."
  ru: "Когда подошло время, Rustket не был запущен или не был подключён, поэтому сообщения не отправлены. Отправьте их сейчас, выберите новое время или удалите."
  es: "Rustket no estaba en marcha o no tenía conexión cuando tocaba enviarlos, así que no se enviaron. Envíalos ahora, elige otra hora o elimínalos."
  th: "Rustket ไม่ได้ทำงานหรือไม่ได้เชื่อมต่อเมื่อถึงเวลา จึงยังไม่ได้ส่งข้อความเหล่านี้ ส่งตอนนี้ เลือกเวลาใหม่ หรือลบทิ้ง"
  zh: "到时间时 Rustket 未运行或未连接，因此这些消息没有发送。可以立即发送、重新选择时间或删除。"
scheduled.decide_later:
