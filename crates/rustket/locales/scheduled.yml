scheduled.empty_body:
  en: "Unsent text in a composer shows here, and messages you schedule with the clock button next to Send."
  ru: "Здесь появляется неотправленный текст из полей ввода и сообщения, отложенные кнопкой с часами рядом с «Отправить»."
  es: "Aquí aparece el texto sin enviar de los editores y los mensajes que programes con el botón del reloj junto a Enviar."
  th: "ข้อความที่ยังไม่ได้ส่งในช่องพิมพ์จะแสดงที่นี่ รวมถึงข้อความที่ตั้งเวลาด้วยปุ่มนาฬิกาข้างปุ่มส่ง"
  zh: "输入框中未发送的文字会显示在这里，用“发送”旁的时钟按钮定时的消息也会显示在这里。"
