scheduled.e2e_unavailable:
  en: "Messages cannot be scheduled in encrypted rooms"
  ru: "В зашифрованных комнатах нельзя отправлять сообщения позже"
  es: "No se pueden programar mensajes en salas cifradas"
  th: "ตั้งเวลาข้อความในห้องที่เข้ารหัสไม่ได้"
  zh: "加密聊天室中无法定时发送消息"
