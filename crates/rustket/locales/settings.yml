settings.flags:
  en: "Flags"
  ru: "Флажки"
  es: "Marcas"
  th: "ธง"
  zh: "旗标"
settings.flags_caption:
  en: "Flag rooms and threads from their menus. Flags and their names sync across your devices through the server; each account has its own."
  ru: "Флажки ставятся через меню комнат и тредов. Флажки и их названия синхронизируются между вашими устройствами через сервер, у каждой учётной записи они свои."
  es: "Marca salas e hilos desde sus menús. Las marcas y sus nombres se sincronizan entre tus dispositivos a través del servidor; cada cuenta tiene las suyas."
  th: "ติดธงห้องและเธรดได้จากเมนูของห้องและเธรด ธงและชื่อธงจะซิงค์ระหว่างอุปกรณ์ของคุณผ่านเซิร์ฟเวอร์ โดยแต่ละบัญชีมีธงของตัวเอง"
  zh: "可通过聊天室和讨论串的菜单添加旗标。旗标及其名称通过服务器在你的设备间同步；每个账户各自独立。"
settings.flags_signed_out:
  en: "Sign in to a server to name its flags."
  ru: "Войдите на сервер, чтобы задать названия его флажков."
  es: "Inicia sesión en un servidor para poner nombre a sus marcas."
  th: "ลงชื่อเข้าใช้เซิร์ฟเวอร์เพื่อตั้งชื่อธง"
  zh: "登录服务器后即可为其旗标命名。"
settings.flags_account:
  en: "%{user} on %{server}"
