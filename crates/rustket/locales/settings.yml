  ru: "Выключено: как в Rocket.Chat, комната остаётся непрочитанной, пока вы не увидите первое непрочитанное сообщение или не нажмёте «Отметить прочитанным»."
  es: "Desactivado: como en Rocket.Chat, la sala sigue sin leer hasta que veas su primer mensaje no leído o uses Marcar como leído."
  th: "ปิด: เหมือน Rocket.Chat ห้องจะยังไม่ถูกอ่านจนกว่าคุณจะเห็นข้อความแรกที่ยังไม่ได้อ่าน หรือใช้ ทำเครื่องหมายว่าอ่านแล้ว"
