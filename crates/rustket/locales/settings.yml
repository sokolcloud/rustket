  es: "No hay llavero ni directorio de datos con permiso de escritura: los tokens de inicio de sesión y las claves E2E se guardan en memoria, así que tendrás que iniciar sesión e introducir tu contraseña E2E cada vez que abras la aplicación."
  th: "ไม่มีที่เก็บรหัสผ่านหรือไดเรกทอรีข้อมูลที่เขียนได้: โทเค็นการเข้าสู่ระบบและคีย์ E2E จะถูกเก็บในหน่วยความจำ คุณจึงต้องลงชื่อเข้าใช้และป้อนรหัสผ่าน E2E ทุกครั้งที่เปิดโปรแกรม"
  zh: "没有密钥环，也没有可写的数据目录：登录令牌和 E2EE 密钥保存在内存中，因此每次启动都需要重新登录并输入 E2EE 密码。"
