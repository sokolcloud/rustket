settings.starred_threads_sync_help:
  en: "Stars from other devices on old threads in quiet rooms may take up to a week to show here; “Refresh starred threads” in the Favorites menu checks every room now."
  ru: "Звёздочки, поставленные на других устройствах в старых тредах малоактивных комнат, могут появиться здесь только через неделю; пункт «Обновить избранные треды» в меню «Избранного» проверит все комнаты сразу."
  es: "Los destacados hechos en otros dispositivos sobre hilos antiguos de salas poco activas pueden tardar hasta una semana en aparecer aquí; «Actualizar hilos destacados» en el menú de Favoritos revisa ahora todas las salas."
  th: "ดาวจากอุปกรณ์อื่นบนเธรดเก่าในห้องที่ไม่ค่อยมีความเคลื่อนไหวอาจใช้เวลาถึงหนึ่งสัปดาห์จึงจะแสดงที่นี่ “รีเฟรชเธรดที่ติดดาว” ในเมนูรายการโปรดจะตรวจสอบทุกห้องทันที"
  zh: "在其他设备上为不活跃聊天室中的旧讨论串加的星标，可能最多需要一周才会显示在这里；“收藏”菜单中的“刷新星标讨论串”会立即检查所有聊天室。"
settings.star_kept:
  en: "Move kept threads to Favorites"
  ru: "Перенести оставленные треды в «Избранное»"
  es: "Mover hilos conservados a Favoritos"
  th: "ย้ายเธรดที่เก็บไว้ไปยังรายการโปรด"
  zh: "将保留的讨论串移到收藏"
settings.star_kept_help:
  en: "Kept threads not in Favorites: %{count}. Kept threads stay on this device; moving them stars their first messages, so they show on your other devices too."
  ru: "Оставленных тредов не в «Избранном»: %{count}. Оставленные треды хранятся только на этом устройстве, а при переносе их первые сообщения отмечаются звёздочкой и появляются на других ваших устройствах."
  es: "Hilos conservados que no están en Favoritos: %{count}. Los hilos conservados se quedan en este dispositivo; al moverlos se destacan sus primeros mensajes, así que también aparecen en tus otros dispositivos."
  th: "เธรดที่เก็บไว้ซึ่งไม่อยู่ในรายการโปรด: %{count} เธรดที่เก็บไว้จะอยู่บนอุปกรณ์นี้เท่านั้น การย้ายจะติดดาวข้อความแรกของเธรด จึงแสดงบนอุปกรณ์อื่นของคุณด้วย"
  zh: "不在收藏中的保留讨论串：%{count}。保留的讨论串只存在于此设备；移动时会为它们的首条消息加星标，这样它们也会显示在你的其他设备上。"
settings.star_kept_confirm:
  en: "Star the first messages of the kept threads (%{count})? They also appear among the rooms' starred messages in other clients. Each thread takes a few seconds; the threads stay kept."
  ru: "Отметить звёздочкой первые сообщения оставленных тредов (%{count})? Они появятся и среди отмеченных сообщений комнат в других клиентах. На каждый тред уходит несколько секунд, треды останутся оставленными."
  es: "¿Destacar los primeros mensajes de los hilos conservados (%{count})? También aparecerán entre los mensajes destacados de las salas en otros clientes. Cada hilo tarda unos segundos; los hilos siguen conservados."
  th: "ติดดาวข้อความแรกของเธรดที่เก็บไว้ (%{count}) หรือไม่ ข้อความเหล่านี้จะปรากฏในข้อความที่ติดดาวของห้องในไคลเอนต์อื่นด้วย แต่ละเธรดใช้เวลาไม่กี่วินาที และเธรดจะยังคงถูกเก็บไว้"
  zh: "为保留的讨论串（%{count}）的首条消息加星标？它们也会出现在其他客户端中各聊天室的星标消息里。每个讨论串需要几秒钟；这些讨论串仍会保留。"
