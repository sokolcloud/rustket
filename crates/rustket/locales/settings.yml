  ru: "Токены входа и ключи E2E хранятся в памяти только до закрытия приложения."
  es: "Los tokens de inicio de sesión y las claves E2E se guardan en memoria solo durante esta sesión."
  th: "โทเค็นการเข้าสู่ระบบและคีย์ E2E จะถูกเก็บในหน่วยความจำเฉพาะเซสชันนี้เท่านั้น"
  zh: "登录令牌和 E2EE 密钥仅在本次会话期间保存在内存中。"
settings.secret_store_loading:
  en: "Opening the secret store…"
  ru: "Открываем хранилище секретов…"
  es: "Abriendo el almacén de secretos…"
  th: "กำลังเปิดที่เก็บข้อมูลลับ…"
  zh: "正在打开密钥存储…"
settings.secret_store_memory_policy:
  en: "The system keyring is unavailable. As you chose, login tokens and E2E keys are kept in memory for this session only: after a restart you sign in again and enter your E2E password."
  ru: "Системное хранилище паролей недоступно. По вашему выбору токены входа и ключи E2E хранятся в памяти только до закрытия приложения: после перезапуска нужно снова войти и ввести пароль E2E."
  es: "El llavero del sistema no está disponible. Como elegiste, los tokens de inicio de sesión y las claves E2E se guardan en memoria solo durante esta sesión: después de reiniciar, vuelve a iniciar sesión e introduce tu contraseña E2E."
  th: "ที่เก็บรหัสผ่านของระบบไม่พร้อมใช้งาน ตามที่คุณเลือก โทเค็นการเข้าสู่ระบบและคีย์ E2E จะถูกเก็บในหน่วยความจำเฉพาะเซสชันนี้เท่านั้น หลังจากเปิดโปรแกรมใหม่ คุณต้องลงชื่อเข้าใช้อีกครั้งและป้อนรหัสผ่าน E2E"
  zh: "系统密钥环不可用。按照你的选择，登录令牌和 E2EE 密钥仅在本次会话期间保存在内存中：重启后需要重新登录并输入你的 E2EE 密码。"
settings.secrets_memory_only:
  en: "Never store secrets in a file"
  ru: "Никогда не хранить секреты в файле"
  es: "No guardar nunca los secretos en un archivo"
  th: "ไม่เก็บข้อมูลลับในไฟล์"
  zh: "永不将机密存储到文件中"
settings.secrets_memory_only_help:
  en: "When the system keyring is unavailable, keep login tokens and E2E keys in memory for this session only instead of in an unencrypted file. The keyring is still used when it works."
  ru: "Если системное хранилище паролей недоступно, хранить токены входа и ключи E2E в памяти до закрытия приложения, а не в незашифрованном файле. Работающее хранилище паролей используется как обычно."
  es: "Cuando el llavero del sistema no esté disponible, guarda los tokens de inicio de sesión y las claves E2E en memoria solo durante esta sesión en lugar de en un archivo sin cifrar. El llavero se sigue usando cuando funciona."
  th: "เมื่อที่เก็บรหัสผ่านของระบบไม่พร้อมใช้งาน ให้เก็บโทเค็นการเข้าสู่ระบบและคีย์ E2E ในหน่วยความจำเฉพาะเซสชันนี้แทนการเก็บในไฟล์ที่ไม่ได้เข้ารหัส ยังคงใช้ที่เก็บรหัสผ่านเมื่อใช้งานได้"
  zh: "系统密钥环不可用时，将登录令牌和 E2EE 密钥仅在本次会话期间保存在内存中，而不是保存在未加密的文件中。密钥环可用时仍会使用它。"
