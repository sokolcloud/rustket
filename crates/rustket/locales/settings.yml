settings.notifications_help:
  en: "Which messages notify you is set per room and in your account preferences on the server."
  ru: "Какие сообщения вызывают уведомления, задаётся в комнатах и в настройках аккаунта на сервере."
  es: "Qué mensajes te notifican se configura en cada sala y en las preferencias de tu cuenta en el servidor."
  th: "ข้อความใดที่จะแจ้งเตือนคุณ กำหนดได้ในแต่ละห้องและในการตั้งค่าบัญชีบนเซิร์ฟเวอร์"
