  zh: "收藏中显示星标讨论串"
settings.starred_threads_help:
  en: "Threads whose first message you starred are listed in Favorites, even with the Threads section off. Adding a thread to Favorites stars its first message: it also appears among the room's starred messages."
  ru: "Треды, первое сообщение которых вы отметили звёздочкой, показываются в «Избранном», даже если раздел «Треды» выключен. Добавить тред в избранное — значит отметить звёздочкой его первое сообщение: оно появится и среди отмеченных сообщений комнаты."
  es: "Los hilos cuyo primer mensaje destacaste aparecen en Favoritos, incluso con la sección Hilos desactivada. Añadir un hilo a Favoritos destaca su primer mensaje: también aparece entre los mensajes destacados de la sala."
  th: "เธรดที่คุณติดดาวข้อความแรกไว้จะแสดงในรายการโปรด แม้ปิดส่วนเธรดอยู่ก็ตาม การเพิ่มเธรดในรายการโปรดจะติดดาวข้อความแรกของเธรด และข้อความนั้นจะปรากฏในข้อความที่ติดดาวของห้องด้วย"
  zh: "首条消息被你加了星标的讨论串会列在“收藏”中，即使“讨论串”分区已关闭。将讨论串加入收藏会为其首条消息加星标：它也会出现在该聊天室的星标消息中。"
settings.starred_threads_sync_help:
  en: "Stars from other devices on old threads in quiet rooms may take up to a week to show here; “Refresh starred threads” in the Favorites menu checks every room now."
  ru: "Звёздочки, поставленные на других устройствах в старых тредах малоактивных комнат, могут появиться здесь только через неделю; пункт «Обновить избранные треды» в меню «Избранного» проверит все комнаты сразу."
  es: "Los destacados hechos en otros dispositivos sobre hilos antiguos de salas poco activas pueden tardar hasta una semana en aparecer aquí; «Actualizar hilos destacados» en el menú de Favoritos revisa ahora todas las salas."
  th: "ดาวจากอุปกรณ์อื่นบนเธรดเก่าในห้องที่ไม่ค่อยมีความเคลื่อนไหวอาจใช้เวลาถึงหนึ่งสัปดาห์จึงจะแสดงที่นี่ “รีเฟรชเธรดที่ติดดาว” ในเมนูรายการโปรดจะตรวจสอบทุกห้องทันที"
  zh: "在其他设备上为不活跃聊天室中的旧讨论串加的星标，可能最多需要一周才会显示在这里；“收藏”菜单中的“刷新星标讨论串”会立即检查所有聊天室。"
settings.star_kept:
