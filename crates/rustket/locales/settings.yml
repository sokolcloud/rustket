settings.share_utc_offset_help:
  en: "Like the web client, Rustket updates your UTC offset on the server after you sign in, so others see your local time. When off, the server keeps the last value."
  ru: "Как и веб-клиент, Rustket после входа обновляет на сервере ваше смещение от UTC, чтобы другие видели ваше местное время. Если выключено, на сервере остаётся последнее значение."
  es: "Como el cliente web, Rustket actualiza tu desfase UTC en el servidor al iniciar sesión, para que otros vean tu hora local. Si está desactivado, el servidor conserva el último valor."
  th: "เช่นเดียวกับเว็บไคลเอนต์ Rustket จะอัปเดตค่าเวลาต่างจาก UTC ของคุณบนเซิร์ฟเวอร์หลังเข้าสู่ระบบ เพื่อให้ผู้อื่นเห็นเวลาท้องถิ่นของคุณ เมื่อปิดไว้ เซิร์ฟเวอร์จะเก็บค่าล่าสุดไว้"
  zh: "与网页客户端一样，Rustket 会在你登录后更新服务器上的 UTC 偏移，让其他人看到你的当地时间。关闭后，服务器保留最后一次的值。"
