settings.secrets_keychain_title:
  en: "Keychain unavailable"
  ru: "Связка ключей недоступна"
  es: "El llavero no está disponible"
  th: "พวงกุญแจไม่พร้อมใช้งาน"
  zh: "钥匙串不可用"
settings.secrets_keychain_memory:
  en: "The macOS Keychain cannot be used, so login tokens and E2E keys are kept in memory only: you will have to sign in and enter your E2E password again after Rustket quits. Nothing is written to an unencrypted file."
  ru: "Связка ключей macOS недоступна, поэтому токены входа и ключи E2E хранятся только в памяти: после выхода из Rustket придётся снова войти и ввести пароль E2E. В незашифрованный файл ничего не записывается."
  es: "No se puede usar el llavero de macOS, así que los tokens de inicio de sesión y las claves E2E se guardan solo en memoria: tendrás que volver a iniciar sesión e introducir tu contraseña E2E después de cerrar Rustket. No se escribe nada en un archivo sin cifrar."
  th: "ไม่สามารถใช้พวงกุญแจของ macOS ได้ โทเค็นการเข้าสู่ระบบและคีย์ E2E จึงถูกเก็บไว้ในหน่วยความจำเท่านั้น คุณจะต้องเข้าสู่ระบบและป้อนรหัสผ่าน E2E อีกครั้งหลังจากปิด Rustket ไม่มีการเขียนสิ่งใดลงในไฟล์ที่ไม่ได้เข้ารหัส"
  zh: "无法使用 macOS 钥匙串，因此登录令牌和 E2EE 密钥仅保存在内存中：退出 Rustket 后需要重新登录并输入 E2EE 密码。不会写入任何未加密的文件。"
