settings.flags_pending:
  en: "Some changes are not saved on the server yet."
  ru: "Часть изменений ещё не сохранена на сервере."
  es: "Algunos cambios aún no se han guardado en el servidor."
  th: "การเปลี่ยนแปลงบางส่วนยังไม่ได้บันทึกบนเซิร์ฟเวอร์"
  zh: "部分更改尚未保存到服务器。"
settings.flags_failed:
  en: "Couldn't sync flags: %{error}. They are kept on this device until the next try."
  ru: "Не удалось синхронизировать флажки: %{error}. Они сохранены на этом устройстве до следующей попытки."
  es: "No se pudieron sincronizar las marcas: %{error}. Se conservan en este dispositivo hasta el próximo intento."
  th: "ไม่สามารถซิงค์ธงได้: %{error} ธงจะเก็บไว้บนอุปกรณ์นี้จนกว่าจะลองใหม่ครั้งถัดไป"
  zh: "无法同步旗标：%{error}。在下次尝试之前，它们会保存在此设备上。"
