_version: 2
handler.title:
  en: "Open rocketchat:// links with Rustket"
  ru: "Открывать ссылки rocketchat:// в Rustket"
  es: "Abrir enlaces rocketchat:// con Rustket"
  th: "เปิดลิงก์ rocketchat:// ด้วย Rustket"
  zh: "使用 Rustket 打开 rocketchat:// 链接"
handler.body:
  en: "Browser sign-in finishes by opening a rocketchat:// link. Registering Rustket as its handler makes this automatic."
  ru: "Вход через браузер завершается открытием ссылки rocketchat://. Если зарегистрировать Rustket как её обработчик, вход завершится автоматически."
  es: "El inicio de sesión en el navegador termina abriendo un enlace rocketchat://. Si registras Rustket como su controlador, esto será automático."
  th: "การลงชื่อเข้าใช้ผ่านเบราว์เซอร์จะจบด้วยการเปิดลิงก์ rocketchat:// การลงทะเบียน Rustket เป็นตัวจัดการลิงก์นี้จะทำให้ขั้นตอนนี้เป็นอัตโนมัติ"
  zh: "浏览器登录完成时会打开一个 rocketchat:// 链接。将 Rustket 注册为其处理程序即可自动完成登录。"
handler.replaces:
  en: "rocketchat:// links currently open %{current} (e.g. the official desktop app). Registering replaces it."
  ru: "Сейчас ссылки rocketchat:// открывает %{current} (например, официальное приложение). Регистрация заменит его."
  es: "Ahora los enlaces rocketchat:// abren %{current} (p. ej., la aplicación oficial de escritorio). El registro lo reemplazará."
  th: "ขณะนี้ลิงก์ rocketchat:// เปิดด้วย %{current} (เช่น แอปเดสก์ท็อปอย่างเป็นทางการ) การลงทะเบียนจะแทนที่แอปนั้น"
  zh: "rocketchat:// 链接当前由 %{current} 打开（例如官方桌面应用）。注册后将替换它。"
handler.stale:
  en: "rocketchat:// links currently start another Rustket executable (%{current}). Registering switches them to this one."
  ru: "Сейчас ссылки rocketchat:// запускают другой исполняемый файл Rustket (%{current}). Регистрация переключит их на этот."
  es: "Ahora los enlaces rocketchat:// inician otro ejecutable de Rustket (%{current}). El registro los cambiará a este."
  th: "ขณะนี้ลิงก์ rocketchat:// เปิดไฟล์ปฏิบัติการ Rustket ตัวอื่น (%{current}) การลงทะเบียนจะเปลี่ยนมาใช้ตัวนี้"
  zh: "rocketchat:// 链接当前会启动另一个 Rustket 可执行文件（%{current}）。注册后将改为使用当前程序。"
handler.already:
  en: "Rustket is already registered."
  ru: "Rustket уже зарегистрирован."
  es: "Rustket ya está registrado."
  th: "ลงทะเบียน Rustket ไว้แล้ว"
  zh: "Rustket 已注册。"
handler.register:
  en: "Register"
  ru: "Зарегистрировать"
  es: "Registrar"
  th: "ลงทะเบียน"
  zh: "注册"
handler.registered:
  en: "Rustket now opens rocketchat:// links"
  ru: "Теперь ссылки rocketchat:// открываются в Rustket"
  es: "Ahora Rustket abre los enlaces rocketchat://"
  th: "ตอนนี้ Rustket จะเปิดลิงก์ rocketchat://"
  zh: "Rustket 现在会打开 rocketchat:// 链接"
handler.bundle:
  en: "On macOS the app bundle handles rocketchat:// links; there is nothing to register."
  ru: "В macOS ссылки rocketchat:// обрабатывает пакет приложения; регистрировать нечего."
  es: "En macOS, el paquete de la aplicación gestiona los enlaces rocketchat://; no hay nada que registrar."
  th: "บน macOS แอปบันเดิลจะจัดการลิงก์ rocketchat:// เอง ไม่ต้องลงทะเบียน"
  zh: "在 macOS 上，rocketchat:// 链接由应用包处理，无需注册。"
handler.shared_group:
  en: "%{path} can be changed by other members of its group."
  ru: "%{path} могут изменять другие участники его группы."
  es: "Otros miembros de su grupo pueden modificar %{path}."
  th: "สมาชิกคนอื่นในกลุ่มของ %{path} สามารถแก้ไขไฟล์นี้ได้"
  zh: "%{path} 可被其所属组的其他成员修改。"
