legal.about_text:
  en: "A native desktop client for team chat, written in Rust."
  ru: "Нативный настольный клиент для командного чата на Rust."
  es: "Un cliente de escritorio nativo para chat de equipo, escrito en Rust."
  th: "ไคลเอนต์เดสก์ท็อปแบบเนทีฟสำหรับแชตทีม เขียนด้วย Rust"
  zh: "用 Rust 编写的原生团队聊天桌面客户端。"
