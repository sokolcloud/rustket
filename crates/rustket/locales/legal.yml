legal.support_help:
  en: "Questions or problems with Rustket itself: contact the developer through the support page. Your account, rooms and messages are managed by your workspace's administrators: ask them, or report content from a message's menu or the User info panel."
  ru: "Вопросы и проблемы с самим Rustket — обратитесь к разработчику через страницу поддержки. Учётной записью, комнатами и сообщениями управляют администраторы вашего рабочего пространства: обратитесь к ним или пожалуйтесь через меню сообщения или панель «Сведения о пользователе»."
  es: "Preguntas o problemas con Rustket: contacta con el desarrollador desde la página de soporte. Tu cuenta, tus salas y tus mensajes los gestionan los administradores de tu espacio de trabajo: pregúntales a ellos o denuncia el contenido desde el menú del mensaje o el panel Información del usuario."
  th: "คำถามหรือปัญหาเกี่ยวกับ Rustket: ติดต่อผู้พัฒนาผ่านหน้าฝ่ายสนับสนุน บัญชี ห้อง และข้อความของคุณอยู่ภายใต้การดูแลของผู้ดูแลเวิร์กสเปซ: สอบถามผู้ดูแล หรือรายงานเนื้อหาจากเมนูข้อความหรือแผงข้อมูลผู้ใช้"
  zh: "关于 Rustket 本身的问题：请通过支持页面联系开发者。你的账号、房间和消息由工作区管理员管理：请联系他们，或通过消息菜单或“用户信息”面板举报内容。"
legal.subscription_unavailable:
  en: "The workspace subscription is not managed in Rustket."
  ru: "Подписка рабочего пространства не управляется в Rustket."
  es: "La suscripción del espacio de trabajo no se gestiona en Rustket."
  th: "ไม่สามารถจัดการการสมัครใช้งานของเวิร์กสเปซใน Rustket"
  zh: "无法在 Rustket 中管理工作区订阅。"
legal.terms_title:
  en: "Before you start"
  ru: "Прежде чем начать"
  es: "Antes de empezar"
  th: "ก่อนเริ่มใช้งาน"
  zh: "开始之前"
legal.terms_intro:
  en: "Rustket connects you to chat workspaces run by your organization or community. By using Rustket you agree to these terms:"
  ru: "Rustket подключает вас к рабочим пространствам чата вашей организации или сообщества. Пользуясь Rustket, вы соглашаетесь с этими условиями:"
  es: "Rustket te conecta con espacios de trabajo de chat de tu organización o comunidad. Al usar Rustket aceptas estas condiciones:"
  th: "Rustket เชื่อมต่อคุณกับเวิร์กสเปซแชตที่องค์กรหรือชุมชนของคุณดูแล การใช้ Rustket หมายความว่าคุณยอมรับข้อกำหนดเหล่านี้:"
  zh: "Rustket 将你连接到你的组织或社区运营的聊天工作区。使用 Rustket 即表示你同意以下条款："
legal.terms_point_content:
  en: "There is no tolerance for objectionable content or abusive users. Do not post content that is illegal, hateful, harassing, sexually explicit or otherwise objectionable, and do not abuse other people."
  ru: "Недопустимы неприемлемый контент и оскорбительное поведение. Не публикуйте незаконный, разжигающий ненависть, оскорбительный, откровенно сексуальный или иной неприемлемый контент и не оскорбляйте других людей."
  es: "No se tolera el contenido inapropiado ni a los usuarios abusivos. No publiques contenido ilegal, de odio, acosador, sexualmente explícito o inapropiado de cualquier otro modo, y no abuses de otras personas."
  th: "ไม่ยอมรับเนื้อหาที่ไม่เหมาะสมหรือผู้ใช้ที่ก่อความเดือดร้อนโดยเด็ดขาด ห้ามโพสต์เนื้อหาที่ผิดกฎหมาย สร้างความเกลียดชัง คุกคาม มีเนื้อหาทางเพศอย่างโจ่งแจ้ง หรือไม่เหมาะสมในรูปแบบอื่น และห้ามล่วงละเมิดผู้อื่น"
  zh: "对令人反感的内容和滥用行为零容忍。请勿发布违法、仇恨、骚扰、色情露骨或其他令人反感的内容，也不要辱骂他人。"
legal.terms_point_moderation:
  en: "Each workspace is run by its administrators. Reports you send from Rustket (Report, Report user) go to the workspace's moderators, who can remove content and suspend or remove accounts."
  ru: "Каждым рабочим пространством управляют его администраторы. Жалобы из Rustket (на сообщение или пользователя) получают модераторы рабочего пространства: они могут удалять контент и блокировать или удалять учётные записи."
  es: "Cada espacio de trabajo lo gestionan sus administradores. Las denuncias que envías desde Rustket (Denunciar mensaje, Denunciar usuario) llegan a los moderadores del espacio de trabajo, que pueden eliminar contenido y suspender o eliminar cuentas."
  th: "แต่ละเวิร์กสเปซดูแลโดยผู้ดูแลของเวิร์กสเปซนั้น รายงานที่คุณส่งจาก Rustket (รายงานข้อความ รายงานผู้ใช้) จะส่งถึงผู้ดูแลของเวิร์กสเปซ ซึ่งสามารถลบเนื้อหาและระงับหรือลบบัญชีได้"
  zh: "每个工作区由其管理员运营。你在 Rustket 中发送的举报（举报消息、举报用户）会送达工作区的版主，他们可以删除内容并暂停或删除账号。"
legal.terms_point_tools:
  en: "You can block users in direct messages, ignore them in rooms and hide messages with words you choose (Settings, Privacy & storage, Hidden words)."
  ru: "Вы можете блокировать пользователей в личных сообщениях, игнорировать их в комнатах и скрывать сообщения с выбранными словами (Настройки, Приватность, Скрытые слова)."
  es: "Puedes bloquear usuarios en los mensajes directos, ignorarlos en las salas y ocultar mensajes con las palabras que elijas (Configuración, Privacidad y almacenamiento, Palabras ocultas)."
  th: "คุณสามารถบล็อกผู้ใช้ในข้อความส่วนตัว เพิกเฉยผู้ใช้ในห้อง และซ่อนข้อความที่มีคำที่คุณเลือก (การตั้งค่า, ความเป็นส่วนตัวและพื้นที่จัดเก็บ, คำที่ซ่อน)"
  zh: "你可以在私信中屏蔽用户、在房间中忽略用户，并隐藏包含你所选词语的消息（设置 › 隐私与存储 › 隐藏词）。"
legal.terms_point_privacy:
  en: "The developer of Rustket does not run your chat servers and collects no data. Your messages go only to the servers you add."
  ru: "Разработчик Rustket не управляет вашими серверами чата и не собирает данные. Ваши сообщения отправляются только на добавленные вами серверы."
  es: "El desarrollador de Rustket no gestiona tus servidores de chat ni recopila datos. Tus mensajes solo van a los servidores que añadas."
  th: "ผู้พัฒนา Rustket ไม่ได้ดูแลเซิร์ฟเวอร์แชตของคุณและไม่เก็บข้อมูลใดๆ ข้อความของคุณจะส่งไปยังเซิร์ฟเวอร์ที่คุณเพิ่มเท่านั้น"
  zh: "Rustket 的开发者不运营你的聊天服务器，也不收集任何数据。你的消息只会发送到你添加的服务器。"
