legal.delete_help:
  en: "Deletes your account on this workspace for good. What happens to your messages depends on the workspace's settings."
  ru: "Безвозвратно удаляет вашу учётную запись в этом рабочем пространстве. Что станет с вашими сообщениями, зависит от настроек рабочего пространства."
  es: "Elimina tu cuenta en este espacio de trabajo de forma definitiva. Lo que ocurra con tus mensajes depende de la configuración del espacio de trabajo."
  th: "ลบบัญชีของคุณในเวิร์กสเปซนี้อย่างถาวร สิ่งที่เกิดขึ้นกับข้อความของคุณขึ้นอยู่กับการตั้งค่าของเวิร์กสเปซ"
  zh: "永久删除你在此工作区的账号。你的消息如何处理取决于工作区的设置。"
