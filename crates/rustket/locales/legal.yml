legal.disclaimer:
  en: "Independent client for Rocket.Chat servers; not affiliated with or endorsed by Rocket.Chat Technologies Corp. Rocket.Chat is a trademark of Rocket.Chat Technologies Corp."
  ru: "Независимый клиент для серверов Rocket.Chat; не связан с Rocket.Chat Technologies Corp. и не одобрен ею. Rocket.Chat — товарный знак Rocket.Chat Technologies Corp."
  es: "Cliente independiente para servidores Rocket.Chat; no está afiliado a Rocket.Chat Technologies Corp. ni cuenta con su respaldo. Rocket.Chat es una marca comercial de Rocket.Chat Technologies Corp."
  th: "ไคลเอนต์อิสระสำหรับเซิร์ฟเวอร์ Rocket.Chat ไม่มีส่วนเกี่ยวข้องหรือได้รับการรับรองจาก Rocket.Chat Technologies Corp. Rocket.Chat เป็นเครื่องหมายการค้าของ Rocket.Chat Technologies Corp."
  zh: "Rocket.Chat 服务器的独立客户端；与 Rocket.Chat Technologies Corp. 无关联，也未获其认可。Rocket.Chat 是 Rocket.Chat Technologies Corp. 的商标。"
