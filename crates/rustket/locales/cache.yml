_version: 2
cache.updating:
  en: "Showing saved data while connecting…"
  ru: "Показаны сохранённые данные, идёт подключение…"
  es: "Mostrando datos guardados mientras se conecta…"
  th: "กำลังแสดงข้อมูลที่บันทึกไว้ระหว่างเชื่อมต่อ…"
  zh: "正在连接，显示已保存的数据…"
cache.updating_from:
  en: "Showing data saved at %{time} while connecting…"
  ru: "Показаны данные от %{time}, идёт подключение…"
  es: "Mostrando datos guardados (%{time}) mientras se conecta…"
  th: "กำลังแสดงข้อมูลที่บันทึกไว้เมื่อ %{time} ระหว่างเชื่อมต่อ…"
  zh: "正在连接，显示 %{time} 保存的数据…"
cache.offline:
  en: "Offline, reconnecting. Showing saved messages; new messages are sent once connected."
  ru: "Нет связи, переподключение. Показаны сохранённые сообщения; новые отправятся после подключения."
  es: "Sin conexión, reconectando. Se muestran los mensajes guardados; los nuevos mensajes se enviarán al conectarse."
  th: "ออฟไลน์ กำลังเชื่อมต่อใหม่ กำลังแสดงข้อความที่บันทึกไว้ ข้อความใหม่จะถูกส่งเมื่อเชื่อมต่อแล้ว"
  zh: "离线，正在重新连接。显示已保存的消息；新消息将在连接后发送。"
cache.offline_from:
  en: "Offline, reconnecting. Showing data saved at %{time}; new messages are sent once connected."
  ru: "Нет связи, переподключение. Показаны данные от %{time}; новые сообщения отправятся после подключения."
  es: "Sin conexión, reconectando. Se muestran datos guardados (%{time}); los nuevos mensajes se enviarán al conectarse."
  th: "ออฟไลน์ กำลังเชื่อมต่อใหม่ กำลังแสดงข้อมูลที่บันทึกไว้เมื่อ %{time} ข้อความใหม่จะถูกส่งเมื่อเชื่อมต่อแล้ว"
  zh: "离线，正在重新连接。显示 %{time} 保存的数据；新消息将在连接后发送。"
cache.waiting:
  en: "Waiting for the connection; sent automatically"
  ru: "Ожидает подключения, отправится автоматически"
  es: "Esperando la conexión; se enviará automáticamente"
  th: "รอการเชื่อมต่อ จะส่งโดยอัตโนมัติ"
  zh: "等待连接；将自动发送"
cache.uploads_interrupted:
  en: "Uploads were interrupted"
  ru: "Загрузка файлов прервана"
  es: "Se interrumpieron las subidas"
  th: "การอัปโหลดถูกขัดจังหวะ"
  zh: "上传已中断"
cache.uploads_interrupted_body:
  en: "Rustket was closed while uploading, so these files were not sent: %{names}"
  ru: "Rustket был закрыт во время загрузки, эти файлы не отправлены: %{names}"
  es: "Rustket se cerró durante la subida, así que estos archivos no se enviaron: %{names}"
  th: "Rustket ถูกปิดระหว่างอัปโหลด ไฟล์เหล่านี้จึงไม่ได้ถูกส่ง: %{names}"
  zh: "Rustket 在上传过程中被关闭，以下文件未发送：%{names}"
cache.settings_title:
  en: "Offline cache"
  ru: "Офлайн-кэш"
  es: "Caché sin conexión"
  th: "แคชออฟไลน์"
  zh: "离线缓存"
cache.settings_help:
  en: "Rooms and recent messages saved for a quick start and offline reading."
  ru: "Комнаты и последние сообщения для быстрого запуска и чтения без сети."
  es: "Salas y mensajes recientes guardados para un inicio rápido y lectura sin conexión."
  th: "ห้องและข้อความล่าสุดที่บันทึกไว้เพื่อเริ่มต้นอย่างรวดเร็วและอ่านแบบออฟไลน์"
  zh: "保存聊天室和最近的消息，用于快速启动和离线阅读。"
cache.settings_help_size:
  en: "Rooms and recent messages saved for a quick start and offline reading (%{size})."
  ru: "Комнаты и последние сообщения для быстрого запуска и чтения без сети (%{size})."
  es: "Salas y mensajes recientes guardados para un inicio rápido y lectura sin conexión (%{size})."
  th: "ห้องและข้อความล่าสุดที่บันทึกไว้เพื่อเริ่มต้นอย่างรวดเร็วและอ่านแบบออฟไลน์ (%{size})"
  zh: "保存聊天室和最近的消息，用于快速启动和离线阅读（%{size}）。"
cache.settings_clear:
  en: "Clear"
  ru: "Очистить"
  es: "Vaciar"
  th: "ล้าง"
  zh: "清除"
cache.clear_failed:
  en: "Couldn't clear the offline cache"
  ru: "Не удалось очистить офлайн-кэш"
  es: "No se pudo vaciar la caché sin conexión"
  th: "ล้างแคชออฟไลน์ไม่ได้"
  zh: "无法清除离线缓存"
cache.cleared:
  en: "Offline cache cleared"
  ru: "Офлайн-кэш очищен"
  es: "Caché sin conexión vaciada"
  th: "ล้างแคชออฟไลน์แล้ว"
  zh: "离线缓存已清除"
