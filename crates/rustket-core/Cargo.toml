[package]
name = "rustket-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
keyring = "4.2.0"
rocketchat = { version = "0.2.1", path = "../rocketchat" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
meteor-ddp = { path = "../meteor-ddp" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.8"
