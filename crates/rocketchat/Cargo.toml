[package]
name = "rocketchat"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
meteor-ddp = { path = "../meteor-ddp" }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hex = "0.4.3"
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "multipart", "stream", "charset", "system-proxy", "gzip"] }
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots", "url"] }
tracing = "0.1.44"
url = "2.5.8"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
ctr = "0.10"
aes-gcm = "0.11"
hmac = "0.13"
zeroize = "1.9"
pbkdf2 = { version = "0.13", features = ["hmac"] }
rsa = { version = "0.9.10", features = ["sha2", "getrandom"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
