name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          [ ! -f "$RUNNER_TEMP/test.log" ] || "$py" -I .github/scripts/test-annotations.py "$RUNNER_TEMP/test.log"

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          # Native ARM64 runner (free for public repositories): the tests run
          # on the architecture that ships, with the native MSVC/clang-cl.
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      # aws-lc-sys: use the NASM objects shipped in the crate (x64 only;
      # the runner has no NASM).
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: ./packaging/windows/ci-toolchain.ps1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          [ ! -f "$RUNNER_TEMP/test.log" ] || "$py" -I .github/scripts/test-annotations.py "$RUNNER_TEMP/test.log"

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target x86_64-apple-darwin
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The release's x86_64 slice is cross-compiled; type-check it too.
      - run: cargo clippy --locked --workspace --all-targets --target x86_64-apple-darwin -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          [ ! -f "$RUNNER_TEMP/test.log" ] || "$py" -I .github/scripts/test-annotations.py "$RUNNER_TEMP/test.log"
