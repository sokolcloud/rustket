name: Release

# Tags v<version> build every package and publish a GitHub release. Pushing
# the `release-dry-run` branch (or a manual run) builds the same packages as
# workflow artifacts without releasing. Each package is uploaded unarchived
# (`archive: false`), so it downloads as the .deb/.rpm/.exe/.dmg itself.
on:
  push:
    tags: ['v*']
    branches: ['release-dry-run']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Release packages ship the self-updater (crates/rustket/src/updater); the
  # packaging scripts pass RUSTKET_CARGO_FEATURES to cargo. The updater checks
  # the releases of the repository that built it.
  RUSTKET_CARGO_FEATURES: self-update
  RUSTKET_UPDATE_REPO: ${{ github.repository }}

jobs:
  # The release notes come from CHANGELOG.md: a tag without a section for its
  # version fails here, before the long package builds.
  changelog:
    name: CHANGELOG.md section
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes for the Cargo version
        env:
          STRICT: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if ! bash packaging/release-notes.sh "$version"; then
            [ "$STRICT" = true ] && exit 1
            echo "::warning::CHANGELOG.md has no section for $version"
          fi

  linux:
    name: Linux x86_64 (deb, rpm, AppImage)
    needs: [changelog]
    # glibc 2.35 baseline: the binary runs on this release and newer.
    runs-on: ubuntu-22.04
    env:
      # Pinned appimagetool and the static AppImage runtime it embeds (no
      # runtime download at build time). Digests from the GitHub release
      # asset metadata; bump URL and hash together.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm desktop-file-utils
      - name: Download appimagetool
        run: |
          set -euo pipefail
          fetch() { # url sha256 dest
            [ -n "$2" ] || { echo "::error::expected sha256 for $1 is not set"; exit 1; }
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$3" "$1"
            echo "$2  $3" | sha256sum --check --strict
          }
          fetch "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256" "$RUNNER_TEMP/appimagetool"
          fetch "$APPIMAGE_RUNTIME_URL" "$APPIMAGE_RUNTIME_SHA256" "$RUNNER_TEMP/runtime-x86_64"
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build
        run: cargo build --locked --profile dist -p rustket --bin rustket --features "$RUSTKET_CARGO_FEATURES"
      - name: deb + AppImage + package checks
        env:
          SKIP_BUILD: 1
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGETOOL_ARGS: --no-appstream --runtime-file ${{ runner.temp }}/runtime-x86_64
          # The runner has no FUSE; the tool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: packaging/test.sh
      - name: rpm
        env:
          SKIP_BUILD: 1
        run: |
          set -euo pipefail
          rpm_file="$(packaging/rpm/build.sh | tail -1)"
          rpm -qpi "$rpm_file"
          rpm -qp --requires "$rpm_file"
          rpm -qp --recommends "$rpm_file"
          files="$(rpm -qpl "$rpm_file")"
          echo "$files"
          for f in /usr/bin/rustket /usr/share/applications/rustket.desktop \
              /usr/share/metainfo/rustket.metainfo.xml /usr/share/man/man1/rustket.1.gz \
              /usr/share/icons/hicolor/512x512/apps/rustket.png \
              /usr/share/doc/rustket/THIRD-PARTY-NOTICES /usr/share/licenses/rustket/LICENSE \
              /usr/lib/rustket/install-kind; do
            grep -qx "$f" <<<"$files" || { echo "::error::$f missing from the rpm"; exit 1; }
          done
      - name: Collect
        run: |
          mkdir dist
          cp packaging/out/*.deb packaging/out/*.rpm packaging/out/*.AppImage dist/
          ls -l dist
      - name: Upload the deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.deb
          archive: false
          if-no-files-found: error
      - name: Upload the rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.rpm
          archive: false
          if-no-files-found: error
      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.AppImage
          archive: false
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} (setup.exe, zip)
    needs: [changelog]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          # Native ARM64 build, same runner as ci.yml.
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: ./packaging/windows/ci-toolchain.ps1
      - name: Install Inno Setup
        shell: pwsh
        # Installs, or upgrades an older preinstalled copy (6.3+ is needed
        # for the x64compatible architecture identifier).
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco failed' }
      - name: Build packages
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Arch ${{ matrix.arch }}
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item packaging/out/*.exe, packaging/out/*.zip dist/
          Get-ChildItem dist
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.exe
          archive: false
          if-no-files-found: error
      - name: Upload the portable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

  # Compiles both slices and assembles the unsigned Rustket.app. No signing
  # secret reaches this job: dependency build scripts and the app's own code
  # run only here, on a VM that never sees the key (the `macos` job signs).
  macos-build:
    name: macOS universal (app)
    needs: [changelog]
    # Apple Silicon runner; the x86_64 slice is cross-compiled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
      - name: Build Rustket.app
        env:
          APP_ONLY: 1
        run: packaging/macos/build.sh
      # A tar keeps the executable bits that a zipped artifact would lose.
      - name: Archive the app
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          mkdir dist
          tar --no-mac-metadata -C packaging/out/macos -cf "dist/Rustket-$version-macos-app-unsigned.tar" Rustket.app
          ls -l dist
      - name: Upload the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*-macos-app-unsigned.tar
          archive: false
          retention-days: 1
          if-no-files-found: error

  # Signs Rustket.app and the dmg with the Developer ID Application certificate
  # of APPLE_TEAM_ID, notarizes and staples them when the signing secrets are
  # set (docs/release-signing.md). Runs no cargo and none of the app's code.
  # The secrets live in the `macos-signing` environment, which only tags v*
  # and the release-dry-run branch may use; other refs run without it and get
  # an ad hoc signed dmg. A tag build without the secrets fails unless the
  # repository variable MACOS_ALLOW_UNSIGNED is 'true'.
  macos:
    name: macOS universal (dmg)
    needs: [macos-build]
    runs-on: macos-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release-dry-run') && 'macos-signing' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing policy
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED: ${{ vars.MACOS_ALLOW_UNSIGNED }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          missing=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 \
              APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "sign=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sign=false" >>"$GITHUB_OUTPUT"
          msg="macOS signing is not configured (missing:$missing; see docs/release-signing.md)"
          if [ "$IS_TAG" = true ] && [ "$ALLOW_UNSIGNED" != true ]; then
            echo "::error::$msg. A release must be signed and notarized; set the repository variable MACOS_ALLOW_UNSIGNED=true to publish an ad hoc signed dmg instead."
            exit 1
          fi
          echo "::warning::$msg: the dmg is ad hoc signed and not notarized."
      - name: Download the unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-macos-app-unsigned.tar'
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
          skip-decompress: true
      - name: Unpack the app
        env:
          UNSIGNED: ${{ runner.temp }}/unsigned
        run: |
          set -euo pipefail
          tars=()
          while IFS= read -r f; do tars+=("$f"); done < <(find "$UNSIGNED" -type f -name '*-macos-app-unsigned.tar')
          if [ "${#tars[@]}" -ne 1 ]; then
            echo "::error::expected one unsigned app archive, found ${#tars[@]}"
            exit 1
          fi
          if tar -tf "${tars[0]}" | grep -Ev '^Rustket\.app(/|$)'; then
            echo "::error::unexpected paths in ${tars[0]}"
            exit 1
          fi
          mkdir -p packaging/out/macos
          tar -C packaging/out/macos -xf "${tars[0]}"
          rm -rf "$UNSIGNED"
      - name: Signing keychain and notary profile
        if: steps.signing.outputs.sign == 'true'
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/rustket-signing.keychain-db
          NOTARY_KEY: ${{ runner.temp }}/rustket-notary.p8
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          kc_pass="$(openssl rand -hex 32)"
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" "$SIGNING_KEYCHAIN"
          # No auto-lock during packaging and notarization (6 h).
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$kc_pass" "$SIGNING_KEYCHAIN"

          p12="$RUNNER_TEMP/rustket-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | tr -d '[:space:]' | base64 --decode >"$p12"
          if ! security import "$p12" -k "$SIGNING_KEYCHAIN" -f pkcs12 \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null; then
            rm -f "$p12"
            echo "::error::cannot import MACOS_CERTIFICATE_P12 (wrong MACOS_CERTIFICATE_PASSWORD or not base64 of a .p12?)"
            exit 1
          fi
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" \
            "$SIGNING_KEYCHAIN" >/dev/null
          # Prepend to the user search list, keeping the login keychain.
          keychains=("$SIGNING_KEYCHAIN")
          while IFS= read -r k; do
            k="$(sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//' <<<"$k")"
            [ -z "$k" ] || [ "$k" = "$SIGNING_KEYCHAIN" ] || keychains+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"

          identities="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          match="$(grep -F "\"Developer ID Application: " <<<"$identities" | grep -F "($APPLE_TEAM_ID)\"" || true)"
          if [ -z "$match" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 has no valid \"Developer ID Application\" identity of team $APPLE_TEAM_ID. Identities found:"
            echo "$identities"
            exit 1
          fi
          if [ "$(wc -l <<<"$match")" -gt 1 ]; then
            echo "::warning::several Developer ID Application identities of team $APPLE_TEAM_ID; using the first"
          fi
          # The SHA-1 is unambiguous where the name might not be.
          identity="$(head -1 <<<"$match" | awk '{ print $2 }')"
          echo "signing with: $(head -1 <<<"$match" | sed 's/^[^"]*//')"

          printf '%s' "$APPLE_API_KEY_P8" | tr -d '[:space:]' | base64 --decode >"$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          # Validates the key with Apple and stores it in the signing keychain.
          if ! xcrun notarytool store-credentials rustket-notary --key "$NOTARY_KEY" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
              --keychain "$SIGNING_KEYCHAIN" >/dev/null; then
            echo "::error::notarytool rejects APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER_ID"
            exit 1
          fi
          rm -f "$NOTARY_KEY"
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "MACOS_NOTARY_PROFILE=rustket-notary"
            echo "MACOS_NOTARY_KEYCHAIN=$SIGNING_KEYCHAIN"
          } >>"$GITHUB_ENV"
      - name: Package, sign and notarize
        env:
          PREBUILT_APP: 1
        run: packaging/macos/build.sh
      - name: Remove the signing keychain
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/rustket-signing.keychain-db
          NOTARY_KEY: ${{ runner.temp }}/rustket-notary.p8
        run: |
          if [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$NOTARY_KEY" "$RUNNER_TEMP/rustket-signing.p12"
      - name: Collect
        run: |
          mkdir dist
          cp packaging/out/*.dmg dist/
          ls -l dist
      - name: Upload the dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.dmg
          archive: false
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Every artifact of this run is one file (a package, or the unsigned
          # macOS app dropped below); keep the portable zips as they are
          # instead of extracting them.
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Collect and checksum
        run: |
          set -euo pipefail
          # Unarchived artifacts can land in per-artifact directories: flatten.
          mkdir release
          # The unsigned app is an intermediate artifact of macos-build.
          if [ -d dist ]; then
            find dist -type f -name '*-macos-app-unsigned.tar' -delete
            find dist -type f -exec mv -t release {} +
          fi
          cd release
          missing=""
          for want in '*_amd64.deb' '*.x86_64.rpm' '*-x86_64.AppImage' '*-x64-setup.exe' \
              '*-arm64-setup.exe' '*-windows-x64.zip' '*-windows-arm64.zip' '*-macos-universal.dmg'; do
            compgen -G "$want" >/dev/null || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            tree="$(cd .. && { find dist release 2>/dev/null || true; } | head -50 | tr '\n' ' ')"
            echo "::error::missing packages:$missing; files: $tree"
            exit 1
          fi
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash packaging/release-notes.sh "$VERSION" >"$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          # The CHANGELOG.md section comes first, GitHub's generated list after it.
          gh release create "$TAG" --verify-tag --title "Rustket $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${prerelease[@]}" release/*
