name: Release

# Tags v<version> build every package and publish a GitHub release. Pushing
# the `release-dry-run` branch (or a manual run) builds the same packages as
# workflow artifacts without releasing. Each package is uploaded unarchived
# (`archive: false`), so it downloads as the .deb/.rpm/.exe/.dmg itself.
on:
  push:
    tags: ['v*']
    branches: ['release-dry-run']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux x86_64 (deb, rpm, AppImage)
    # glibc 2.35 baseline: the binary runs on this release and newer.
    runs-on: ubuntu-22.04
    env:
      # Pinned appimagetool and the static AppImage runtime it embeds (no
      # runtime download at build time). Digests from the GitHub release
      # asset metadata; bump URL and hash together.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm desktop-file-utils
      - name: Download appimagetool
        run: |
          set -euo pipefail
          fetch() { # url sha256 dest
            [ -n "$2" ] || { echo "::error::expected sha256 for $1 is not set"; exit 1; }
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$3" "$1"
            echo "$2  $3" | sha256sum --check --strict
          }
          fetch "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256" "$RUNNER_TEMP/appimagetool"
          fetch "$APPIMAGE_RUNTIME_URL" "$APPIMAGE_RUNTIME_SHA256" "$RUNNER_TEMP/runtime-x86_64"
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build
        run: cargo build --locked --profile dist -p rustket --bin rustket
      - name: deb + AppImage + package checks
        env:
          SKIP_BUILD: 1
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGETOOL_ARGS: --no-appstream --runtime-file ${{ runner.temp }}/runtime-x86_64
          # The runner has no FUSE; the tool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: packaging/test.sh
      - name: rpm
        env:
          SKIP_BUILD: 1
        run: |
          set -euo pipefail
          rpm_file="$(packaging/rpm/build.sh | tail -1)"
          rpm -qpi "$rpm_file"
          rpm -qp --requires "$rpm_file"
          rpm -qp --recommends "$rpm_file"
          files="$(rpm -qpl "$rpm_file")"
          echo "$files"
          for f in /usr/bin/rustket /usr/share/applications/rustket.desktop \
              /usr/share/metainfo/rustket.metainfo.xml /usr/share/man/man1/rustket.1.gz \
              /usr/share/icons/hicolor/512x512/apps/rustket.png \
              /usr/share/doc/rustket/THIRD-PARTY-NOTICES /usr/share/licenses/rustket/LICENSE; do
            grep -qx "$f" <<<"$files" || { echo "::error::$f missing from the rpm"; exit 1; }
          done
      - name: Collect
        run: |
          mkdir dist
          cp packaging/out/*.deb packaging/out/*.rpm packaging/out/*.AppImage dist/
          ls -l dist
      - name: Upload the deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.deb
          archive: false
          if-no-files-found: error
      - name: Upload the rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.rpm
          archive: false
          if-no-files-found: error
      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.AppImage
          archive: false
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} (setup.exe, zip)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          # Native ARM64 build, same runner as ci.yml.
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: ./packaging/windows/ci-toolchain.ps1
      - name: Install Inno Setup
        shell: pwsh
        # Installs, or upgrades an older preinstalled copy (6.3+ is needed
        # for the x64compatible architecture identifier).
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco failed' }
      - name: Build packages
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Arch ${{ matrix.arch }}
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item packaging/out/*.exe, packaging/out/*.zip dist/
          Get-ChildItem dist
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.exe
          archive: false
          if-no-files-found: error
      - name: Upload the portable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

  macos:
    name: macOS universal (dmg)
    # Apple Silicon runner; the x86_64 slice is cross-compiled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
      - name: Build packages
        run: packaging/macos/build.sh
      - name: Collect
        run: |
          mkdir dist
          cp packaging/out/*.dmg dist/
          ls -l dist
      - name: Upload the dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.dmg
          archive: false
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Every artifact of this run is one package file.
          path: dist
          merge-multiple: true
      - name: Collect and checksum
        run: |
          set -euo pipefail
          # Unarchived artifacts can land in per-artifact directories: flatten.
          mkdir release
          if [ -d dist ]; then find dist -type f -exec mv -t release {} +; fi
          cd release
          missing=""
          for want in '*_amd64.deb' '*.x86_64.rpm' '*-x86_64.AppImage' '*-x64-setup.exe' \
              '*-arm64-setup.exe' '*-windows-x64.zip' '*-windows-arm64.zip' '*-macos-universal.dmg'; do
            compgen -G "$want" >/dev/null || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            tree="$(cd .. && { find dist release 2>/dev/null || true; } | head -50 | tr '\n' ' ')"
            echo "::error::missing packages:$missing; files: $tree"
            exit 1
          fi
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "Rustket $VERSION" --generate-notes \
            "${prerelease[@]}" release/*
