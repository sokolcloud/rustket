[workspace]
resolver = "3"
members = ["crates/meteor-ddp", "crates/rocketchat", "crates/rustket-core", "crates/rustket", "crates/rustket-ui"]
# Patched dependencies (vendor/*/README.rustket.md) are not workspace members.
exclude = ["vendor/winit"]

[workspace.package]
version = "0.2.11"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

# Distribution builds (packaging/deb, packaging/appimage): slower to build than
# `release`, which stays the fast daily profile. `strip = "debuginfo"` keeps the
# symbol table and `panic = "unwind"` stays, so RUST_BACKTRACE=1 still names
# functions in crash reports.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# winit without the private CGS* symbols the Mac App Store rejects (guideline
# 2.5.1); vendor/winit/README.rustket.md has the diff and when to drop it.
[patch.crates-io]
winit = { path = "vendor/winit" }
