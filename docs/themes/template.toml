# Rustket theme template, generated by `rustket --dump-theme`.
# Save it as <config dir>/themes/<id>.toml (see docs/themes/README.md),
# then pick it in Settings → Appearance → Theme.
#
# Each variant ([light], [dark]) starts from the built-in Rustket colours,
# applies its [*.palette] seeds (each seed recomputes the colours derived
# from it), then its [*.tokens] overrides. A missing variant uses the
# built-in colours. Colours: "#RGB", "#RRGGBB" or "#RRGGBBAA".
# Seeds and tokens are listed commented out with the built-in values:
# uncomment a seed (and its [*.palette] header) to derive colours from
# it, uncomment a token to pin it (a pinned token wins over the seeds).

[meta]
name = "My theme"
# name_ru = "Моя тема"
# author = ""
version = 1

# Installed system font families, for the whole theme (applied at the
# next start). A missing family keeps the built-in Noto Sans.
# [fonts]
# ui = "Inter"
# mono = "JetBrains Mono"

# Corner-radius scale: 0.0 (square) .. 2.0, default 1.0.
# [layout]
# radius = 1.0

# Seeds with the built-in values; uncomment to derive from them.
# [light.palette]
# accent = "#156FF5"  # primary buttons and their states, selection, focus ring, links, tints, unread badge
# danger = "#EC0D2A"  # destructive buttons, error text and banners, @me mentions, busy dot, mention badge
# success = "#158D65"  # success text and banners, online dot
# warning = "#F3BE08"  # warning icons and banners, @mention highlights, away dot
# background = "#FFFFFF"  # room surface; sidebar, rail, raised/sunken, hover/pressed rows, borders, tooltip
# text = "#1A1D22"  # primary text; secondary, hint and disabled text are mixed toward the background

# Tokens with the built-in values; uncomment to pin one.
