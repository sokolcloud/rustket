# Always-on Rocket.Chat workspace for Mac App Store review (see README.md).
# Sized for a 2 vCPU / 4 GB VM. MongoDB sits on an internal network without a
# port. The proxy in front comes from a second file:
# - docker-compose.override.yml (default, REVIEW_PROXY=caddy): Caddy with a
#   Let's Encrypt certificate, the only service with published ports (80, 443
#   TCP and 443 UDP for HTTP/3). Compose loads it automatically.
# - docker-compose.tunnel.yml (REVIEW_PROXY=tunnel): no Caddy; Rocket.Chat on
#   127.0.0.1 only, published through a Cloudflare Tunnel (tunnel.sh).
name: rustket-review

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    networks: [backend]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      # Initiates the single-node replica set on first start; healthy once it is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } catch (e2) {} } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1200M
    logging: *logging

  rocketchat:
    image: ${ROCKETCHAT_IMAGE:-rocketchat/rocket.chat:8.9.1}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend, edge]
    # Written by setup.sh: ADMIN_USERNAME / ADMIN_PASS / ADMIN_EMAIL / ADMIN_NAME
    # create the operator account on the very first start only.
    env_file:
      - path: ./admin.env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      ROOT_URL: https://${REVIEW_HOST:?set REVIEW_HOST in .env}
      PORT: "3000"
      DEPLOY_METHOD: docker
      # One proxy in front (Caddy, or Cloudflare's edge in tunnel mode): trust
      # one X-Forwarded-For hop so rate limits and failed-login blocking see
      # the client address.
      HTTP_FORWARDED_COUNT: "1"
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      NODE_OPTIONS: --max-old-space-size=1536
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/info').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
    logging: *logging

networks:
  # Public side: IPv6 so Caddy sees real client addresses on AAAA connections
  # (tunnel mode turns it off, nothing public listens there).
  edge:
    enable_ipv6: true
  backend:
    internal: true

volumes:
  mongo-data:
  mongo-config:
